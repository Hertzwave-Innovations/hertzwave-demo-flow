* { box-sizing: border-box; }

.cm-shell { min-height: 100vh; display: flex; flex-direction: column; }
.fade-in { animation: cmfade .25s ease; }

.cm-step { display: flex; flex-direction: column; align-items: center; flex: 1; position: relative; z-index: 1; cursor: pointer; }

.cm-main-content { padding: 1.5rem 2rem 2rem; }

.cm-section-title { font-size: 1rem; font-weight: 700; color: #2d5f4f; margin-bottom: 1rem; padding-bottom: .5rem; border-bottom: 2px solid #e8f5f1; }
.cm-btn { padding: .65rem 1.25rem; border: none; border-radius: 8px; font-size: .875rem; font-weight: 600; cursor: pointer; transition: all .2s; display: inline-flex; align-items: center; gap: .4rem; }

d":"c_p9_e1_privacy","n":"Under Section C, Principle 9, Leadership Indicator 5a, provide the Number of instances of data breaches along-with impact","a":"NA","t":"NA","c":0,"ct":"na","m":true,"s":"Section_C"},{"id":"c_p9_e1_privacy_2","n":"Under Section C, Principle 9, Leadership Indicator 5b, provide the Percentage of data breaches involving personally identifiable information of customers","a":"NA","t":"NA","c":0,"ct":"na","m":true,"s":"Section_C"},{"id":"c_p2_e3b","n":"Principle 2 E3: % of recycled/reused input material — category (b)","a":"14","t":"Verified DB Data","c":100,"ct":"verified","m":true,"s":"Section_C"},{"id":"c_p2_e3c","n":"Principle 2 E3: % of recycled/reused input material — category (c)","a":"8","t":"Verified DB Data","c":100,"ct":"verified","m":true,"s":"Section_C"},{"id":"c_p2_e3d","n":"Principle 2 E3: % of recycled/reused input material — category (d)","a":"5","t":"Verified DB Data","c":100,"ct":"verified","m":true,"s":"Section_C"},{"id":"c_p2_e4_line","n":"Principle 2 E4: Extended Producer Responsibility plan applicability","a":"Applicable — IT asset & e-waste EPR","t":"Verified DB Data","c":100,"ct":"verified","m":true,"s":"Section_C"},{"id":"c_p2_e4_link","n":"Principle 2 E4: weblink to EPR plan","a":"https://www.tcs.com/epr-plan","t":"Verified DB Data","c":100,"ct":"verified","m":true,"s":"Section_C"},{"id":"c_p2_l3_mat_2","n":"Principle 2 L3: recycled input material (entry 2)","a":"Refurbished IT hardware","t":"Verified DB Data","c":100,"ct":"verified","m":true,"s":"Section_C"},{"id":"c_p2_l3_perc_curr_2","n":"Principle 2 L3: recycled input % current FY (entry 2)","a":"22","t":"Verified DB Data","c":100,"ct":"verified","m":true,"s":"Section_C"},{"id":"c_p2_l3_perc_prev_2","n":"Principle 2 L3: recycled input % previous FY (entry 2)","a":"19","t":"Verified DB Data","c":100,"ct":"verified","m":true,"s":"Section_C"},{"id":"c_p2_l5_cat_2","n":"Principle 2 L5: reclaimed product category (entry 2)","a":"Reclaimed e-waste","t":"Verified DB Data","c":100,"ct":"verified","m":true,"s":"Section_C"},{"id":"c_p2_l5_perc_2","n":"Principle 2 L5: reclaimed % (entry 2)","a":"88","t":"Verified DB Data","c":100,"ct":"verified","m":true,"s":"Section_C"},{"id":"c_p6_l1_assurance","n":"Principle 6 L1 (energy/RE): assurance type","a":"Reasonable assurance","t":"Verified DB Data","c":100,"ct":"verified","m":true,"s":"Section_C"},{"id":"c_p6_l2_assurance","n":"Principle 6 L2 (water): assurance type","a":"Reasonable assurance","t":"Verified DB Data","c":100,"ct":"verified","m":true,"s":"Section_C"},{"id":"c_p6_l3_assurance","n":"Principle 6 L3 (emissions): assurance type","a":"Reasonable assurance","t":"Verified DB Data","c":100,"ct":"verified","m":true,"s":"Section_C"},{"id":"c_p6_l4_assurance","n":"Principle 6 L4 (Scope 3): assurance type","a":"Limited assurance","t":"Verified DB Data","c":100,"ct":"verified","m":true,"s":"Section_C"}]};

<script>
/* ============================ HWCAP Compliance Mapper — demo runtime ============================ */
const COMPANY = DEMO.company || 'Tata Consultancy Services Limited';
const FY = 'FY 2024-25';
const STEP_TITLES = {
  1: { title: 'Select Framework', desc: 'Choose your reporting framework to begin generating your report' },
  2: { title: 'Fill Indicators', desc: 'Complete the indicators below' },
  3: { title: 'Review & Validate', desc: 'Review your data and validation results' },
  4: { title: 'Preview Report', desc: 'Preview your generated report' },
  5: { title: 'Export', desc: 'Download your report in various formats' },
};
const STEP_NAMES = ['Select Framework', 'Fill Indicators', 'Review & Validate', 'Preview Report', 'Export'];
const PAGE_TARGET = 50;
const PDF_FILE = 'TCS_BRSR_Report.pdf'; // place the generated PDF next to this html

/* ---- state ---- */
const S = {
  step: 1,
  search: '',
  filter: 'All',
  page: 0,
  drafts: {},            // fieldId -> in-progress textarea value
  showIncomplete: false,
  showFiller: false,
  fillerEdits: {},
  generated: false,
};

/* ---- data: rebuild sections from the flat field list (preserve order) ---- */
function buildSections() {
  const order = []; const byKey = {};
  for (const f of DEMO.fields) {
    const k = f.s || 'Section';
    if (!byKey[k]) { byKey[k] = { sectionName: k, fields: [] }; order.push(k); }
    byKey[k].fields.push(f);
  }
  return order.map(k => byKey[k]);
}
const ALL_SECTIONS = buildSections();

/* ---- helpers (ported from ReviewFieldList / ConfigureData) ---- */
function san(raw, tag) {
  let v = (raw == null ? '' : String(raw)).trim();
  if (!v || tag === 'query') return '';
  const l = v.toLowerCase();
  if (l === 'query' || l === 'null' || l === 'undefined') return '';
  if (/^select\s+/i.test(v)) return '';
  return v;
}
function isFilled(f) {
  if (f.t === 'NA' || f.t === 'query') return false;
  return !!san(f.a, f.t);
}
function sectionLetter(name) {
  const m = String(name || '').match(/section[_\s-]*([a-z])/i);
  return (m ? m[1] : (String(name || '?').trim()[0] || '?')).toUpperCase();
}
function principleKey(f) {
  const id = String(f.id || '');
  const m = id.match(/(?:^|_)p(\d)(?:_|$)/i) || String(f.n || '').match(/principle\s+(\d)/i);
  return m ? ('P' + m[1]) : null;
}
function sectionStats(fields) {
  const total = fields.length;
  const completed = fields.filter(isFilled).length;
  return { total, completed, pct: total ? Math.round(completed / total * 100) : 0 };
}
function overallStats() {
  let total = 0, completed = 0;
  for (const s of ALL_SECTIONS) { total += s.fields.length; completed += s.fields.filter(isFilled).length; }
  return { total, completed, pending: total - completed, pct: total ? Math.round(completed / total * 100) : 0 };
}

/* ---- filtering (search + tag filter) ---- */
function filteredSections() {
  const term = S.search.toLowerCase();
  const incomplete = (f) => {
    if (f.t === 'NA' || f.t === 'query') return true;
    return !san(f.a, f.t);
  };
  return ALL_SECTIONS.map(sec => ({
    sectionName: sec.sectionName,
    fields: sec.fields.filter(f => {
      const hay = (f.n + ' ' + f.a).toLowerCase();
      if (term && !hay.includes(term)) return false;
      if (S.filter === 'Pending') return incomplete(f);
      if (S.filter === 'Complete') return !incomplete(f);
      if (S.filter === 'Auto-Calculated') return f.t === 'AI-generated';
      return true;
    })
  })).filter(s => s.fields.length > 0);
}

/* ---- pagination: section/principle-aware ~50 (ported from buildReviewPages) ---- */
function buildPages(sections) {
  const out = [];
  for (const section of sections) {
    const letter = sectionLetter(section.sectionName);
    const groups = []; const gi = {};
    for (const f of section.fields) {
      const k = principleKey(f); const kk = k || '__base__';
      if (gi[kk] === undefined) { gi[kk] = groups.length; groups.push({ key: k, fields: [] }); }
      groups[gi[kk]].fields.push(f);
    }
    const raw = []; let bucket = []; let count = 0;
    const flush = () => { if (bucket.length) { raw.push({ keys: bucket.map(b => b.key).filter(Boolean), fields: bucket.flatMap(b => b.fields) }); bucket = []; count = 0; } };
    for (const g of groups) {
      if (g.fields.length > PAGE_TARGET) {
        flush();
        for (let i = 0; i < g.fields.length; i += PAGE_TARGET) raw.push({ keys: g.key ? [g.key] : [], fields: g.fields.slice(i, i + PAGE_TARGET) });
        continue;
      }
      if (count + g.fields.length > PAGE_TARGET && bucket.length) flush();
      bucket.push(g); count += g.fields.length;
    }
    flush();
    const draft = raw.map(r => {
      const nums = [...new Set(r.keys.map(k => k.slice(1)))];
      const sub = nums.length === 1 ? ('Principle ' + nums[0]) : nums.length > 1 ? ('Principles ' + nums.join(', ')) : '';
      return {
        baseTitle: sub ? ('Section ' + letter + ' · ' + sub) : ('Section ' + letter),
        shortBase: r.keys.length ? (nums.length === 1 ? ('P' + nums[0]) : ('P' + nums[0] + '–' + nums[nums.length - 1])) : letter,
        fields: r.fields,
      };
    });
    const counts = {}; draft.forEach(p => counts[p.baseTitle] = (counts[p.baseTitle] || 0) + 1);
    const seen = {};
    for (const p of draft) {
      let title = p.baseTitle, short = p.shortBase;
      if (counts[p.baseTitle] > 1) { seen[p.baseTitle] = (seen[p.baseTitle] || 0) + 1; title = p.baseTitle + ' (' + seen[p.baseTitle] + ' of ' + counts[p.baseTitle] + ')'; short = p.shortBase + '·' + seen[p.baseTitle]; }
      const st = sectionStats(p.fields);
      out.push({ title, short, pct: st.pct, total: st.total, completed: st.completed, sectionName: section.sectionName, fields: p.fields });
    }
  }
  return out;
}

/* ---- escaping ---- */
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

/* ================================ RENDER ================================ */
function render() {
  const h = STEP_TITLES[S.step];
  let body = '';
  if (S.step === 1) body = renderStep1();
  else if (S.step === 2) body = renderStep2();
  else if (S.step === 3) body = renderStep3();
  else if (S.step === 4) body = renderStep4();
  else if (S.step === 5) body = renderStep5();

  document.getElementById('app').innerHTML =
    '<div class="cm-progress-section">' +
      '<div class="cm-page-header"><h1>' + esc(h.title) + '</h1><p>' + esc(h.desc) + '</p></div>' +
      renderStepper() +
    '</div>' +
    '<div class="cm-main-content fade-in">' + body + '</div>' +
    (S.showIncomplete ? renderIncompleteDialog() : '') +
    (S.showFiller ? renderFiller() : '');

  // auto-grow textareas
  document.querySelectorAll('textarea.cm-ind-input').forEach(t => { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 240) + 'px'; });
}

function renderStepper() {
  let out = '<div class="cm-step-indicator">';
  for (let i = 0; i < 5; i++) {
    const n = i + 1;
    const cls = n < S.step ? 'cm-completed' : n === S.step ? 'cm-active' : '';
    out += '<div class="cm-step ' + cls + '" onclick="cm.goStep(' + n + ')">' +
      '<div class="cm-step-circle">' + (n < S.step ? '✓' : n) + '</div>' +
      '<div class="cm-step-label">' + STEP_NAMES[i] + '</div></div>';
  }
  return out + '</div>';
}

/* ---------- STEP 1: Select Framework ---------- */
function renderStep1() {
  return '<div class="cm-content-card">' +
    '<div style="display:flex;gap:1rem;flex-wrap:wrap;align-items:flex-end">' +
      '<div style="flex:2;min-width:260px"><label style="display:block;font-size:.85rem;font-weight:600;color:#2d5f4f;margin-bottom:.4rem">Select Framework</label>' +
        '<select class="cm-fw-select" style="width:100%;padding:.6rem 1rem;border:1px solid #ddd;border-radius:8px;font-size:.875rem;background:#fff;color:#0f172a">' +
          '<optgroup label="🇮🇳 India">' +
            '<option selected>SEBI BRSR &amp; BRSR CORE 2024</option>' +
            '<option disabled>CII GreenCo Rating</option>' +
          '</optgroup>' +
          '<optgroup label="🌏 Global">' +
            '<option disabled>GRI Standards 2021</option>' +
            '<option disabled>ISSB S2 Climate Disclosures — Coming soon</option>' +
            '<option disabled>CDP Climate Change — Coming soon</option>' +
          '</optgroup>' +
          '<optgroup label="🏛️ Regulatory"><option disabled>EU CSRD (ESRS E1) — Coming soon</option><option disabled>EU CBAM — Coming soon</option></optgroup>' +
        '</select></div>' +
      '<div style="flex:1;min-width:160px"><label style="display:block;font-size:.85rem;font-weight:600;color:#2d5f4f;margin-bottom:.4rem">Reporting Period</label>' +
        '<select style="width:100%;padding:.6rem 1rem;border:1px solid #ddd;border-radius:8px;font-size:.875rem;background:#fff;color:#0f172a"><option selected>FY 2024-25 (Apr 2024 – Mar 2025)</option><option>FY 2023-24</option></select></div>' +
    '</div>' +
    '<div class="cm-section-title" style="margin-top:1.25rem;margin-bottom:.75rem">Framework Configuration</div>' +
    '<div class="cm-fw-detail-panel">' +
      detailRow('Framework', 'SEBI BRSR &amp; BRSR CORE 2024 (regulator-aligned, XBRL-mapped)') +
      detailRow('Jurisdiction', 'India — Securities and Exchange Board of India (SEBI)') +
      detailRow('Reporting Entity', esc(COMPANY)) +
      detailRow('Reporting Period', 'FY 2024-25 (01 Apr 2024 – 31 Mar 2025)') +
      detailRow('Total Disclosures', overallStats().total + ' indicators across Sections A, B and C (Principles 1–9)') +
      detailRow('Assurance', 'BRSR Core — reasonable assurance on 9 attributes') +
      detailRow('Output Formats', 'PDF (Professional / Executive / Modern) · XBRL instance') +
    '</div>' +
    '<div class="cm-btn-group"><div></div><div class="cm-right-btns">' +
      '<button class="cm-btn cm-btn-primary" onclick="cm.goStep(2)">Next: Fill Indicators →</button>' +
    '</div></div></div>';
}
function detailRow(k, v) { return '<div class="cm-detail-row"><div class="cm-detail-label">' + k + '</div><div class="cm-detail-value">' + v + '</div></div>'; }

/* ---------- STEP 2: Fill Indicators (paginated review) ---------- */
function renderStep2() {
  const ov = overallStats();
  const fs = filteredSections();
  const pages = buildPages(fs);
  if (S.page > pages.length - 1) S.page = Math.max(0, pages.length - 1);
  const page = pages[S.page];

  // stats bar
  let out = '<div class="cm-completion-bar-wrap">' +
    statChip(ov.total, 'Total') + statChip(ov.completed, 'Complete') + statChip(ov.pending, 'Pending', '#d97706') +
    '<div class="cm-bar-outer"><div class="cm-bar-inner" style="width:' + ov.pct + '%"></div></div>' +
    statChip(ov.pct + '%', 'Done', '#3d7f6f') + '</div>';

  // filter bar
  out += '<div class="cm-filter-bar"><div style="display:flex;gap:5px;background:#f0f4f3;padding:5px;border-radius:8px">';
  ['All', 'Pending', 'Complete', 'Auto-Calculated'].forEach(f => {
    out += '<button class="cm-filter-btn ' + (S.filter === f ? 'cm-active' : '') + '" onclick="cm.setFilter(\'' + f + '\')">' + f + '</button>';
  });
  out += '</div><div style="position:relative;flex:1;max-width:300px"><input class="cm-search-input" style="width:100%;padding-left:14px" placeholder="Search indicators..." value="' + esc(S.search) + '" oninput="cm.setSearch(this.value)"></div></div>';

  // page navigator
  out += renderNavigator(pages);

  // current page
  out += '<div style="margin-top:1.25rem">';
  if (page) {
    const st = sectionStats(page.fields);
    out += '<div class="cm-category-group">' +
      '<div class="cm-category-header">' +
        '<div style="display:flex;align-items:center;gap:.5rem"><span>' + esc(page.title) + '</span>' +
          '<span style="margin-left:10px;font-size:.7rem;padding:.1rem .5rem;background:#fff;border-radius:20px;color:#2d5f4f;font-weight:bold">' + st.completed + '/' + st.total + '</span></div>' +
        '<div style="height:6px;width:80px;background:#e0e0e0;border-radius:10px;overflow:hidden"><div style="height:100%;background:#3d7f6f;width:' + st.pct + '%"></div></div>' +
      '</div>' +
      '<div style="margin-top:1rem">' + page.fields.map(renderFieldRow).join('') + '</div></div>';
  } else {
    out += '<div class="cm-content-card" style="padding:2.5rem;text-align:center;color:#64748b">No fields match the current filter.</div>';
  }
  out += '</div>';

  // sticky action bar
  out += '<div style="position:sticky;bottom:0;z-index:20;margin-top:1.5rem;background:#fff;border-top:1px solid #e5e7eb;box-shadow:0 -4px 14px rgba(15,23,42,.06);padding:.85rem .25rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap">' +
    '<button class="cm-btn cm-btn-secondary" onclick="cm.goStep(1)">← Back: Framework</button>';
  if (pages.length > 1) {
    out += '<div style="display:flex;align-items:center;gap:.6rem;color:#475569;font-size:.85rem;font-weight:600">' +
      '<button class="cm-btn cm-btn-secondary" style="padding:.35rem .6rem;opacity:' + (S.page <= 0 ? '.4' : '1') + '" onclick="cm.goPage(' + (S.page - 1) + ')">‹</button>' +
      '<span style="min-width:110px;text-align:center">Page ' + (S.page + 1) + ' of ' + pages.length + '</span>' +
      '<button class="cm-btn cm-btn-secondary" style="padding:.35rem .6rem;opacity:' + (S.page >= pages.length - 1 ? '.4' : '1') + '" onclick="cm.goPage(' + (S.page + 1) + ')">›</button></div>';
  }
  out += '<button class="cm-btn cm-btn-primary" onclick="cm.submitReview()">Submit &amp; Continue →</button></div>';
  return out;
}
function statChip(v, l, color) { return '<div class="cm-stat-chip"><div class="cm-stat-val"' + (color ? ' style="color:' + color + '"' : '') + '>' + v + '</div><div class="cm-stat-lbl">' + l + '</div></div>'; }

function renderNavigator(pages) {
  if (pages.length <= 1) return '';
  let out = '<div style="display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;max-height:132px;overflow-y:auto">';
  pages.forEach((p, i) => {
    const cur = i === S.page;
    const c = p.pct >= 100 ? ['#dcfce7', '#86efac', '#166534'] : p.pct > 0 ? ['#fef9c3', '#fde047', '#854d0e'] : ['#f1f5f9', '#e2e8f0', '#64748b'];
    out += '<button title="' + esc(p.title) + ' — ' + p.completed + '/' + p.total + ' (' + p.pct + '%)" onclick="cm.goPage(' + i + ')" ' +
      'style="display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:8px;font-size:.72rem;font-weight:600;cursor:pointer;white-space:nowrap;' +
      'background:' + (cur ? '#2d5f4f' : c[0]) + ';color:' + (cur ? '#fff' : c[2]) + ';border:1px solid ' + (cur ? '#2d5f4f' : c[1]) + '">' +
      '<span>' + esc(p.short) + '</span><span style="font-size:.64rem;font-weight:700;opacity:.9">' + p.pct + '%</span></button>';
  });
  return out + '</div>';
}

function renderFieldRow(f) {
  const draft = S.drafts[f.id];
  const val = draft !== undefined ? draft : san(f.a, f.t);
  const pending = !san(draft !== undefined ? draft : f.a, f.t) || f.t === 'NA' || f.t === 'query';
  const modified = draft !== undefined && san(draft, f.t) !== san(f.a, f.t);
  const rowCls = pending ? 'cm-row-pending' : f.t === 'User Edited' ? 'cm-row-complete' : f.ct === 'verified' ? 'cm-row-verified' : f.ct === 'review' ? 'cm-row-review' : f.ct === 'critical' ? 'cm-row-critical' : f.t === 'AI-generated' ? 'cm-row-calculated' : 'cm-row-complete';
  const label = String(f.n || '').replace(/^AI[\s:/-]+/i, '');
  return '<div class="cm-indicator-row ' + rowCls + '">' +
    '<div class="cm-ind-meta"><div class="cm-ind-name" title="' + esc(label) + '" style="font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.01em">' + esc(label.slice(0, 130)) + (f.m ? ' <span style="color:red">*</span>' : '') + '</div></div>' +
    '<div class="cm-ind-input-wrap"><textarea class="cm-ind-input" rows="1" style="resize:vertical;min-height:38px;overflow:hidden" placeholder="Enter reported data..." ' +
      'oninput="cm.onEdit(\'' + esc(f.id) + '\',this)">' + esc(val) + '</textarea></div>' +
    '<div class="cm-ind-actions">' + statusBadge(f, pending) +
      '<button class="cm-save-btn" data-save="' + esc(f.id) + '" ' + (modified ? '' : 'disabled') + ' ' +
        'style="opacity:' + (modified ? '1' : '.5') + ';cursor:' + (modified ? 'pointer' : 'not-allowed') + ';background:' + (modified ? '' : '#f5f5f5') + ';color:' + (modified ? '' : '#bbb') + '" onclick="cm.onSave(\'' + esc(f.id) + '\')">Save</button>' +
    '</div></div>';
}
function statusBadge(f, pending) {
  const score = (f.c != null) ? (f.c + '%') : '';
  if (pending) return '<span class="cm-badge cm-badge-warning">⚠ Pending</span>';
  if (f.t === 'User Edited') return '<span class="cm-badge cm-badge-info">Edited</span>';
  if (f.ct === 'verified') return '<span class="cm-badge cm-badge-verified">✓ Verified ' + score + '</span>';
  if (f.ct === 'review') return '<span class="cm-badge cm-badge-review">◎ Review ' + score + '</span>';
  if (f.ct === 'critical') return '<span class="cm-badge cm-badge-critical">⚡ Critical ' + score + '</span>';
  if (f.t === 'AI-generated') return '<span class="cm-badge cm-badge-calc">AI ' + score + '</span>';
  return '<span class="cm-badge cm-badge-success">Complete ' + score + '</span>';
}

/* ---------- incomplete dialog ---------- */
function renderIncompleteDialog() {
  const ov = overallStats();
  return '<div class="cm-modal-overlay" onclick="cm.closeIncomplete()"><div class="fade-in" onclick="event.stopPropagation()" style="background:#fff;border-radius:14px;max-width:460px;width:100%;padding:1.75rem;box-shadow:0 20px 50px rgba(15,23,42,.25)">' +
    '<div style="display:flex;gap:.85rem;align-items:flex-start"><div style="color:#d97706;font-size:1.6rem;line-height:1">⚠</div><div>' +
      '<h3 style="margin:0;font-size:1.15rem;font-weight:700;color:#0f172a">Form not fully entered</h3>' +
      '<p style="margin:.5rem 0 0;color:#475569;font-size:.92rem;line-height:1.55"><strong>' + ov.pending + '</strong> of <strong>' + ov.total + '</strong> fields are still unfilled (' + ov.pct + '% complete). You can proceed and generate the report now — your progress is saved, so you can resume and finish the remaining fields anytime.</p></div></div>' +
    '<div style="display:flex;flex-wrap:wrap;gap:.6rem;justify-content:flex-end;margin-top:1.5rem">' +
      '<button class="cm-btn cm-btn-secondary" onclick="cm.firstIncomplete()">Go to first incomplete page</button>' +
      '<button class="cm-btn cm-btn-secondary" onclick="cm.closeIncomplete()">Keep reviewing</button>' +
      '<button class="cm-btn cm-btn-primary" onclick="cm.proceedAnyway()">Proceed anyway →</button>' +
    '</div></div></div>';
}

/* ---------- STEP 3: Review & Validate ---------- */
function renderStep3() {
  const ov = overallStats();
  const mandTotal = Math.floor(ov.total * 0.2);
  const checks = [
    { type: 'cm-pass', icon: '✓', title: 'All ' + mandTotal + ' mandatory indicators complete', desc: 'Required disclosures are filled — report can proceed to preview.' },
    { type: ov.pct >= 50 ? 'cm-pass' : 'cm-warn', icon: ov.pct >= 50 ? '✓' : '!', title: 'Overall completion: ' + ov.pct + '% (' + ov.completed + '/' + ov.total + ' indicators)', desc: ov.pct >= 80 ? 'Excellent coverage — strong disclosure.' : ov.pct >= 50 ? 'Good coverage. Consider filling optional indicators for a comprehensive report.' : 'Pending indicators render as "-" in the report. You can still generate and update later.' },
    { type: ov.pending <= 5 ? 'cm-pass' : 'cm-warn', icon: ov.pending <= 5 ? '✓' : '!', title: ov.pending + ' pending indicators remaining', desc: ov.pending + ' indicator(s) will appear as "-" in the report. You can still generate and update later.' },
    { type: 'cm-pass', icon: '✓', title: 'Framework: SEBI BRSR & BRSR CORE 2024', desc: 'India · SEBI · ' + ov.total + ' total indicators mapped across Sections A/B/C.' },
    { type: 'cm-pass', icon: '✓', title: 'Auto-calculated indicators verified', desc: Math.floor(ov.total * 0.1) + ' intensity/ratio metrics auto-computed from raw data — no manual entry required.' },
  ];
  return '<div class="cm-content-card"><div class="cm-section-title">Data Quality Validation</div><div class="cm-validation-list">' +
    checks.map(c => '<div class="cm-val-item ' + c.type + '"><div class="cm-val-icon ' + c.type + '">' + c.icon + '</div><div class="cm-val-text"><h4>' + esc(c.title) + '</h4><p>' + esc(c.desc) + '</p></div></div>').join('') +
    '</div></div>' +
    '<div class="cm-btn-group"><button class="cm-btn cm-btn-secondary" onclick="cm.goStep(2)">‹ Back</button><div class="cm-right-btns"><button class="cm-btn cm-btn-primary" onclick="cm.goStep(4)">Next: Preview ›</button></div></div>';
}

/* ---------- STEP 4: Preview Report ---------- */
function findAns(keywords) {
  for (const s of ALL_SECTIONS) for (const f of s.fields) {
    const hay = (f.n || '').toLowerCase();
    if (keywords.some(k => hay.includes(k)) && san(f.a, f.t) && f.t !== 'NA') return f.a;
  }
  return null;
}
function renderStep4() {
  const ov = overallStats();
  const blocks = [
    { cat: 'Section A — General Disclosures', rows: [
      ['CIN', 'Corporate Identity Number', findAns(['corporate identity number', 'cin'])],
      ['COMPANY', 'Name of the listed entity', COMPANY],
      ['YEAR', 'Year of incorporation', findAns(['year of incorporation'])],
      ['EMPLOYEES', 'Total employees', findAns(['total number of employees', 'total employees'])],
    ]},
    { cat: 'Principle 6 — Environmental Stewardship', rows: [
      ['SCOPE1', 'Total Scope 1 emissions (tCO2e)', findAns(['total scope 1 emissions'])],
      ['SCOPE2', 'Total Scope 2 emissions (tCO2e)', findAns(['total scope 2 emissions'])],
      ['ENERGY', 'Total energy consumption', findAns(['total energy consumed', 'total energy consumption'])],
      ['WATER', 'Total water withdrawal', findAns(['total volume of water withdrawal', 'water withdrawal'])],
    ]},
    { cat: 'Editorial — AI-synthesized narrative', rows: [
      ['LEADERSHIP', 'Leadership message', findAns(['leadership', 'director responsible'])],
      ['ABOUT', 'About this report', findAns(['business responsibility', 'about'])],
    ]},
  ];
  return '<div class="cm-content-card"><div class="cm-info-box"><strong>SEBI BRSR – ' + esc(COMPANY) + ' ' + FY + '</strong><br><span style="font-size:.8rem;color:#555">Review the synthesized narratives and performance overview. You can still modify data if needed.</span></div>' +
    '<div class="cm-preview-frame">' +
      '<div style="text-align:center;padding:1rem 0 1.5rem;border-bottom:2px solid #e0e0e0;margin-bottom:1.25rem">' +
        '<div style="font-size:1.1rem;font-weight:800;color:#2d5f4f">SEBI BRSR & BRSR CORE 2024</div>' +
        '<div style="font-size:.85rem;color:#666;margin-top:.25rem">' + esc(COMPANY) + ' | ' + FY + ' | India · SEBI</div>' +
        '<div style="margin-top:.5rem;display:flex;justify-content:center;gap:1.5rem;font-size:.8rem;color:#555"><span>✅ ' + ov.completed + ' indicators populated</span><span>📊 ' + ov.total + ' total disclosures</span></div></div>' +
      blocks.map(b => '<div class="cm-preview-section-block"><h4>' + b.cat + '</h4>' +
        b.rows.map(r => { const pend = !r[2]; const a = r[2] ? String(r[2]) : '[Data Pending]'; return '<div style="display:flex;gap:.75rem;padding:.35rem 0;border-bottom:1px solid #f0f0f0;font-size:.82rem"><span style="width:120px;flex-shrink:0;font-weight:600;color:#2d5f4f">' + r[0] + '</span><span style="flex:1;color:#444">' + esc(r[1]) + '</span><span style="min-width:220px;color:' + (pend ? '#d97706' : '#333') + ';font-style:' + (pend ? 'italic' : 'normal') + '">' + esc(a.length > 100 ? a.slice(0, 100) + '…' : a) + '</span></div>'; }).join('') +
        '</div>').join('') +
      '<div style="margin-top:2rem;padding:1rem;background:#f9fafb;border-radius:8px;border:1px dashed #d1d5db;text-align:center"><p style="font-size:.8rem;color:#6b7280;margin:0">💡 This summary shows key highlights. The full PDF includes all ' + ov.completed + ' populated fields, structured per SEBI BRSR Core.</p></div>' +
    '</div></div>' +
    '<div class="cm-btn-group"><button class="cm-btn cm-btn-secondary" onclick="cm.goStep(3)">‹ Back</button><div class="cm-right-btns"><button class="cm-btn cm-btn-primary" onclick="cm.goStep(5)">Approve & Next ›</button></div></div>';
}

/* ---------- STEP 5: Export ---------- */
function renderStep5() {
  const ov = overallStats();
  const summary = [
    ['Company', esc(COMPANY)], ['Framework', 'SEBI BRSR & BRSR CORE 2024'], ['Reporting Period', FY + ' (Apr 2024 – Mar 2025)'],
    ['Indicators Complete', ov.completed + ' of ' + ov.total + ' (' + ov.pct + '%)'], ['Mandatory Indicators', Math.floor(ov.completed * 0.2) + ' of ' + Math.floor(ov.total * 0.2)],
    ['Report Type', 'BRSR + BRSR Core (assured) · XBRL-ready'], ['Generated By', 'HWCAP – Hertzwave Carbon Accounting Platform'],
  ];
  let out = '<div class="cm-btn-group" style="margin-bottom:1rem"><button class="cm-btn cm-btn-secondary" onclick="cm.goStep(4)">← Back</button></div>' +
    '<div class="cm-content-card" style="display:flex;gap:2rem;flex-wrap:wrap;margin-bottom:2rem">' +
      '<div style="flex:1 1 400px"><h3 style="color:#2d5f4f;font-size:1.05rem;margin:0 0 1rem">Reporting Summary</h3>' +
        '<table style="width:100%;border-collapse:collapse;font-size:.85rem"><tbody>' +
          summary.map(r => '<tr style="border-bottom:1px solid #eee"><td style="padding:.5rem;font-weight:600;color:#555;width:220px">' + r[0] + '</td><td style="padding:.5rem;color:#333">' + r[1] + '</td></tr>').join('') +
        '</tbody></table></div>' +
      '<div style="flex:1 1 300px;display:flex;flex-direction:column;gap:1.5rem;background:#f8fafc;padding:2rem;border-radius:8px;border:1px solid #e2e8f0">' +
        '<div style="text-align:center"><div style="font-size:2.2rem">📤</div><h3 style="margin:.25rem 0 0;color:#1e293b;font-size:1.1rem">Generate Final Report</h3></div>' +
        '<div style="display:flex;flex-direction:column;gap:.5rem;padding:.85rem;background:#fff;border-radius:8px;border:1px solid #e2e8f0"><label style="font-size:.85rem;font-weight:600;color:#334155">BRSR template style</label>' +
          '<select style="width:100%;padding:.7rem .8rem;border-radius:6px;border:1px solid #cbd5e1;background:#fff;color:#0f172a;font-size:.9rem"><option selected>Professional</option><option>Executive</option><option>Modern</option></select></div>' +
        '<div style="display:flex;flex-direction:column;gap:.75rem">' +
          exportRow('📄', 'PDF report (.pdf)', 'READY', '#16a34a') +
          exportRow('🧾', 'XBRL Instance (.xbrl)', 'READY', '#16a34a') +
          exportRow('📊', 'Excel Spreadsheet (.xlsx)', 'COMING SOON', '#64748b') +
          exportRow('📝', 'Word Document (.docx)', 'COMING SOON', '#64748b') +
        '</div>' +
        (S.generated
          ? '<button class="cm-btn cm-btn-secondary" style="width:100%;padding:.85rem;font-size:1rem;background:#cbd5e1;color:#475569;cursor:not-allowed" disabled>✓ Reports generated</button>'
          : '<button class="cm-btn cm-btn-success" style="width:100%;padding:.85rem;font-size:1rem;background:#3d7f6f" onclick="cm.openFiller()">✨ Generate All Reports</button>') +
      '</div></div>' +
    '<div class="cm-content-card" style="padding:1.5rem"><h3 style="color:#2d5f4f;font-size:1.05rem;margin:0 0 1rem">Report History &amp; Downloads</h3>';
  if (!S.generated) {
    out += '<div style="padding:2rem;text-align:center;color:#64748b;background:#f8fafc;border-radius:6px">No reports generated yet. Click Generate above to start.</div>';
  } else {
    const name = COMPANY.replace(/\s+/g, '_') + '_brsr-sebi-2024_professional_2025-03-31';
    out += '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem;text-align:left">' +
      '<thead><tr style="border-bottom:2px solid #e2e8f0;color:#475569"><th style="padding:.75rem">Report Name</th><th style="padding:.75rem">Status</th><th style="padding:.75rem">Generated On</th><th style="padding:.75rem;text-align:right">Actions</th></tr></thead><tbody>' +
      '<tr style="border-bottom:1px solid #e2e8f0"><td style="padding:.75rem;font-weight:500;color:#0f172a">' + esc(name) + '</td>' +
        '<td style="padding:.75rem"><span style="background:#dcfce7;color:#166534;padding:.25rem .5rem;border-radius:4px;font-size:.75rem;font-weight:600">Completed</span></td>' +
        '<td style="padding:.75rem;color:#64748b">Jun 17, 2025, 04:51 AM</td>' +
        '<td style="padding:.75rem;text-align:right"><div style="display:inline-flex;gap:.5rem;justify-content:flex-end">' +
          '<a href="' + PDF_FILE + '" target="_blank" class="cm-btn" style="padding:.25rem .75rem;font-size:.75rem;background:#eff6ff;color:#1d4ed8;border:1px solid transparent;text-decoration:none">👁 View</a>' +
          '<a href="' + PDF_FILE + '" download class="cm-btn" style="padding:.25rem .75rem;font-size:.75rem;background:#e8f5f1;color:#2d5f4f;border:1px solid transparent;text-decoration:none">⬇ PDF</a>' +
          '<button class="cm-btn" style="padding:.25rem .75rem;font-size:.75rem;background:#eef2ff;color:#4338ca;border:1px solid transparent">⬇ XBRL</button>' +
        '</div></td></tr></tbody></table></div>';
  }
  return out + '</div>';
}
function exportRow(icon, label, tag, color) {
  return '<div style="display:flex;align-items:center;justify-content:space-between;padding:.75rem;background:#fff;border-radius:6px;border:1px solid #e2e8f0">' +
    '<div style="display:flex;align-items:center;gap:10px"><span>' + icon + '</span><span style="font-size:.9rem;font-weight:500">' + label + '</span></div>' +
    '<span style="font-size:.7rem;color:' + color + ';font-weight:600;' + (tag === 'READY' ? 'background:#f0fdf4;padding:2px 6px;border-radius:4px' : '') + '">' + tag + '</span></div>';
}

/* ---------- Filler review modal ---------- */
const FILLERS = [
  { key: 'leadershipMessage', label: 'Leadership message', value: 'At Tata Consultancy Services Limited, responsible business conduct remained integrated with strategy, governance, risk management and stakeholder engagement throughout FY 2024-25. The organisation continued to strengthen environmental stewardship, employee well-being, ethical conduct and transparent disclosure in alignment with the SEBI BRSR framework.' },
  { key: 'aboutThisReport', label: 'About this report', value: 'This Business Responsibility and Sustainability Report covers 01 April 2024 to 31 March 2025 and has been prepared in accordance with the SEBI BRSR format (updated 2023), with detailed coverage of governance, workforce, environmental, stakeholder and principle-wise performance disclosures.' },
  { key: 'sectionASummary', label: 'Section A summary', value: 'Section A presents the corporate profile, products and services, operational footprint, holding structure, CSR coverage and a consolidated view of stakeholder complaints for the reporting year.' },
  { key: 'sectionCSummary', label: 'Section C summary', value: 'Across Principles 1–9, the entity reports on ethics, sustainable products, employee well-being, stakeholder engagement, human rights, environment, public policy, inclusive growth and consumer responsibility — backed by quantitative indicators and assured BRSR Core attributes.' },
  { key: 'P6', label: 'Principle 6 narrative (Environment)', value: 'The company manages its environmental footprint through energy efficiency in data centres and offices, expansion of renewable electricity, water stewardship and structured waste management, monitoring Scope 1 and Scope 2 emissions to track decarbonisation progress.' },
];
function renderFiller() {
  return '<div class="cm-modal-overlay" onclick="cm.closeFiller()"><div onclick="event.stopPropagation()" class="fade-in" style="background:#fff;border-radius:12px;width:min(720px,100%);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.3)">' +
    '<div style="padding:1.1rem 1.4rem;border-bottom:1px solid #e2e8f0"><h3 style="margin:0;color:#1e293b;font-size:1.1rem">Verify report narrative before generating</h3>' +
      '<p style="margin:.35rem 0 0;font-size:.82rem;color:#64748b">This editorial copy is AI-generated. Confirm or edit it — what you approve here is exactly what appears in the PDF.</p></div>' +
    '<div style="padding:1.1rem 1.4rem;overflow-y:auto;display:flex;flex-direction:column;gap:.7rem">' +
      FILLERS.map(f => { const v = S.fillerEdits[f.key] !== undefined ? S.fillerEdits[f.key] : f.value; return '<div style="display:flex;flex-direction:column;gap:.2rem"><label style="font-size:.74rem;font-weight:600;color:#475569">' + esc(f.label) + '</label>' +
        '<textarea rows="3" style="resize:vertical;min-height:38px;font-size:.82rem;padding:.5rem;border-radius:6px;border:1px solid #cbd5e1;color:#0f172a" oninput="cm.fillerEdit(\'' + f.key + '\',this.value)">' + esc(v) + '</textarea></div>'; }).join('') +
    '</div>' +
    '<div style="padding:.9rem 1.4rem;border-top:1px solid #e2e8f0;display:flex;justify-content:flex-end;gap:.6rem">' +
      '<button class="cm-btn cm-btn-secondary" style="font-size:.85rem" onclick="cm.closeFiller()">Cancel</button>' +
      '<button class="cm-btn cm-btn-success" style="font-size:.85rem;background:#3d7f6f;color:#fff" onclick="cm.confirmFiller()">Confirm & generate</button>' +
    '</div></div></div>';
}

/* ================================ controller ================================ */
const cm = {
  goStep(n) { S.step = n; window.scrollTo({ top: 0 }); render(); },
  setFilter(f) { S.filter = f; S.page = 0; render(); },
  setSearch(v) {
    S.search = v; S.page = 0; render();
    const el = document.querySelector('.cm-search-input');
    if (el) { el.focus(); try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) {} }
  },
  goPage(i) {
    const pages = buildPages(filteredSections());
    S.page = Math.max(0, Math.min(i, pages.length - 1));
    window.scrollTo({ top: 0, behavior: 'smooth' });
    render();
  },
  onEdit(id, ta) {
    S.drafts[id] = ta.value;
    ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 240) + 'px';
    const btn = document.querySelector('[data-save="' + id + '"]');
    if (btn) {
      const f = DEMO.fields.find(x => x.id === id);
      const modified = san(ta.value, f.t) !== san(f.a, f.t);
      btn.disabled = !modified;
      btn.style.opacity = modified ? '1' : '.5';
      btn.style.cursor = modified ? 'pointer' : 'not-allowed';
      btn.style.background = modified ? '' : '#f5f5f5';
      btn.style.color = modified ? '' : '#bbb';
    }
  },
  onSave(id) {
    const f = DEMO.fields.find(x => x.id === id);
    const v = S.drafts[id];
    if (f && v !== undefined) {
      f.a = v; f.t = v.trim() ? 'User Edited' : 'NA'; f.c = v.trim() ? 100 : 0; f.ct = v.trim() ? 'verified' : 'na';
      delete S.drafts[id];
    }
    render();
  },
  submitReview() { const ov = overallStats(); if (ov.pending > 0) { S.showIncomplete = true; render(); } else cm.goStep(3); },
  closeIncomplete() { S.showIncomplete = false; render(); },
  proceedAnyway() { S.showIncomplete = false; S.step = 3; window.scrollTo({ top: 0 }); render(); },
  firstIncomplete() {
    const pages = buildPages(filteredSections());
    const i = pages.findIndex(p => p.completed < p.total);
    S.showIncomplete = false; if (i >= 0) S.page = i; render();
  },
  openFiller() { S.showFiller = true; render(); },
  closeFiller() { S.showFiller = false; render(); },
  fillerEdit(k, v) { S.fillerEdits[k] = v; },
  confirmFiller() { S.showFiller = false; S.generated = true; render(); },
};
window.cm = cm;
render();
</script>
</body>
</html>
