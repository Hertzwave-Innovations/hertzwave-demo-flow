/* ---- data: rebuild sections from the flat field list (preserve order) ---- */
function buildSections() {
  const order = []; const byKey = {};
  for (const f of DEMO.fields) {
    const k = f.s || 'Section';
    if (!byKey[k]) { byKey[k] = { sectionName: k, fields: [] }; order.push(k); }
    byKey[k].fields.push(f);
  }
  return order.map(k => byKey[k]);
}
const ALL_SECTIONS = buildSections();

/* ---- helpers (ported from ReviewFieldList / ConfigureData) ---- */
function san(raw, tag) {
  let v = (raw == null ? '' : String(raw)).trim();
  if (!v || tag === 'query') return '';
  const l = v.toLowerCase();
  if (l === 'query' || l === 'null' || l === 'undefined') return '';
  if (/^select\s+/i.test(v)) return '';
  return v;
}
function isFilled(f) {
  if (f.t === 'NA' || f.t === 'query') return false;
  return !!san(f.a, f.t);
}
function sectionLetter(name) {
  const m = String(name || '').match(/section[_\s-]*([a-z])/i);
  return (m ? m[1] : (String(name || '?').trim()[0] || '?')).toUpperCase();
}
function principleKey(f) {
  const id = String(f.id || '');
  const m = id.match(/(?:^|_)p(\d)(?:_|$)/i) || String(f.n || '').match(/principle\s+(\d)/i);
  return m ? ('P' + m[1]) : null;
}
function sectionStats(fields) {
  const total = fields.length;
  const completed = fields.filter(isFilled).length;
  return { total, completed, pct: total ? Math.round(completed / total * 100) : 0 };
}
function overallStats() {
  let total = 0, completed = 0;
  for (const s of ALL_SECTIONS) { total += s.fields.length; completed += s.fields.filter(isFilled).length; }
  return { total, completed, pending: total - completed, pct: total ? Math.round(completed / total * 100) : 0 };
}

/* ---- filtering (search + tag filter) ---- */
function filteredSections() {
  const term = S.search.toLowerCase();
  const incomplete = (f) => {
    if (f.t === 'NA' || f.t === 'query') return true;
    return !san(f.a, f.t);
  };
  return ALL_SECTIONS.map(sec => ({
    sectionName: sec.sectionName,
    fields: sec.fields.filter(f => {
      const hay = (f.n + ' ' + f.a).toLowerCase();
      if (term && !hay.includes(term)) return false;
      if (S.filter === 'Pending') return incomplete(f);
      if (S.filter === 'Complete') return !incomplete(f);
      if (S.filter === 'Auto-Calculated') return f.t === 'AI-generated';
      return true;
    })
  })).filter(s => s.fields.length > 0);
}

/* ---- pagination: section/principle-aware ~50 (ported from buildReviewPages) ---- */
function buildPages(sections) {
  const out = [];
  for (const section of sections) {
    const letter = sectionLetter(section.sectionName);
    const groups = []; const gi = {};
    for (const f of section.fields) {
      const k = principleKey(f); const kk = k || '__base__';
      if (gi[kk] === undefined) { gi[kk] = groups.length; groups.push({ key: k, fields: [] }); }
      groups[gi[kk]].fields.push(f);
    }
    const raw = []; let bucket = []; let count = 0;
    const flush = () => { if (bucket.length) { raw.push({ keys: bucket.map(b => b.key).filter(Boolean), fields: bucket.flatMap(b => b.fields) }); bucket = []; count = 0; } };
    for (const g of groups) {
      if (g.fields.length > PAGE_TARGET) {
        flush();
        for (let i = 0; i < g.fields.length; i += PAGE_TARGET) raw.push({ keys: g.key ? [g.key] : [], fields: g.fields.slice(i, i + PAGE_TARGET) });
        continue;
      }
      if (count + g.fields.length > PAGE_TARGET && bucket.length) flush();
      bucket.push(g); count += g.fields.length;
    }
    flush();
    const draft = raw.map(r => {
      const nums = [...new Set(r.keys.map(k => k.slice(1)))];
      const sub = nums.length === 1 ? ('Principle ' + nums[0]) : nums.length > 1 ? ('Principles ' + nums.join(', ')) : '';
      return {
        baseTitle: sub ? ('Section ' + letter + ' · ' + sub) : ('Section ' + letter),
        shortBase: r.keys.length ? (nums.length === 1 ? ('P' + nums[0]) : ('P' + nums[0] + '–' + nums[nums.length - 1])) : letter,
        fields: r.fields,
      };
    });
    const counts = {}; draft.forEach(p => counts[p.baseTitle] = (counts[p.baseTitle] || 0) + 1);
    const seen = {};
    for (const p of draft) {
      let title = p.baseTitle, short = p.shortBase;
      if (counts[p.baseTitle] > 1) { seen[p.baseTitle] = (seen[p.baseTitle] || 0) + 1; title = p.baseTitle + ' (' + seen[p.baseTitle] + ' of ' + counts[p.baseTitle] + ')'; short = p.shortBase + '·' + seen[p.baseTitle]; }
      const st = sectionStats(p.fields);
      out.push({ title, short, pct: st.pct, total: st.total, completed: st.completed, sectionName: section.sectionName, fields: p.fields });
    }
  }
  return out;
}

function renderFieldRow(f) {
  const draft = S.drafts[f.id];
  const val = draft !== undefined ? draft : san(f.a, f.t);
  const pending = !san(draft !== undefined ? draft : f.a, f.t) || f.t === 'NA' || f.t === 'query';
  const modified = draft !== undefined && san(draft, f.t) !== san(f.a, f.t);
  const isAI = f.t === 'AI-generated';
  const baseRowCls = pending ? 'cm-row-pending' : f.t === 'User Edited' ? 'cm-row-complete' : f.ct === 'verified' ? 'cm-row-verified' : f.ct === 'review' ? 'cm-row-review' : f.ct === 'critical' ? 'cm-row-critical' : isAI ? 'cm-row-calculated' : 'cm-row-complete';
  const rowCls = baseRowCls + (isAI ? ' cm-row-ai-highlight' : '');
  const label = String(f.n || '').replace(/^AI[\s:/-]+/i, '');
  return '<div class="cm-indicator-row ' + rowCls + '">' +
    '<div class="cm-ind-meta"><div class="cm-ind-name" title="' + esc(label) + '" style="font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.01em">' + esc(label.slice(0, 130)) + (f.m ? ' <span style="color:red">*</span>' : '') + (isAI ? '<span class="cm-ai-tag">⚡ AI</span>' : '') + '</div></div>' +
    '<div class="cm-ind-input-wrap"><textarea class="cm-ind-input" rows="1" style="resize:vertical;min-height:38px;overflow:hidden" placeholder="Enter reported data..." ' +
      'oninput="cm.onEdit(\'' + esc(f.id) + '\',this)">' + esc(val) + '</textarea></div>' +
    '<div class="cm-ind-actions">' + statusBadge(f, pending) +
      (isAI && !S.verified[f.id] ? '<button class="cm-save-btn" style="background:#d97706;color:#fff;border-color:#d97706" onclick="cm.onAIVerify(\'' + esc(f.id) + '\')">Verify ✓</button>' :
       isAI && S.verified[f.id]  ? '<span style="font-size:.72rem;color:#059669;font-weight:700;background:#d1fae5;padding:2px 8px;border-radius:4px">✓ Human verified</span>' : '') +
      '<button class="cm-save-btn" data-save="' + esc(f.id) + '" ' + (modified ? '' : 'disabled') + ' ' +
        'style="opacity:' + (modified ? '1' : '.5') + ';cursor:' + (modified ? 'pointer' : 'not-allowed') + ';background:' + (modified ? '' : '#f5f5f5') + ';color:' + (modified ? '' : '#bbb') + '" onclick="cm.onSave(\'' + esc(f.id) + '\')">Save</button>' +
    '</div></div>';
}
function statusBadge(f, pending) {
  const score = (f.c != null) ? (f.c + '%') : '';
  if (pending) return '<span class="cm-badge cm-badge-warning">⚠ Pending</span>';
  if (f.t === 'User Edited') return '<span class="cm-badge cm-badge-info">Edited</span>';
  if (f.ct === 'verified') return '<span class="cm-badge cm-badge-verified">✓ Verified ' + score + '</span>';
  if (f.ct === 'review') return '<span class="cm-badge cm-badge-review">◎ Review ' + score + '</span>';
  if (f.ct === 'critical') return '<span class="cm-badge cm-badge-critical">⚡ Critical ' + score + '</span>';
  if (f.t === 'AI-generated') return '<span class="cm-badge cm-badge-calc">AI ' + score + '</span>';
  return '<span class="cm-badge cm-badge-success">Complete ' + score + '</span>';
}

function renderGRIDisclosure(d) {
  const baseId = 'gri_' + d.id.replace(/\s/g,'_').replace(/[^a-z0-9_]/gi,'');
  const discRoles = GRI_FIELD_ROLES[d.id] || {};
  const roleFilter = S.griRoleFilter || 'all';

  // Count fields by role
  const roleCounts = { required:0, calculation:0, evidence:0, nicetohave:0 };
  d.fields.forEach(f => { const r = discRoles[f.key] || 'nicetohave'; roleCounts[r]++; });

  // Filled counts
  const filledFields = d.fields.filter(f => {
    const gid = baseId + '_' + f.key;
    return (S.drafts[gid] !== undefined ? S.drafts[gid] : f.value||'').trim();
  }).length;
  const requiredFields = d.fields.filter(f => (discRoles[f.key]||'nicetohave') === 'required');
  const requiredFilled = requiredFields.filter(f => {
    const gid = baseId + '_' + f.key;
    return (S.drafts[gid] !== undefined ? S.drafts[gid] : f.value||'').trim();
  }).length;

  const totalFields = d.fields.length;
  const dPct = Math.round(filledFields / totalFields * 100);
  const reqPct = requiredFields.length ? Math.round(requiredFilled / requiredFields.length * 100) : 100;
  const allFilled = filledFields === totalFields;
  const reqAllFilled = requiredFilled === requiredFields.length;

  const rowCls = reqAllFilled ? (d.ai ? 'cm-row-calculated cm-row-ai-highlight' : 'cm-row-verified') : filledFields > 0 ? 'cm-row-review' : 'cm-row-pending';

  // Status badge based on required completion
  const badgeHtml = reqAllFilled && allFilled
    ? '<span class="cm-badge cm-badge-verified">✓ All ' + totalFields + '</span>'
    : reqAllFilled
      ? '<span class="cm-badge cm-badge-verified" style="background:#dcfce7;color:#166534">✓ Required complete</span>'
      : filledFields > 0
        ? '<span class="cm-badge cm-badge-review">◎ ' + requiredFilled + '/' + requiredFields.length + ' req.</span>'
        : '<span class="cm-badge cm-badge-warning">⚠ Pending</span>';

  let html = '<div class="cm-indicator-row ' + rowCls + '" style="padding:0;margin-bottom:.75rem;">';

  // ── Level 1: Framework Disclosure header ──────────────────────────────────
  html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:.65rem .9rem;background:#f8fafc;border-bottom:1px solid #e5e7eb;gap:.5rem">' +
    '<div style="display:flex;align-items:center;gap:.5rem;flex-wrap:wrap">' +
      '<span style="font-size:.72rem;font-weight:700;color:#7c3aed">' + esc(d.id) + (d.ai ? ' <span class="cm-ai-tag">⚡ AI</span>' : '') + '</span>' +
      '<span style="font-size:.82rem;font-weight:700;color:#0f172a">' + esc(d.title) + '</span>' +
      '<span style="font-size:.67rem;padding:1px 7px;border-radius:4px;font-weight:600;' + (d.type==='Mandatory' ? 'background:#e0e7ff;color:#3730a3' : 'background:#ede9fe;color:#6d28d9') + '">' +
        (d.type==='Mandatory' ? 'GRI Universal — Required for In Accordance' : 'Topic-Specific — Materiality selected') + '</span>' +
    '</div>' +
    '<div style="display:flex;align-items:center;gap:.5rem;flex-shrink:0">' +
      // Required progress bar
      '<div style="display:flex;align-items:center;gap:4px">' +
        '<div style="width:60px;height:5px;background:#e2e8f0;border-radius:100px;overflow:hidden"><div style="height:100%;background:' + (reqPct===100?'#16a34a':'#f97316') + ';width:' + reqPct + '%"></div></div>' +
        '<span style="font-size:.65rem;color:' + (reqPct===100?'#16a34a':'#f97316') + ';font-weight:700">' + requiredFilled + '/' + requiredFields.length + ' req</span>' +
      '</div>' +
      badgeHtml +
    '</div>' +
  '</div>';

  // ── Level 2: GRI requirement (what the standard says) ────────────────────
  html += '<div style="padding:.4rem .9rem;background:#faf5ff;border-bottom:1px solid #e9d5ff;font-size:.71rem;color:#6d28d9;line-height:1.5">' +
    '<span style="font-weight:700;text-transform:uppercase;letter-spacing:.3px;font-size:.65rem;margin-right:6px">GRI Requirement:</span>' + esc(d.requirement) + '</div>';

  // ── Role legend (compact, shown once per disclosure) ─────────────────────
  html += '<div style="padding:.3rem .9rem;background:#f8fafc;border-bottom:1px solid #f1f5f9;display:flex;gap:8px;flex-wrap:wrap">';
  Object.entries(ROLE_META).forEach(([role, m]) => {
    if (roleCounts[role] > 0) {
      html += '<span style="font-size:.65rem;display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:3px;background:' + m.bg + ';border:1px solid ' + m.border + ';color:' + m.color + '">' +
        m.icon + ' ' + m.label + ' (' + roleCounts[role] + ')</span>';
    }
  });
  html += '</div>';

  // ── Level 3: Sub-fields (required + calculation first, then evidence, then nicetohave) ─
  html += '<div style="padding:.5rem .9rem .75rem">';

  // Group fields by role priority
  const roleOrder = ['required','calculation','evidence','nicetohave'];
  const groupedFields = {};
  roleOrder.forEach(r => { groupedFields[r] = d.fields.filter(f => (discRoles[f.key]||'nicetohave') === r); });

  roleOrder.forEach(role => {
    const fields = groupedFields[role];
    if (!fields.length) return;

    // Skip nicetohave if filter says so
    if (role === 'nicetohave' && roleFilter === 'compact') {
      html += '<div style="font-size:.68rem;color:#94a3b8;padding:4px 0;cursor:pointer" onclick="cm.toggleNice()">' +
        '+ ' + fields.length + ' optional field(s) — click to expand</div>';
      return;
    }

    const m = ROLE_META[role];
    // Section label for each role group
    if (fields.length && role !== 'required') {
      html += '<div style="font-size:.67rem;font-weight:700;color:' + m.color + ';text-transform:uppercase;letter-spacing:.4px;padding:6px 0 3px;border-top:1px solid ' + m.border + ';margin-top:4px">' +
        m.icon + ' ' + m.label.toUpperCase() + '</div>';
    }

    fields.forEach((f, fi) => {
      const gid = baseId + '_' + f.key;
      const val = S.drafts[gid] !== undefined ? S.drafts[gid] : (f.value || '');
      const isEmpty = !val.trim();
      const isModified = S.drafts[gid] !== undefined && S.drafts[gid] !== (f.value || '');

      const borderColor = isEmpty && role === 'required' ? '#fca5a5' : m.border;
      const inputBg = isEmpty && role === 'required' ? '#fff5f5' : '#fff';

      html += '<div style="margin-bottom:.5rem;padding:.5rem .6rem;border-radius:6px;border-left:3px solid ' + m.border + ';background:' + (role==='required'&&!isEmpty ? '#fafff8' : '#fff') + '">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.22rem">' +
          '<label style="font-size:.72rem;font-weight:600;color:#334155">' +
            '<span style="font-size:.62rem;padding:0 4px;border-radius:2px;background:' + m.bg + ';border:1px solid ' + m.border + ';color:' + m.color + ';margin-right:5px">' + m.icon + '</span>' +
            esc(f.label) + (f.suffix ? ' <span style="font-weight:400;color:#94a3b8;font-size:.67rem">(' + esc(f.suffix) + ')</span>' : '') +
          '</label>' +
          (isEmpty && role === 'required' ? '<span style="font-size:.62rem;color:#dc2626;background:#fee2e2;padding:1px 5px;border-radius:3px;font-weight:700">Required</span>' :
           isModified ? '<span style="font-size:.62rem;color:#2563eb;background:#dbeafe;padding:1px 5px;border-radius:3px">Edited</span>' :
           isEmpty ? '' :
           '<span style="font-size:.62rem;color:#059669;background:#d1fae5;padding:1px 5px;border-radius:3px">✓</span>') +
        '</div>';

      if (f.type === 'select') {
        html += '<select style="width:100%;padding:.28rem .45rem;border:1px solid ' + borderColor + ';border-radius:5px;font-size:.79rem;color:#334155;background:' + inputBg + ';" onchange="cm.onGRIFieldEdit(\'' + gid + '\',this)">' +
          (f.options||[]).map(o => '<option value="' + esc(o) + '"' + (val===o?' selected':'') + '>' + esc(o) + '</option>').join('') +
          '</select>';
      } else if (f.type === 'number') {
        html += '<input type="number" value="' + esc(val) + '" placeholder="Enter value..." ' +
          'style="width:100%;padding:.28rem .45rem;border:1px solid ' + borderColor + ';border-radius:5px;font-size:.79rem;color:#334155;background:' + inputBg + ';" ' +
          'oninput="cm.onGRIFieldEdit(\'' + gid + '\',this)"/>';
      } else {
        const rows = role === 'required' ? '2' : '1';
        html += '<textarea rows="' + rows + '" style="width:100%;padding:.28rem .45rem;border:1px solid ' + borderColor + ';border-radius:5px;font-size:.79rem;color:#334155;resize:vertical;min-height:' + (role==='required'?'42':'32') + 'px;background:' + inputBg + ';" ' +
          'placeholder="Enter disclosure data..." oninput="cm.onGRIFieldEdit(\'' + gid + '\',this)">' + esc(val) + '</textarea>';
      }

      // ── Level 4: Evidence / methodology note (only for evidence fields) ──
      if (role === 'evidence' && f.value) {
        html += '<div style="font-size:.67rem;color:#78350f;background:#fffbeb;border-radius:3px;padding:2px 6px;margin-top:3px">📎 Pre-filled from TerraCAP methodology records — verify before submission</div>';
      }

      // AI verify button per field when disclosure is AI-populated
      if (d.ai) {
        const vkey = gid + '_verified';
        const isVerified = S.verified[vkey];
        html += '<div style="display:flex;justify-content:flex-end;margin-top:2px">' +
          (isVerified
            ? '<span style="font-size:.65rem;color:#059669;font-weight:700;background:#d1fae5;padding:1px 8px;border-radius:4px">✓ Human verified</span>'
            : '<button style="font-size:.68rem;padding:2px 8px;border-radius:4px;border:1px solid #d97706;background:#fffbeb;color:#92400e;cursor:pointer;font-weight:600" onclick="cm.onAIVerify(\'' + vkey + '\')">Verify ✓</button>') +
        '</div>';
      }
      html += '</div>';
    });
  });

  html += '</div></div>';
  return html;
}

function renderStep3GRI() {
  const total = GRI_TOTAL_DISCLOSURES;
  const filled = GRI_DISCLOSURES.filter(d => d.fields.every(f => {
    const gid = 'gri_' + d.id.replace(/\s/g,'_').replace(/[^a-z0-9_]/gi,'') + '_' + f.key;
    return (S.drafts[gid] !== undefined ? S.drafts[gid] : f.value||'').trim();
  })).length;
  const requiredFilled = GRI_DISCLOSURES.filter(d => {
    const discRoles = GRI_FIELD_ROLES[d.id] || {};
    return d.fields.filter(f => (discRoles[f.key]||'nicetohave') === 'required').every(f => {
      const gid = 'gri_' + d.id.replace(/\s/g,'_').replace(/[^a-z0-9_]/gi,'') + '_' + f.key;
      return (S.drafts[gid] !== undefined ? S.drafts[gid] : f.value||'').trim();
    });
  }).length;
  const aiDisclosures = GRI_DISCLOSURES.filter(d => d.ai).length;
  const verifiedAI = GRI_DISCLOSURES.filter(d => d.ai && d.fields.some(f => {
    const gid = 'gri_' + d.id.replace(/\s/g,'_').replace(/[^a-z0-9_]/gi,'') + '_' + f.key + '_verified';
    return S.verified[gid];
  })).length;
  const checks = [
    { type: requiredFilled === total ? 'cm-pass' : 'cm-warn', icon: requiredFilled === total ? '✓' : '!',
      title: 'Required fields: ' + requiredFilled + '/' + total + ' disclosures complete',
      desc: 'All 🔴 Required-by-framework fields must be filled before GRI "In Accordance" claim can be made.' },
    { type: filled >= Math.floor(total * 0.8) ? 'cm-pass' : 'cm-info', icon: '✓',
      title: 'Full disclosure: ' + filled + '/' + total + ' disclosures fully complete',
      desc: '🔵 Calculation and 🟡 Evidence fields add auditability. GRI does not require them for In Accordance but third-party assurance providers will ask for them.' },
    { type: verifiedAI >= aiDisclosures * 0.5 ? 'cm-pass' : 'cm-warn', icon: verifiedAI >= aiDisclosures * 0.5 ? '✓' : '!',
      title: 'AI content verification: ' + verifiedAI + '/' + aiDisclosures + ' AI disclosures human-confirmed',
      desc: 'Each ⚡ AI-populated disclosure must be reviewed and confirmed by a responsible person. GRI requires the report to be accurate and complete — AI output is a starting point only.' },
    { type: 'cm-info', icon: 'i',
      title: 'GRI Content Index readiness',
      desc: 'GRI 2-3 (reporting period/contact), GRI 2-4 (restatements), and GRI 2-5 (assurance) are the three disclosures most commonly flagged in GRI audits. Confirm these are complete.' },
    { type: 'cm-info', icon: 'i',
      title: 'Double materiality linkage',
      desc: 'GRI 3-2 (List of material topics) must link to your FY24 materiality assessment. Ensure the topic selection rationale is documented.' },
  ];
  return '<div class="cm-category-group"><div class="cm-category-header">GRI 2021 Disclosure Validation — Manipal Group FY25</div><div class="cm-validation-list">' +
    checks.map(c => '<div class="cm-val-item ' + c.type + '"><div class="cm-val-icon ' + c.type + '">' + c.icon + '</div><div class="cm-val-text"><h4>' + esc(c.title) + '</h4><p>' + esc(c.desc) + '</p></div></div>').join('') +
    '</div></div>' +
    '<div class="cm-btn-group"><button class="cm-btn cm-btn-secondary" onclick="cm.goStep(2)">‹ Back</button><div class="cm-right-btns"><button class="cm-btn cm-btn-primary" onclick="cm.goStep(4)">Next: Preview ›</button></div></div>';
}

function renderStep3GreenCo() {
  const pillars = GC_PILLARS;
  const totalItems = pillars.reduce((s,p) => s + p.items.length, 0);
  const totalScore = pillars.reduce((s,p) => s + p.items.reduce((ss,i) => ss + i.score, 0), 0);
  const maxScore = pillars.reduce((s,p) => s + p.maxScore, 0);
  const pct = Math.round(totalScore / maxScore * 100);
  const rating = pct >= 75 ? 'Platinum' : pct >= 55 ? 'Gold' : pct >= 40 ? 'Silver' : pct >= 25 ? 'Bronze' : 'Pending';
  const ratingColor = pct >= 75 ? '#7c3aed' : pct >= 55 ? '#d97706' : pct >= 40 ? '#64748b' : '#b45309';
  const checks = [
    { type: pct >= 40 ? 'cm-pass' : 'cm-warn', icon: pct >= 40 ? '✓' : '!',
      title: 'Projected GreenCo rating: ' + rating + ' (' + totalScore + '/' + maxScore + ' = ' + pct + '%)',
      desc: 'CII GreenCo ratings: Bronze ≥25%, Silver ≥40%, Gold ≥55%, Platinum ≥75%. Current score projects a ' + rating + ' rating.' },
    { type: 'cm-info', icon: 'i',
      title: 'Pillar scores: ' + pillars.map(p => p.id + ' ' + p.items.reduce((s,i)=>s+i.score,0) + '/' + p.maxScore).join(' · '),

      title: 'Site assessment readiness',
      desc: 'CII GreenCo involves a physical site visit. Ensure all documented claims (solar capacity, water treatment, waste diversion %) are verifiable on-site.' },
  ];
  return '<div class="cm-category-group"><div class="cm-category-header" style="background:#166534;color:#fff">CII GreenCo Validation — Rail Wheel Factory</div><div class="cm-validation-list">' +
    checks.map(c => '<div class="cm-val-item ' + c.type + '"><div class="cm-val-icon ' + c.type + '">' + c.icon + '</div><div class="cm-val-text"><h4>' + esc(c.title) + '</h4><p>' + esc(c.desc) + '</p></div></div>').join('') +
    '</div></div>' +
    '<div class="cm-btn-group"><button class="cm-btn cm-btn-secondary" onclick="cm.goStep(2)">‹ Back</button><div class="cm-right-btns"><button class="cm-btn cm-btn-primary" style="background:#166534" onclick="cm.goStep(4)">Next: Preview ›</button></div></div>';

/* ---------- STEP 4: Preview Report ---------- */
function findAns(keywords) {
  for (const s of ALL_SECTIONS) for (const f of s.fields) {
    const hay = (f.n || '').toLowerCase();
    if (keywords.some(k => hay.includes(k)) && san(f.a, f.t) && f.t !== 'NA') return f.a;
  }
  return null;
}
function renderStep4() {
  if (ACTIVE_FW === 'gri')     return renderStep4GRI();
  if (ACTIVE_FW === 'cdp')     return renderStep4CDP();
  if (ACTIVE_FW === 'greenco') return renderStep4GreenCo();
  return renderStep4BRSR();
}

function renderStep4BRSR() {
  const ov = overallStats();
  const blocks = [
    { cat: 'Section A — General Disclosures', rows: [
      ['CIN', 'Corporate Identity Number', findAns(['corporate identity number', 'cin'])],
      ['COMPANY', 'Name of the listed entity', COMPANY],
      ['YEAR', 'Year of incorporation', findAns(['year of incorporation'])],
      ['EMPLOYEES', 'Total employees', findAns(['total number of employees', 'total employees'])],
    ]},
    { cat: 'Principle 6 — Environmental Stewardship', rows: [
      ['SCOPE1', 'Total Scope 1 emissions (tCO2e)', findAns(['total scope 1 emissions'])],
      ['SCOPE2', 'Total Scope 2 emissions (tCO2e)', findAns(['total scope 2 emissions'])],
      ['ENERGY', 'Total energy consumption', findAns(['total energy consumed', 'total energy consumption'])],
      ['WATER', 'Total water withdrawal', findAns(['water withdrawal', 'total water'])],
    ]},
    { cat: 'Principle 3 — Employee Wellbeing', rows: [
      ['LTIFR', 'Lost Time Injury Frequency Rate', findAns(['ltifr', 'lost time injury'])],
      ['TRAINING', 'Training hours per employee', findAns(['training hours', 'average hours of training'])],
    ]},
  ];
  let out = '<div class="cm-category-group"><div class="cm-category-header">BRSR Report Preview — ' + COMPANY + ' FY25</div>';
  blocks.forEach(b => {
    out += '<div class="cm-section-title">' + esc(b.cat) + '</div>';
    out += '<table style="width:100%;border-collapse:collapse;font-size:.85rem;margin-bottom:1rem">';

function renderCDPView() {
  const activeMod = S.cdpMod || CDP_MODULES[0].id;
  const mod = CDP_MODULES.find(m => m.id === activeMod) || CDP_MODULES[0];
  let out = '';
  out += '<div class="cm-info-box" style="margin-top:1rem;border-left:4px solid #1d4ed8">🌡️ <strong>CDP Climate Change 2024 — MAHE · FY 2024-25</strong> · 7 modules · <strong>' + CDP_TOTAL + ' primary disclosure questions</strong> · <strong>' + CDP_FILLED + ' AI-populated</strong> · Each question has optional supporting sub-fields for data capture · <span style="background:#dbeafe;padding:2px 6px;border-radius:4px;font-size:.8em;color:#1d4ed8">CDP scores on quality of narrative response — sub-fields support auditability, not scoring</span></div>';
  // module pills
  out += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin:1rem 0">';
  CDP_MODULES.forEach(m => {
    const active = m.id === activeMod;
    out += '<button onclick="cm.setCDPMod(\'' + m.id + '\')" style="padding:.3rem .8rem;border-radius:20px;border:1.5px solid ' + (active ? m.color : '#e2e8f0') + ';background:' + (active ? m.color : '#fff') + ';color:' + (active ? '#fff' : '#475569') + ';font-size:.78rem;font-weight:600;cursor:pointer">' + m.id + '</button>';
  });
  out += '</div>';
  out += '<div class="cm-section-title">' + mod.label + '</div>';

  mod.items.forEach(item => {
    const gid = 'cdp_' + item.id.replace(/\./g, '_');
    const isTableItem = ['__RISK_REGISTER__','__OPP_REGISTER__','__TARGETS_TABLE__'].includes(item.a);
    const subKey = item.id.replace(/\./g, '_');
    const subFields = CDP_SUBFIELDS[subKey] || [];
    const isSubOpen = S.cdpSubOpen && S.cdpSubOpen[gid];

    out += '<div class="cm-ind-row" style="border-left:3px solid ' + mod.color + ';margin-bottom:.75rem;padding:0;background:#fff;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.06)">';

    // ── Question header (Level 1 — primary disclosure) ────────────────────
    out += '<div style="padding:.7rem .9rem .5rem;border-bottom:' + (isTableItem||isSubOpen||subFields.length?'1px solid #f1f5f9':'none') + '">' +
      '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem;margin-bottom:.4rem">' +
        '<div style="flex:1"><span style="background:' + mod.color + ';color:#fff;font-size:.7rem;font-weight:700;padding:1px 6px;border-radius:3px;margin-right:6px">' + item.id + '</span>' +
        '<span style="font-size:.83rem;font-weight:600;color:#1e293b">' + esc(item.q) + '</span></div>' +
        '<span style="font-size:.7rem;background:#dcfce7;color:#166534;padding:1px 6px;border-radius:3px;white-space:nowrap;flex-shrink:0">✓ AI-populated</span>' +
      '</div>';

    if (isTableItem) {
      if (item.a === '__RISK_REGISTER__') out += renderCDPRiskRegister();
      else if (item.a === '__OPP_REGISTER__') out += renderCDPOppRegister();
      else if (item.a === '__TARGETS_TABLE__') out += renderCDPTargetsTable();
    } else {
      const val = (S.drafts && S.drafts[gid] !== undefined) ? S.drafts[gid] : item.a;
      const isModified = val !== item.a;
      // Primary question-level textarea
      out += '<div class="cm-ind-input-wrap"><textarea class="cm-ind-input" rows="3" style="resize:vertical;min-height:58px;overflow:hidden;font-size:.82rem" placeholder="Enter disclosure response..." ' +
        'oninput="cm.onCDPEdit(\'' + gid + '\',this)">' + esc(val) + '</textarea></div>' +
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:.35rem">' +
          '<div style="font-size:.68rem;color:#94a3b8;font-style:italic">CDP primary response — narrative quality determines CDP score</div>' +
          (isModified ? '<button class="cm-save-btn" style="background:#1d4ed8;color:#fff" onclick="cm.onCDPSave(\'' + gid + '\')">Save</button>' : '') +
        (S.verified[gid] 
          ? '<span style="font-size:.68rem;color:#059669;font-weight:700;background:#d1fae5;padding:2px 8px;border-radius:4px">✓ Human verified</span>'
          : '<button style="font-size:.72rem;padding:3px 10px;border-radius:5px;border:1px solid #d97706;background:#fffbeb;color:#92400e;cursor:pointer;font-weight:600;margin-left:4px" onclick="cm.onAIVerify(\'' + gid + '\')">Verify ✓</button>') +
        '</div>';
    }

    // ── Sub-fields toggle (Level 2 — capture layer) ───────────────────────
    if (subFields.length && !isTableItem) {
      out += '<div style="margin-top:.5rem;padding-top:.4rem;border-top:1px dashed #e2e8f0">' +
        '<button onclick="cm.toggleCDPSub(\'' + gid + '\')" style="font-size:.71rem;color:#1d4ed8;background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;padding:3px 10px;cursor:pointer;font-weight:600">' +
          (isSubOpen ? '▼ Hide supporting data fields' : '▶ Add supporting data (' + subFields.length + ' sub-fields)') + '</button>' +
        (isSubOpen ? '' : '<span style="font-size:.67rem;color:#94a3b8;margin-left:8px">Optional — for auditability and calculation traceability</span>') +
      '</div>';
      if (isSubOpen) {
        out += '<div style="background:#f8fafc;border-top:1px solid #e2e8f0;padding:.6rem .9rem .5rem;margin-top:.4rem">' +
          '<div style="font-size:.68rem;font-weight:700;color:#475569;margin-bottom:.5rem;text-transform:uppercase;letter-spacing:.4px">Supporting Data Fields</div>';
        subFields.forEach(sf => {
          const sfgid = gid + '_' + sf.key;
          const sfval = S.drafts[sfgid] || '';
          const m = CDP_ROLE_META[sf.role] || CDP_ROLE_META.evidence;
          out += '<div style="margin-bottom:.4rem">' +
            '<label style="font-size:.71rem;font-weight:600;color:#334155;display:block;margin-bottom:.15rem">' +
              '<span style="font-size:.62rem;padding:0 4px;border-radius:2px;background:' + m.bg + ';border:1px solid ' + m.border + ';color:' + m.color + ';margin-right:5px">' + m.icon + ' ' + m.label + '</span>' +
              esc(sf.label) + '</label>';
          if (sf.type === 'select') {
            out += '<select style="width:100%;padding:.25rem .4rem;border:1px solid #e2e8f0;border-radius:5px;font-size:.79rem;color:#334155;" onchange="cm.onCDPSubEdit(\'' + sfgid + '\',this)">' +
              sf.options.map(o => '<option value="' + esc(o) + '"' + (sfval===o?' selected':'') + '>' + esc(o) + '</option>').join('') +
              '</select>';
          } else if (sf.type === 'number') {
            out += '<input type="number" value="' + esc(sfval) + '" placeholder="Enter value" style="width:100%;padding:.25rem .4rem;border:1px solid #e2e8f0;border-radius:5px;font-size:.79rem;color:#334155;" oninput="cm.onCDPSubEdit(\'' + sfgid + '\',this)"/>';
          } else {
            out += '<textarea rows="1" style="width:100%;padding:.25rem .4rem;border:1px solid #e2e8f0;border-radius:5px;font-size:.79rem;color:#334155;resize:vertical;min-height:30px;" placeholder="Enter data..." oninput="cm.onCDPSubEdit(\'' + sfgid + '\',this)">' + esc(sfval) + '</textarea>';
          }
          out += '</div>';
        });
        out += '</div>';
      }
    }

    out += '</div></div>';
  });
  out += '<div class="cm-btn-group"><button class="cm-btn cm-btn-secondary" onclick="cm.goStep(1)">‹ Back</button><div class="cm-right-btns"><button class="cm-btn cm-btn-primary" style="background:#1d4ed8" onclick="cm.goStep(3)">Next: Validate ›</button></div></div>';
  return out;
}
/* ================================ GreenCo — RWF Data & Renderer ================================ */

    { id: 'WS1.2', q: 'Waste quantification and tracking', a: 'Hazardous waste: 842 MT (spent emulsified coolant: 580 MT, used oil: 142 MT, ETP sludge: 120 MT). Non-hazardous: 4,840 MT total (metal scrap: 3,920 MT recycled, paper/cardboard: 420 MT recycled, mixed 500 MT — 92% diverted from landfill).', score: 4, maxScore: 5 },
    { id: 'WS1.3', q: 'Hazardous waste disposal compliance', a: '100% manifested disposal via TSDF (Treatment Storage Disposal Facility) — KSPCB-authorised. Annual hazardous waste return filed. E-waste (computer equipment) disposed via MPCB-registered e-waste recyclers. No violations in FY25.', score: 4, maxScore: 5 },

    { id: 'GHG1.2', q: 'GHG emissions inventory — Scope 2', a: 'Scope 2 location-based FY25: 14,280 tCO2e. Grid electricity: 38,000 MWh @ 0.716 tCO2e/MWh (CEA FY24 factor — Karnataka grid). Market-based: 13,490 tCO2e (after 2,400 MWh solar offset). Total Scope 1+2 market-based: 18,310 tCO2e.', score: 4, maxScore: 5 },
    { id: 'GHG1.3', q: 'Scope 3 emissions (partial)', a: 'Category 1 (purchased raw materials — steel billets): 28,400 tCO2e est. Category 4 (upstream transport by rail): 1,840 tCO2e est. Category 11 (product use — wheels/axles in service): not applicable (raw materials). Methodology: Scope 3 standard, secondary data.', score: 3, maxScore: 5 },
    { id: 'GHG1.4', q: 'GHG reduction targets and progress', a: 'Target: 15% absolute reduction in Scope 1+2 by FY28 vs FY22 baseline (22,400 tCO2e). FY25: 18,310 tCO2e — 18.3% reduction achieved (ahead of target). Carbon intensity: 4.2 tCO2e/unit — 22% improvement vs FY22 (5.4 tCO2e/unit).', score: 4, maxScore: 5 },
  ]},
  { id: 'ENV1', label: 'Environment Management', color: '#059669', maxScore: 15, items: [
    { id: 'ENV1.1', q: 'Environmental management system', a: 'ISO 14001:2015 certified (since 2016, recertified 2022). Annual environmental audit. KSPCB Consent to Operate renewed FY25. Air quality monitoring (stack emissions) quarterly. Ambient noise/air monitoring bi-annually. No environmental violations in FY25.', score: 4, maxScore: 5 },
    { id: 'ENV1.2', q: 'Biodiversity and green cover', a: 'RWF campus: 168 acres. Green cover: 42 acres (25% of campus). FY25 tree plantation: 1,840 saplings (net addition 1,200 trees after mortality). No forest land use or biodiversity-sensitive area impact. Horticultural water sourced 100% from ETP treated water.', score: 3, maxScore: 5 },
    { id: 'ENV1.3', q: 'Supplier environmental assessment', a: 'Green procurement policy: 28 critical suppliers assessed for environmental compliance (ISO 14001 or equivalent). 18 of 28 (64%) certified. Supply chain GHG data collection pilot launched FY25 with top 5 steel suppliers via TerraCAP Scope 3 module.', score: 3, maxScore: 5 },
  ]},
];

const GC_TOTAL_SCORE = GC_PILLARS.reduce((s, p) => s + p.items.reduce((ss, i) => ss + i.score, 0), 0);
const GC_MAX_SCORE = GC_PILLARS.reduce((s, p) => s + p.maxScore, 0);
const GC_PCT = Math.round(GC_TOTAL_SCORE / GC_MAX_SCORE * 100);
const GC_RATING = GC_PCT >= 80 ? 'Platinum' : GC_PCT >= 60 ? 'Gold' : GC_PCT >= 45 ? 'Silver' : 'Bronze';
const GC_RATING_COLOR = GC_PCT >= 80 ? '#7c3aed' : GC_PCT >= 60 ? '#d97706' : GC_PCT >= 45 ? '#6b7280' : '#b45309';

function renderGreenCoView() {
  const activePillar = S.gcPillar || GC_PILLARS[0].id;
  const pillar = GC_PILLARS.find(p => p.id === activePillar) || GC_PILLARS[0];
  const pillarScore = pillar.items.reduce((s, i) => s + i.score, 0);
  const pillarMax = pillar.maxScore;
  let out = '';
  out += '<div class="cm-info-box" style="margin-top:1rem;border-left:4px solid #15803d">🏭 <strong>CII GreenCo Rating — Rail Wheel Factory · FY 2024-25</strong> · 5 pillars · 124 scored criteria · <strong>Total score: ' + GC_TOTAL_SCORE + '/' + GC_MAX_SCORE + ' (' + GC_PCT + '%)</strong> · <span style="background:#dcfce7;color:#166534;padding:2px 8px;border-radius:4px;font-weight:700">🏆 ' + GC_RATING + ' Rating</span> · <span style="font-size:.8em;color:#555">GreenCo does not prescribe a fixed disclosure set — criteria applicable based on plant operations and sector profile</span></div>';
  // Pillar score summary cards
  out += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin:1rem 0">';
  GC_PILLARS.forEach(p => {
    const ps = p.items.reduce((s, i) => s + i.score, 0);
    const pct = Math.round(ps / p.maxScore * 100);
    const isActive = p.id === activePillar;
    out += '<button onclick="cm.setGCPillar(\'' + p.id + '\')" style="flex:1;min-width:100px;padding:.6rem .5rem;border-radius:8px;border:2px solid ' + (isActive ? p.color : '#e2e8f0') + ';background:' + (isActive ? p.color : '#fff') + ';cursor:pointer;text-align:center">' +
      '<div style="font-size:.7rem;font-weight:700;color:' + (isActive ? '#fff' : '#475569') + '">' + p.id + '</div>' +
      '<div style="font-size:1.1rem;font-weight:800;color:' + (isActive ? '#fff' : p.color) + '">' + ps + '/' + p.maxScore + '</div>' +
      '<div style="font-size:.65rem;color:' + (isActive ? 'rgba(255,255,255,.8)' : '#94a3b8') + '">' + pct + '%</div>' +
    '</button>';
  });
  out += '</div>';
  out += '<div class="cm-section-title">' + pillar.label + ' — Score: ' + pillarScore + '/' + pillarMax + ' (' + Math.round(pillarScore/pillarMax*100) + '%)</div>';
  pillar.items.forEach(item => {
    const gid = 'gc_' + item.id.replace(/\./g, '_');
    const val = (S.drafts && S.drafts[gid] !== undefined) ? S.drafts[gid] : item.a;
    const isModified = val !== item.a;
    const scoreBar = Math.round(item.score / item.maxScore * 100);
    out += '<div class="cm-ind-row" style="border-left:3px solid ' + pillar.color + ';margin-bottom:.75rem;padding:.75rem .75rem .75rem 1rem;background:#fff;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.06)">' +
      '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem;margin-bottom:.35rem">' +
        '<div><span style="background:' + pillar.color + ';color:#fff;font-size:.7rem;font-weight:700;padding:1px 6px;border-radius:3px;margin-right:6px">' + item.id + '</span>' +
        '<span style="font-size:.83rem;font-weight:600;color:#1e293b">' + esc(item.q) + '</span></div>' +
        '<div style="text-align:right;white-space:nowrap"><span style="font-size:.75rem;font-weight:700;color:' + pillar.color + '">' + item.score + '/' + item.maxScore + '</span>' +
          '<div style="width:60px;height:5px;background:#e2e8f0;border-radius:3px;margin-top:2px"><div style="width:' + scoreBar + '%;height:100%;background:' + pillar.color + ';border-radius:3px"></div></div>' +
        '</div>' +
      '</div>' +
      '<div class="cm-ind-input-wrap"><textarea class="cm-ind-input" rows="2" style="resize:vertical;min-height:52px;overflow:hidden" placeholder="Enter evidence / response..." ' +
        'oninput="cm.onGCEdit(\'' + gid + '\',this)">' + esc(val) + '</textarea></div>' +
      '<div class="cm-ind-actions">' +
        '<button class="cm-save-btn" data-save="' + gid + '" ' + (isModified ? '' : 'disabled') + ' style="opacity:' + (isModified ? '1' : '.5') + ';cursor:' + (isModified ? 'pointer' : 'not-allowed') + ';background:' + (isModified ? pillar.color : '#f5f5f5') + ';color:' + (isModified ? '#fff' : '#bbb') + '" ' +
          'onclick="cm.onGCSave(\'' + gid + '\')">Save</button>' +
      '</div></div>';
  });
  out += '<div class="cm-btn-group"><button class="cm-btn cm-btn-secondary" onclick="cm.goStep(1)">‹ Back</button><div class="cm-right-btns"><button class="cm-btn cm-btn-primary" style="background:#15803d" onclick="cm.goStep(3)">Next: Validate ›</button></div></div>';
  return out;
}

/* ================================ controller ================================ */
const cm = {
  goStep(n) { S.step = n; S.page = 0; window.scrollTo({ top: 0 }); render(); },
  setFW(fw) { ACTIVE_FW = fw; S.step = 1; S.page = 0; render(); },
  setCDPMod(mod) { S.cdpMod = mod; render(); },
  setGCPillar(p) { S.gcPillar = p; render(); },
  toggleCDPSub(gid) { if (!S.cdpSubOpen) S.cdpSubOpen = {}; S.cdpSubOpen[gid] = !S.cdpSubOpen[gid]; render(); },
  onCDPSubEdit(id, el) { S.drafts[id] = el.value || (el.options ? el.options[el.selectedIndex].value : ''); if (el.tagName==='TEXTAREA'){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px';} },
  toggleNice() { S.griRoleFilter = S.griRoleFilter === 'all' ? 'compact' : 'all'; render(); },
  onCDPSave(id) { alert('CDP response for ' + id + ' saved.'); render(); },
  onGCEdit(id, ta) { S.drafts[id] = ta.value; ta.style.height='auto'; ta.style.height = Math.min(ta.scrollHeight,240)+'px'; const btn=document.querySelector('[data-save="'+id+'"]'); if(btn){const modified=ta.value!==ta.defaultValue;btn.disabled=!modified;btn.style.opacity=modified?'1':'.5';} },
  onGCSave(id) { alert('GreenCo evidence for ' + id + ' saved.'); render(); },
  setFilter(f) { S.filter = f; S.page = 0; render(); },
  setSearch(v) {
    S.search = v; S.page = 0; render();
    const el = document.querySelector('.cm-search-input');
    if (el) { el.focus(); try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) {} }
  },
  goPage(i) {
    const pages = buildPages(filteredSections());
    S.page = Math.max(0, Math.min(i, pages.length - 1));
    window.scrollTo({ top: 0, behavior: 'smooth' });
    render();
  },
  onEdit(id, ta) {
    S.drafts[id] = ta.value;
    ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 240) + 'px';
    const btn = document.querySelector('[data-save="' + id + '"]');
    if (btn) {
      const f = DEMO.fields.find(x => x.id === id);
      const modified = san(ta.value, f.t) !== san(f.a, f.t);
      btn.disabled = !modified;
      btn.style.opacity = modified ? '1' : '.5';
      btn.style.cursor = modified ? 'pointer' : 'not-allowed';
      btn.style.background = modified ? '' : '#f5f5f5';
      btn.style.color = modified ? '' : '#bbb';
    }
  },
  onAIVerify(id) { S.verified[id] = true; render(); },
  onSave(id) {
    const f = DEMO.fields.find(x => x.id === id);
    const v = S.drafts[id];
    if (f && v !== undefined) {
      f.a = v; f.t = v.trim() ? 'User Edited' : 'NA'; f.c = v.trim() ? 100 : 0; f.ct = v.trim() ? 'verified' : 'na';
      delete S.drafts[id];
    }
    render();
  },
  submitReview() { const ov = overallStats(); if (ov.pending > 0) { S.showIncomplete = true; render(); } else cm.goStep(3); },
  closeIncomplete() { S.showIncomplete = false; render(); },
  proceedAnyway() { S.showIncomplete = false; S.step = 3; window.scrollTo({ top: 0 }); render(); },
  firstIncomplete() {
    const pages = buildPages(filteredSections());
    const i = pages.findIndex(p => p.completed < p.total);
    S.showIncomplete = false; if (i >= 0) S.page = i; render();
  },
  openFiller() { S.showFiller = true; render(); },
  closeFiller() { S.showFiller = false; render(); },
  fillerEdit(k, v) { S.fillerEdits[k] = v; },
  confirmFiller() { S.showFiller = false; S.generated = true; render(); },
  onGRIEdit(gid, ta) {
    S.drafts[gid] = ta.value;
    ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 240) + 'px';
    const btn = document.querySelector('[data-save="' + gid + '"]');
    if (btn) {
      const d = GRI_DISCLOSURES.find(x => ('gri_' + x.id.replace(/\s/g,'_').replace(/[^a-z0-9_]/gi,'')) === gid);
      const orig = d ? (d.value || '') : '';
      const modified = ta.value !== orig;
      btn.disabled = !modified;
      btn.style.opacity = modified ? '1' : '.5';
      btn.style.cursor = modified ? 'pointer' : 'not-allowed';
      btn.style.background = modified ? '' : '#f5f5f5';
      btn.style.color = modified ? '' : '#bbb';
    }
  },
  onGRISave(gid, disclosureId) {
    const d = GRI_DISCLOSURES.find(x => x.id === disclosureId);
    const v = S.drafts[gid];
    if (d && v !== undefined) {
      d.value = v;
      d.filled = v.trim() ? d.elements : 0;
      delete S.drafts[gid];
    }
    render();
  },
};
window.cm = cm;
render();
</script>
