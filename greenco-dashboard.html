<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GreenCo Dashboard | TerraCAP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --ink:#13302A; --muted:#5A716B; --faint:#8AA09A; --line:#D5DFDB; --line-2:#E6EDEA;
  --bg:#EDF2F0; --card:#FFFFFF; --sunk:#F5F8F7;
  --green:#1D7456; --green-d:#155840; --claim:#9CCBB6; --green-soft:#E0F0E8;
  --ai:#4346A0; --ai-soft:#ECECF8; --amber:#935708; --amber-soft:#FBEFD8; --red:#A33131; --red-soft:#F8E2E2;
  --b-cert:#4F7596; --b-bron:#9A5A2F; --b-silv:#8B959A; --b-gold:#B48710; --b-plat:#2F6B70; --b-none:#C7D2CE;
  --r-s:5px; --r-m:9px; --r-l:14px;
  --font:'Manrope', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ink:#E4EEEA; --muted:#A3B8B1; --faint:#71877F; --line:#2E4540; --line-2:#253A35;
  --bg:#0F1D1A; --card:#162824; --sunk:#12221F; --green:#4DB38A; --green-d:#7CCBAA; --claim:#2F6A55; --green-soft:#1C3B31;
  --ai:#9EA1F0; --ai-soft:#23244A; --amber:#E0A450; --amber-soft:#3A2C14; --red:#E57B7B; --red-soft:#3D1F1F; --b-none:#34514A;
}}
:root[data-theme="dark"]{
  --ink:#E4EEEA; --muted:#A3B8B1; --faint:#71877F; --line:#2E4540; --line-2:#253A35;
  --bg:#0F1D1A; --card:#162824; --sunk:#12221F; --green:#4DB38A; --green-d:#7CCBAA; --claim:#2F6A55; --green-soft:#1C3B31;
  --ai:#9EA1F0; --ai-soft:#23244A; --amber:#E0A450; --amber-soft:#3A2C14; --red:#E57B7B; --red-soft:#3D1F1F; --b-none:#34514A;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.25}
h2{font-size:22px;font-weight:800;letter-spacing:-.01em}
h3{font-size:16px;font-weight:700}
h4{font-size:14px;font-weight:700}
p{margin:0}
a{color:var(--green)}
.muted{color:var(--muted)} .small{font-size:12.5px}
/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:150px}
.brand b{font-size:15px;font-weight:800;color:var(--green-d)}
.brand span{font-size:12px;color:var(--muted)}
.plantctx{flex:1;min-width:0}
.plantctx b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plantctx span{font-size:12px;color:var(--muted)}
.lens select{padding:6px 8px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--card)}
.lens label{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.pill{display:flex;align-items:baseline;gap:8px;padding:6px 12px;border-radius:var(--r-m);background:var(--sunk);border:1px solid var(--line)}
.pill b{font-size:18px;font-weight:800}
.pill .bn{font-weight:700;font-size:13px}
/* shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100% - 60px)}
.rail{border-right:1px solid var(--line);padding:16px 10px;background:var(--card);position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto}
.rail button{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:var(--r-m);cursor:pointer}
.rail button:hover{background:var(--sunk)}
.rail button.on{background:var(--green-soft)}
.rail .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:1.5px solid var(--line);color:var(--muted);background:var(--card)}
.rail button.on .n{border-color:var(--green);color:var(--green)}
.rail .n.ok,.rail button.on .n.ok{background:var(--green);border-color:var(--green);color:#fff}
.rail .n.plain{border:0;background:none;font-size:15px}
.rail .t b{display:block;font-weight:700;font-size:13.5px}
.rail .t span{font-size:11.5px;color:var(--muted)}
.rail hr{border:0;border-top:1px solid var(--line-2);margin:10px 6px}
main{padding:22px 26px 60px;min-width:0}
.sechead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.sechead p{color:var(--muted);max-width:70ch;margin-top:4px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:18px}
.panel+.panel{margin-top:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--green)}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
.btn.pri:hover{background:var(--green-d)}
.btn.ai{border-color:var(--ai);color:var(--ai)}
.btn.ai:hover{background:var(--ai-soft)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn[disabled]{opacity:.55;cursor:progress}
.btn.sm{padding:4px 9px;font-size:12px}
/* chips and tags */
.tag{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11.5px;font-weight:700;border:1px solid transparent;white-space:nowrap}
.k-computed{background:var(--green-soft);color:var(--green-d)}
.k-claimed{background:var(--sunk);color:var(--muted);border-color:var(--line)}
.k-prov{background:var(--amber-soft);color:var(--amber)}
.k-ai{background:var(--ai-soft);color:var(--ai)}
.k-bad{background:var(--red-soft);color:var(--red)}
.k-ok{background:var(--green);color:#fff}
.st-Planned{background:var(--sunk);color:var(--muted);border-color:var(--line)}
.st-In\ progress{background:var(--amber-soft);color:var(--amber)}
.st-Implemented{background:var(--green-soft);color:var(--green-d)}
.band-t{font-weight:800}
.bc-plat{color:var(--b-plat)} .bc-gold{color:var(--b-gold)} .bc-silv{color:var(--b-silv)} .bc-bron{color:var(--b-bron)} .bc-cert{color:var(--b-cert)} .bc-none{color:var(--muted)}
/* notices */
.note{padding:10px 14px;border-radius:var(--r-m);font-size:13px;border:1px solid var(--line);background:var(--sunk);color:var(--muted)}
.note.warn{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.note.bad{background:var(--red-soft);border-color:transparent;color:var(--red)}
.note.ai{background:var(--ai-soft);border-color:transparent;color:var(--ai)}
.note b{color:inherit}
.disclaim{font-size:12.5px;color:var(--muted);border-left:3px solid var(--amber);padding:6px 12px;background:var(--card);border-radius:0 var(--r-s) var(--r-s) 0;margin-bottom:16px}
/* hero + ladder */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:26px;align-items:start}
.hero .big{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.hero .big .num{font-size:64px;font-weight:800;letter-spacing:-.03em;line-height:1}
.hero .big .of{font-size:16px;color:var(--muted);font-weight:600}
.hero .big .bn{font-size:26px;font-weight:800}
.hero .cap{color:var(--muted);margin-top:4px}
.ladder{margin-top:22px;position:relative;padding-top:48px;padding-bottom:58px}
.ladder .track{display:flex;height:16px;border-radius:4px;overflow:hidden}
.ladder .seg{height:100%}
.ladder .blabels{position:relative;height:30px;margin-top:4px}
.ladder .blabels span{position:absolute;font-size:11px;line-height:1.25;color:var(--muted);white-space:nowrap;padding-left:3px;border-left:1px solid var(--line)}
.ladder .mk{position:absolute;top:48px;transform:translateX(-50%)}
.ladder .mk i{display:block;width:3px;height:16px;background:var(--ink)}
.ladder .mk em{position:absolute;left:50%;transform:translateX(-50%);bottom:20px;font-style:normal;font-size:11.5px;font-weight:800;white-space:nowrap;background:var(--card);padding:0 4px}
.ladder .mk.proj i{background:none;border-left:2px dashed var(--ai);width:0}
.ladder .mk.proj em{bottom:38px;color:var(--ai)}
.ladder .mk.comp i{background:var(--green-d);width:2px}
.ladder .mk.comp em{bottom:auto;top:56px;color:var(--green-d);font-weight:600}
.stats{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.stats div{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line-2)}
.stats div:last-child{border-bottom:0}
.stats b{font-weight:800}
/* parameter bars */
.pbars{display:grid;gap:10px}
.pbar{display:grid;grid-template-columns:minmax(150px,1.2fr) minmax(0,2fr) 92px;gap:14px;align-items:center;cursor:pointer;padding:4px 6px;border-radius:var(--r-s)}
.pbar:hover{background:var(--sunk)}
.pbar .nm{font-weight:600;font-size:13px}
.bar{position:relative;height:12px;background:var(--line-2);border-radius:3px;overflow:hidden;display:flex}
.bar .c{background:var(--green)} .bar .l{background:var(--claim);background-image:repeating-linear-gradient(135deg,transparent 0 3px,rgba(255,255,255,.35) 3px 5px)}
.bar .pj{position:absolute;top:-2px;bottom:-2px;border-left:2px dashed var(--ai)}
.pbar .v{text-align:right;font-weight:700;font-size:13px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle}
/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:700;color:var(--muted);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr.grp td{background:var(--sunk);font-weight:700;color:var(--ink);font-size:12.5px}
.scroll{overflow-x:auto}
.tbl input[type=number],.tbl input[type=text]{width:100%;min-width:92px;padding:5px 7px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--card);text-align:right}
.tbl input:focus{border-color:var(--green);outline:none}
.src{font-size:11px;color:var(--green-d);white-space:nowrap}
.used{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.used span{font-size:10.5px;padding:0 5px;border-radius:3px;background:var(--line-2);color:var(--muted)}
/* forms */
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px 16px}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--card)}
.fld textarea{min-height:66px;resize:vertical}
.fld .hint{font-size:11.5px;color:var(--faint);margin-top:3px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.chk input{margin-top:3px}
.vcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.vcard{border:1.5px solid var(--line);border-radius:var(--r-m);padding:12px;cursor:pointer;background:var(--card);text-align:left}
.vcard.on{border-color:var(--green);background:var(--green-soft)}
.vcard b{display:block;font-size:14px}
.vcard span{font-size:12px;color:var(--muted)}
/* assessment */
.two{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
.plist{position:sticky;top:80px;display:grid;gap:2px}
.plist button{display:grid;grid-template-columns:1fr auto;gap:6px;text-align:left;border:0;background:none;padding:8px 10px;border-radius:var(--r-s);cursor:pointer;font-size:13px}
.plist button:hover{background:var(--card)}
.plist button.on{background:var(--card);box-shadow:inset 3px 0 0 var(--green);font-weight:700}
.plist small{color:var(--muted);font-weight:600}
.credit{border:1px solid var(--line);border-radius:var(--r-m);padding:14px 16px;background:var(--card);margin-bottom:10px}
.credit .ch{display:flex;gap:10px;align-items:flex-start}
.credit .cid{font-weight:800;color:var(--green-d);min-width:58px;font-size:13px}
.credit h4{flex:1;font-weight:600}
.credit .pts{font-weight:800;white-space:nowrap}
.credit .pts small{color:var(--muted);font-weight:600}
.calc{display:flex;gap:18px;align-items:center;margin-top:10px;flex-wrap:wrap}
.calc .mv{min-width:110px}
.calc .mv b{font-size:20px;font-weight:800;display:block;line-height:1.1}
.calc .mv span{font-size:11.5px;color:var(--muted)}
.bchips{display:flex;flex-wrap:wrap;gap:5px}
.bchip{font-size:11.5px;padding:2px 7px;border-radius:var(--r-s);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.bchip b{color:var(--ink)}
.bchip.on{background:var(--green);border-color:var(--green);color:#fff}
.bchip.on b{color:#fff}
.bchip.nx{border-color:var(--ai);color:var(--ai);border-style:dashed}
.levels{display:flex;flex-wrap:wrap;gap:0;margin-top:10px;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden;width:fit-content;max-width:100%}
.levels button{border:0;border-right:1px solid var(--line);background:var(--card);padding:6px 10px;font-size:12px;cursor:pointer}
.levels button:last-child{border-right:0}
.levels button.on{background:var(--green);color:#fff;font-weight:700}
.cfoot{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line-2);font-size:12px;color:var(--muted)}
.cfoot a{cursor:pointer}
.gates{display:grid;gap:6px;margin-bottom:14px}
/* initiatives */
.ptabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.ptabs button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:5px 12px;cursor:pointer;font-size:12.5px;font-weight:600}
.ptabs button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.ptabs button small{opacity:.7;margin-left:4px}
.init{border:1px solid var(--line);border-radius:var(--r-m);background:var(--card);padding:14px 16px;margin-bottom:10px}
.init .ih{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.init .ih h4{flex:1;min-width:200px;font-size:15px}
.init .meta{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.init .meta b{color:var(--ink)}
.imps{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:4px}
.imps li{font-size:13px}
.imps li b{font-weight:700}
.eff{margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.eff .d{font-weight:800;font-size:15px}
.eff .d.pos{color:var(--green)} .eff .d.zero{color:var(--muted)}
.basis{font-size:12.5px;color:var(--muted);margin-top:8px}
.aicard{margin-top:12px;border:1px solid var(--ai);border-radius:var(--r-m);background:var(--ai-soft);padding:12px 14px;color:var(--ink)}
.aicard .ah{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.aicard .ah b{color:var(--ai)}
.aicard h5{margin:10px 0 4px;font-size:12px;color:var(--ai)}
.aicard ul{margin:0;padding-left:18px}
.aicard li{margin:2px 0;font-size:13px}
.verdict{font-weight:800;padding:2px 9px;border-radius:20px;font-size:12px;background:var(--card)}
.v-good{color:var(--green)} .v-mid{color:var(--amber)} .v-bad{color:var(--red)}
.goal .ok{color:var(--green);font-weight:700} .goal .short{color:var(--amber);font-weight:700} .goal .no{color:var(--red);font-weight:700}
.goal select{padding:3px 6px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--card);font-size:12.5px}
/* lists */
.mini{display:grid;gap:8px}
.mini .it{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13px;cursor:pointer}
.mini .it:last-child{border-bottom:0}
.mini .it b{color:var(--green-d)}
.mini .it .g{font-weight:800;white-space:nowrap}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,25,21,.45);z-index:50;display:grid;place-items:center;padding:20px}
.modal[hidden]{display:none}
.mbox{background:var(--card);border-radius:var(--r-l);max-width:760px;width:100%;max-height:calc(100vh - 40px);overflow:auto;padding:20px 22px;border:1px solid var(--line)}
.mbox h3{margin-bottom:14px}
.improw{display:grid;grid-template-columns:minmax(0,2fr) 130px minmax(0,1fr) 34px;gap:8px;align-items:center;margin-bottom:6px}
.improw select,.improw input{padding:7px 8px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--card);width:100%}
.improw .cur{font-size:11.5px;color:var(--muted)}
.mfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.lv{text-align:right;padding:5px 8px;background:var(--green-soft);color:var(--green-d);border-radius:var(--r-s);font-weight:700;min-width:92px}
.tbl input.gapin{border-color:var(--amber);background:var(--amber-soft)}
.linkbtn{border:0;background:none;color:var(--green);cursor:pointer;padding:0;font-size:12px;text-decoration:underline;font-weight:600}
.ledgerbar{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.lstat b{display:block;font-size:24px;font-weight:800;line-height:1.1}
.lstat span{font-size:12px;color:var(--muted)}
.aimode{font-size:11.5px;color:var(--muted);margin-top:4px;text-align:right}
/* evidence */
.evrow{display:grid;grid-template-columns:64px minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-2);align-items:start;font-size:13px}
.evrow .files{display:flex;flex-direction:column;gap:3px}
.evrow .files span{font-size:12px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.evhead{display:grid;grid-template-columns:64px minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:12px;font-size:12px;font-weight:700;color:var(--muted);padding-bottom:6px;border-bottom:1px solid var(--line)}
@media (max-width:980px){.evhead{display:none}}
.evrow .files button{border:0;background:none;color:var(--red);cursor:pointer;font-size:12px;padding:0}
/* pack */
.doc{background:#fff;color:#1a2a26;border:1px solid var(--line);border-radius:var(--r-m);padding:34px 40px;max-width:1000px}
.doc h1{font-size:26px;margin-bottom:4px}
.doc h2{font-size:17px;margin:26px 0 8px;padding-bottom:4px;border-bottom:2px solid #1D7456}
.doc .tbl th{color:#4d625c} .doc .tbl td{border-color:#e3e9e7}
.doc .dis{border:1px solid #d9a441;background:#fdf6e7;padding:10px 14px;border-radius:6px;font-size:12.5px;margin:14px 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:9px 16px;border-radius:var(--r-m);font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.toast.show{opacity:1}
.chartbox{position:relative;height:260px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

<script>
/* ==========================================================================
   GreenCo readiness engine — TerraCAP
   Pure functions: no DOM. Deterministic scoring; AI never touches scores.
   Source basis: CII GreenCo Rating System V3 Abridged Reference Guide (June 2018)
   for credit-level rules; CII GreenCo Annual Report 2024-25 for V4 and Lite
   parameter weights. V4/Lite credit-level criteria are not public: V4/Lite
   scores are a provisional projection of V3 credit results (see v4Of()).
   ========================================================================== */
'use strict';
const GC = (() => {

const LEVELS = [
  { v: 0,    label: 'Not started' },
  { v: 0.25, label: 'Initiated' },
  { v: 0.5,  label: 'Partly in place' },
  { v: 0.75, label: 'Largely in place' },
  { v: 1,    label: 'Fully evidenced' }
];

const BANDS = [
  { min: 750, name: 'Platinum',  cls: 'plat' },
  { min: 650, name: 'Gold',      cls: 'gold' },
  { min: 550, name: 'Silver',    cls: 'silv' },
  { min: 450, name: 'Bronze',    cls: 'bron' },
  { min: 350, name: 'Certified', cls: 'cert' }
];
function bandOf(s) { for (const b of BANDS) if (s >= b.min) return b; return { min: 0, name: 'Below Certified', cls: 'none' }; }
function nextBand(s) { const asc = [...BANDS].reverse(); for (const b of asc) if (s < b.min) return b; return null; }

/* Sector classification. ee = EE4 category (1-4), re = RE category (1-4),
   ghg = 'int' | 'non'. null = sector not listed in that V3 table. */
const SECTORS = {
  'Automobile':            { seg: 'mfg', ee: 1, re: 1, ghg: 'non' },
  'Engineering':           { seg: 'mfg', ee: 1, re: 1, ghg: 'non' },
  'Foundry':               { seg: 'mfg', ee: 1, re: null, ghg: null },
  'FMCG':                  { seg: 'mfg', ee: 1, re: null, ghg: 'non' },
  'Food processing':       { seg: 'mfg', ee: null, re: 1, ghg: null },
  'Textile':               { seg: 'mfg', ee: 1, re: null, ghg: 'non' },
  'Chemical':              { seg: 'mfg', ee: 2, re: 2, ghg: 'int' },
  'Pharmaceutical':        { seg: 'mfg', ee: 2, re: 2, ghg: 'non' },
  'Pulp & Paper':          { seg: 'mfg', ee: 2, re: 2, ghg: 'int' },
  'Petrochemical':         { seg: 'mfg', ee: 2, re: 2, ghg: 'int' },
  'Glass':                 { seg: 'mfg', ee: 2, re: null, ghg: null },
  'Tyre':                  { seg: 'mfg', ee: 2, re: 2, ghg: null },
  'Non-ferrous metals':    { seg: 'mfg', ee: 2, re: 2, ghg: 'int' },
  'Cement':                { seg: 'mfg', ee: 3, re: 3, ghg: 'int' },
  'Iron & steel':          { seg: 'mfg', ee: 3, re: 3, ghg: 'int' },
  'Chlor-alkali':          { seg: 'mfg', ee: 3, re: null, ghg: null },
  'Aluminium':             { seg: 'mfg', ee: 4, re: 3, ghg: 'int' },
  'Fertilizer':            { seg: 'mfg', ee: 4, re: 4, ghg: 'int' },
  'Refinery':              { seg: 'mfg', ee: 4, re: 4, ghg: 'int' },
  'IT & ITeS':             { seg: 'svc', ee: 1, re: 1, ghg: 'non' },
  'Hotels':                { seg: 'svc', ee: 1, re: null, ghg: 'non' },
  'Logistics':             { seg: 'svc', ee: 1, re: null, ghg: null },
  'Airports':              { seg: 'svc', ee: 1, re: null, ghg: null },
  'Ports':                 { seg: 'svc', ee: 1, re: null, ghg: null }
};
const EE_STEP = { 1: 2.5, 2: 1, 3: 0.5, 4: 0.25 };
const RE_EXP  = { 1: 90, 2: 70, 3: 50, 4: 30 };

function classify(prof) {
  const s = SECTORS[prof.sector] || { seg: 'mfg' };
  const pick = (ov, auto, dflt) => {
    if (ov && ov !== 'auto') return { v: isNaN(+ov) ? ov : +ov, src: 'override' };
    if (auto != null) return { v: auto, src: 'guide' };
    return { v: dflt, src: 'default' };
  };
  return { seg: s.seg, ee: pick(prof.eeCatOv, s.ee, 1), re: pick(prof.reCatOv, s.re, 1), ghg: pick(prof.ghgOv, s.ghg, 'non') };
}

/* ---------- Parameters ---------- */
const P3 = [
  { id: 'EE',    name: 'Energy Efficiency', max: 150 },
  { id: 'WC',    name: 'Water Conservation', max: 100 },
  { id: 'RE',    name: 'Renewable Energy', max: 100 },
  { id: 'GHG',   name: 'GHG Emission Reduction', max: 100 },
  { id: 'WM',    name: 'Waste Management', max: 100 },
  { id: 'MCR',   name: 'Material Conservation, Recycling & Recyclability', max: 100 },
  { id: 'GSC',   name: 'Green Supply Chain', max: 100 },
  { id: 'PSLCA', name: 'Product Stewardship & Life Cycle Aspects', max: 125 },
  { id: 'IE',    name: 'Innovation for Environment', max: 50 },
  { id: 'GI',    name: 'Green Infrastructure & Ecology', max: 75 }
];
const P4 = [
  { id: 'MS',  name: 'Management Systems', w: 75,  lite: 50 },
  { id: 'EM',  name: 'Energy Management', w: 150, lite: 125 },
  { id: 'CM',  name: 'Carbon Management', w: 150, lite: 100 },
  { id: 'WA',  name: 'Water Management', w: 125, lite: 100 },
  { id: 'MRM', name: 'Material Resource Management', w: 125, lite: 100 },
  { id: 'GS4', name: 'Green Supply Chain', w: 100, lite: 50 },
  { id: 'PS4', name: 'Product Stewardship & Life Cycle Approach', w: 125, lite: 75 },
  { id: 'IE4', name: 'Innovation for Environment', w: 50, lite: 50 },
  { id: 'GBE', name: 'Green Built Environment & Others', w: 100, lite: 50 }
];
/* PROVISIONAL mapping of V3 credits into V4 parameters. Not CII criteria. */
function v4Of(id) {
  const m = id.match(/^([A-Z]+)(\d+)?/); const p = m[1]; const n = m[2] ? +m[2] : 0;
  if (p === 'EE')    return n <= 2 ? 'MS' : 'EM';
  if (p === 'WC')    return n <= 2 ? 'MS' : 'WA';
  if (p === 'RE')    return n === 1 ? 'MS' : n === 2 ? 'EM' : 'CM';
  if (p === 'GHG')   return n <= 3 ? 'MS' : 'CM';
  if (p === 'WM')    return n <= 3 ? 'MS' : 'MRM';
  if (p === 'MCR')   return n <= 3 ? 'MS' : 'MRM';
  if (p === 'GSC')   return n <= 3 ? 'MS' : 'GS4';
  if (p === 'PSLCA') return 'PS4';
  if (p === 'IE')    return 'IE4';
  return 'GBE';
}

const VERSIONS = {
  V3:   { id: 'V3', name: 'GreenCo V3', sub: 'June 2018 guide, credit-level', basis: 'Credit rules from the CII V3 reference guide.', provisional: false },
  V4:   { id: 'V4', name: 'GreenCo V4', sub: '2023, parameter weights only', basis: 'CII has published V4 parameter weights, not credits. Scores project V3 credit results onto V4 weights through a provisional mapping.', provisional: true },
  LITE: { id: 'LITE', name: 'GreenCo Lite', sub: '700 points, scaled to 1000', basis: 'CII has published Lite parameter weights, not credits. Scores use the same provisional mapping, scaled from 700 to 1000.', provisional: true }
};

/* ---------- Plant data fields ---------- */
/* yrs: 3 = baseline / middle / current year; 1 = current value only.
   ledger: true = auto-filled from the TerraCAP activity ledger in production. */
const FIELDS = [
  { k: 'prod', g: 'Production', label: 'Production output', unit: 't', yrs: 3, ledger: true, used: 'EE4 WC4.1 GHG4 GHG6.2 WM4.1 MCR4.1 MCR5 MCR6.1' },
  { k: 'elec', g: 'Energy', label: 'Electricity consumed (all sources)', unit: 'kWh', yrs: 3, ledger: true, used: 'EE4 RE2 RE3 GHG4' },
  { k: 'thermal', g: 'Energy', label: 'Fuel energy (thermal)', unit: 'GJ', yrs: 3, ledger: true, used: 'EE4 RE2 RE3 GHG4' },
  { k: 'onsiteRE', g: 'Energy', label: 'On-site renewable electricity', unit: 'kWh', yrs: 3, ledger: true, used: 'RE2 RE3 GHG4' },
  { k: 'onsiteTh', g: 'Energy', label: 'On-site renewable thermal', unit: 'GJ', yrs: 3, ledger: true, used: 'RE2' },

/* ---------- Metrics ---------- */
function num(x) { if (x === '' || x == null) return null; const n = parseFloat(x); return isFinite(n) ? n : null; }
function val(D, k, i) { const v = D[k]; return Array.isArray(v) ? num(v[i]) : num(v); }
function red(a, b) { return (a == null || b == null || a === 0) ? null : (a - b) / a * 100; }
function div(a, b) { return (a == null || b == null || b === 0) ? null : a / b; }
function pctOf(a, b) { const d = div(a, b); return d == null ? null : d * 100; }

function computeMetrics(D, prof, inits, projected) {
  const cls = classify(prof);
  const EF = num(prof.gridEF) || 0, FEF = num(prof.fuelEF) || 0;
  const Y = [0, 1, 2].map(i => {
    const g = k => val(D, k, i);
    const prod = g('prod'), elec = g('elec'), th = g('thermal');
    const on = g('onsiteRE') || 0, onTh = g('onsiteTh') || 0, off = g('offsiteRE') || 0;
    const totGJ = (elec == null || th == null) ? null : elec * 0.0036 + th;
    const grid = elec == null ? null : Math.max(0, elec - on - off);
    const inv1 = g('scope1'), inv2 = g('scope2');
    const s2 = inv2 != null ? inv2 : (grid == null ? null : grid / 1000 * EF);
    const s1 = inv1 != null ? inv1 : (th == null ? null : th * FEF);
    const fwP = g('fwProc'), fwD = g('fwDom');
    const fw = (fwP == null && fwD == null) ? null : (fwP || 0) + (fwD || 0);
    return {
      prod, elec, th, on, onTh, off, totGJ, grid, s1, s2, fw,
      sec: div(totGJ, prod),
      ghgInt: (s1 == null || s2 == null) ? null : div(s1 + s2, prod),
      s3: g('scope3'), s3Int: div(g('scope3'), prod),
      swc: div(fw, prod),
      hazSpec: div(g('hazDisp'), prod), haz: g('hazDisp'),
      nonHaz: g('nonHaz'), effl: g('effl'), sew: g('sew'),
      rmSpec: div(g('rm'), prod), consSpec: div(g('cons'), prod), pkgSpec: div(g('pkg'), prod),
      inPkg: g('inPkg'), trans: g('transGHG')
    };
  });
  const c = Y[2], b = Y[0], g = k => val(D, k, 2);
  const elecOnly = cls.re.v >= 3;
  let onsitePct = null, offsitePct = null;
  if (elecOnly) { onsitePct = pctOf(c.on, c.elec); offsitePct = pctOf(c.off, c.elec); }
  else if (c.totGJ) { onsitePct = (c.on * 0.0036 + c.onTh) / c.totGJ * 100; offsitePct = c.off * 0.0036 / c.totGJ * 100; }
  const allGHG = (c.s1 == null || c.s2 == null) ? null : c.s1 + c.s2 + (c.s3 || 0);
  const innovInits = (inits || []).filter(x => x.innov && (x.status === 'Implemented' || (projected && x.include !== false && (x.status === 'Planned' || x.status === 'In progress'))));
  const reTotal = (onsitePct == null) ? null : onsitePct + (offsitePct || 0);
  const M = {
    Y, elecOnly,
    secRed: red(b.sec, c.sec),
    onsitePct, offsitePct, reTotal,
    reSub: onsitePct == null ? null : (offsitePct || 0) + Math.max(0, onsitePct - 5),
    ghgRed: red(b.ghgInt, c.ghgInt),
    offsetPct: pctOf(g('offsets'), allGHG), s3Missing: !c.s3,
    s3cats: ['s3c1', 's3c2', 's3c3', 's3c4'].filter(k => num(D[k]) > 0).length,
    s3Red: red(b.s3Int, c.s3Int),
    swcRed: red(b.swc, c.swc),
    rwhPct: pctOf(g('rwhCap'), g('rwhPot')),
    rwProc: g('rwProc'),
    rechargeRatio: div(g('recharge'), c.fw), rechargeProj: g('rechargeProj'),
    hazRed: red(b.hazSpec, c.hazSpec), afrPct: pctOf(g('hazAFR'), c.haz),
    nonHazRed: red(b.nonHaz, c.nonHaz),
    landfill: g('landfill'),
    efflRed: red(b.effl, c.effl), efflRecPct: pctOf(g('efflRec'), c.effl), zldProc: num(D.zldProc) > 0,
    sewRed: red(b.sew, c.sew), sewRecPct: pctOf(g('sewRec'), c.sew), zldSew: num(D.zldSew) > 0,
    rmRed: red(b.rmSpec, c.rmSpec), recycledIn: g('recycledIn'),
    consRed: red(b.consSpec, c.consSpec), pkgRed: red(b.pkgSpec, c.pkgSpec), pkgRec: g('pkgRec'),
    supAudPct: pctOf(g('supAud'), g('supCrit')), supRatedPct: pctOf(g('supRated'), g('supCrit')),
    supImp: g('supImp'), inPkgRed: red(b.inPkg, c.inPkg), transRed: red(b.trans, c.trans),
    certPct: pctOf(g('certPros'), g('emp')), housingPct: g('housingPct'), commutePct: g('commutePct'),
    innovCount: innovInits.length, reBonus: reTotal != null && reTotal > 80
  };
  return M;
}

/* ---------- Banding ---------- */
function band(v, bands, op) {
  if (v == null) return { pts: 0, idx: -1 };
  let pts = 0, idx = -1;
  bands.forEach((b, i) => { const ok = op === '>' ? v > b[0] : v >= b[0]; if (ok) { pts = b[1]; idx = i; } });
  return { pts, idx };
}
const steps = (arr, ptsStep) => arr.map((t, i) => [t, (i + 1) * ptsStep]);

/* ---------- Scoring ---------- */
function fmtN(v, d = 1) { return v == null || !isFinite(v) ? '—' : (+v).toLocaleString('en-IN', { maximumFractionDigits: d }); }

function ctxOf(prof) { const k = classify(prof); return { seg: k.seg, ee: k.ee.v, re: k.re.v, ghg: k.ghg.v }; }

function scoreCredit(c, M, ctx, st) {
  let max = c.max;
  if (ctx.seg === 'svc') {
    if (c.p === 'PSLCA') return { excluded: true, pts: 0, max: 0, kind: 'excluded', answered: true };
    if (c.p === 'MCR' || c.p === 'GSC') max = c.max * 0.75;
  }
  const scale = max / c.max;
  if (st.profile.igbc && /^GI1\./.test(c.id)) return { pts: max, max, kind: 'claimed', answered: true, note: 'Option 1: IGBC Green Factory rated.' };
  if (c.kind === 'J') { const a = st.judged[c.id]; return { pts: a == null ? 0 : LEVELS[a].v * max, max, kind: 'claimed', answered: a != null, level: a }; }
  if (c.kind === 'O') { const a = st.options[c.id]; const o = a == null ? null : c.opts[a]; return { pts: o ? o[1] * scale : 0, max, kind: 'claimed', answered: a != null, opt: a }; }
  let r;
  if (c.fn) r = c.fn(M, ctx, st);
  else { const b = typeof c.bands === 'function' ? c.bands(ctx) : c.bands; const x = band(M[c.m], b, c.op); r = { val: M[c.m], pts: x.pts, bands: b, op: c.op, unit: c.unit }; }
  if (r.bands && r.val != null) { const x = band(r.val, r.bands, r.op || '>='); r.idx = x.idx; r.next = r.bands[x.idx + 1] || null; }
  let pts = Math.min(c.max, r.pts || 0), kind = 'computed';
  if (c.best && st.best[c.id]) { pts = c.max; kind = 'claimed'; r.note = 'Best-performer claim: full points if the assessor accepts national-best evidence.'; }
  return Object.assign({}, r, { pts: pts * scale, raw: pts, max, kind, answered: r.val != null });
}

function cloneData(D) { return JSON.parse(JSON.stringify(D)); }
/* Apply a change to the assessment-year value. Energy changes also move the
   inventoried Scope 1/2 totals by the saved energy times the profile factors,
   so ledger emissions stay the base and initiatives adjust them. */
function addField(D, k, d, prof) {
  const f = FIELD[k]; if (!f) return;
  const clamp = (v, ff) => { let x = Math.max(0, v); if (ff.pct) x = Math.min(100, x); if (ff.bool) x = x > 0 ? 1 : 0; return x; };
  const bump = (key, dd) => { const ff = FIELD[key]; if (Array.isArray(D[key])) D[key][2] = clamp((num(D[key][2]) || 0) + dd, ff); else D[key] = clamp((num(D[key]) || 0) + dd, ff); };
  bump(k, d);
  if (!prof) return;
  const EF = num(prof.gridEF) || 0, FEF = num(prof.fuelEF) || 0;
  const has = key => Array.isArray(D[key]) && num(D[key][2]) != null;
  if (has('scope2')) {
    if (k === 'elec') bump('scope2', d / 1000 * EF);
    if (k === 'onsiteRE' || k === 'offsiteRE') bump('scope2', -d / 1000 * EF);
  }
  if (has('scope1') && k === 'thermal') bump('scope1', d * FEF);
}
function isActive(i) { return i.include !== false && (i.status === 'Planned' || i.status === 'In progress'); }
function activeIds(st, opt = {}) {
  return (st.initiatives || []).filter(i => {
    if (opt.set) return opt.set.includes(i.id);
    if (!isActive(i)) return false;
    if (opt.exclude === i.id) return false;
    if (opt.only && opt.only !== i.id) return false;
    return true;
  }).map(i => i.id);
}
function project(st, opt = {}) {
  const D = cloneData(opt.D || st.data);
  const ids = activeIds(st, opt);
  (st.initiatives || []).forEach(i => {
    if (!ids.includes(i.id)) return;
    (i.impacts || []).forEach(x => { const d = num(x.d); if (d) addField(D, x.f, d, st.profile); });
  });
  return D;
}

function scoreAll(st, o = {}) {
  const projected = !!(o.projected || o.only || o.exclude || o.set);
  const D = o.D || (projected ? project(st, o) : st.data);
  const ctx = ctxOf(st.profile);
  const ids = projected ? activeIds(st, o) : [];
  const counted = (st.initiatives || []).filter(i => i.status === 'Implemented' || ids.includes(i.id)).map(i => Object.assign({}, i, { status: 'Implemented' }));
  const M = computeMetrics(D, st.profile, counted, false);
  const R = {};
  CREDITS.forEach(c => { R[c.id] = scoreCredit(c, M, ctx, st); });
  const params = P3.map(p => {
    const cs = CREDITS.filter(c => c.p === p.id && !R[c.id].excluded);
    const excluded = cs.length === 0;
    let pts = 0, comp = 0, claim = 0, max = 0, answered = 0;
    cs.forEach(c => { const r = R[c.id]; pts += r.pts; max += r.max; if (r.kind === 'computed') comp += r.pts; else claim += r.pts; if (r.answered) answered++; });
    const cap = ctx.seg === 'svc' && (p.id === 'MCR' || p.id === 'GSC') ? 75 : p.max;
    if (pts > cap) { const f = cap / pts; pts = cap; comp *= f; claim *= f; }
    return { id: p.id, name: p.name, max: excluded ? 0 : cap, pts, comp, claim, answered, n: cs.length, excluded };
  });
  const gates = GATES.filter(g => !(ctx.seg === 'svc' && g.p === 'PSLCA'));
  const gatesMet = gates.filter(g => st.gates[g.id]).length;
  const total = params.reduce((a, p) => a + p.pts, 0);
  const n = params.reduce((a, p) => a + p.n, 0), answered = params.reduce((a, p) => a + p.answered, 0);
  return { R, M, D, ctx, params, total, max: ctx.seg === 'svc' ? 825 : 1000,
    comp: params.reduce((a, p) => a + p.comp, 0), claim: params.reduce((a, p) => a + p.claim, 0),
    coverage: n ? answered / n : 0, gatesMet, gatesN: gates.length };
}

/* Apply a version lens to a V3 credit-level result */
function lens(res, ver) {
  if (ver === 'V3') {
    const scaled = res.max === 825 ? res.total * 1000 / 825 : res.total;
    return { ver, params: res.params.filter(p => !p.excluded).map(p => ({ id: p.id, name: p.name, max: p.max, pts: p.pts, comp: p.comp, claim: p.claim })),
      total: res.total, max: res.max, bandScore: scaled, band: bandOf(scaled), provisional: res.max === 825,
      note: res.max === 825 ? 'Service sector: rated out of 825. Band shown on a score scaled to 1000; confirm banding with CII.' : null };
  }
  const W = ver === 'LITE' ? 'lite' : 'w';
  const params = P4.map(p => {
    const ids = CREDITS.filter(c => v4Of(c.id) === p.id && !res.R[c.id].excluded).map(c => c.id);
    const poss = ids.reduce((a, id) => a + res.R[id].max, 0);
    const got = ids.reduce((a, id) => a + res.R[id].pts, 0);
    const comp = ids.reduce((a, id) => a + (res.R[id].kind === 'computed' ? res.R[id].pts : 0), 0);
    const f = poss ? p[W] / poss : 0;
    return { id: p.id, name: p.name, max: poss ? p[W] : 0, pts: got * f, comp: comp * f, claim: (got - comp) * f, from: ids };
  });
  const total = params.reduce((a, p) => a + p.pts, 0), max = params.reduce((a, p) => a + p.max, 0);
  const bandScore = max ? total * 1000 / max : 0;
  return { ver, params, total, max, bandScore, band: bandOf(bandScore), provisional: true,
    note: VERSIONS[ver].basis + (max !== (ver === 'LITE' ? 700 : 1000) ? ' Parameters with no mapped credits are left out and the score is scaled to 1000 for banding.' : '') };
}

/* Smallest change in a driver field that reaches targetPts on credit c */
function requiredDelta(st, c, targetPts, D0) {
  if (!c.driver) return null;
  const f = c.driver, dir = c.dir, ctx = ctxOf(st.profile);
  const test = d => { const D = cloneData(D0); addField(D, f, d, st.profile); const M = computeMetrics(D, st.profile, st.initiatives, false); const r = scoreCredit(c, M, ctx, st); return r.raw >= targetPts - 1e-9; };
  if (test(0)) return 0;
  const fd = FIELD[f];
  const cur = Array.isArray(D0[f]) ? (num(D0[f][2]) || 0) : (num(D0[f]) || 0);
  let hi = dir < 0 ? cur : (fd.pct ? 100 - cur : Math.max(cur * 6, 1000));
  if (fd.bool) hi = 1;
  if (!(hi > 0) || !test(dir * hi)) return null;
  let lo = 0;
  for (let k = 0; k < 60; k++) { const mid = (lo + hi) / 2; if (test(dir * mid)) hi = mid; else lo = mid; }
  let d = dir * hi;
  if (fd.int || c.isInt) d = dir * Math.ceil(hi - 1e-9);
  return d;
}

/* Credit-level effect of one initiative delivered on its own */
function initiativeEffect(st, id) {
  const base = scoreAll(st), alone = scoreAll(st, { only: id });
  const withAll = scoreAll(st, { projected: true }), without = scoreAll(st, { exclude: id });
  const credits = CREDITS.map(c => ({ id: c.id, d: alone.R[c.id].pts - base.R[c.id].pts })).filter(x => Math.abs(x.d) > 0.001);
  return { standalone: alone.total - base.total, marginal: withAll.total - without.total, credits };
}

/* ---------- Parameter goals ----------
   A goal is a points target for one parameter of the selected version.
   Goals are planning targets set by the plant; CII does not score them. */
function goalStatus(L, PL, goals) {
  const g = goals || {};
  const rows = L.params.filter(p => p.max > 0).map(p => {
    const pp = (PL && PL.params.find(x => x.id === p.id)) || p;
    const goal = num(g[p.id]);
    let status = 'none';
    if (goal != null) status = p.pts >= goal - 1e-6 ? 'met' : pp.pts >= goal - 1e-6 ? 'ontrack' : 'short';
    return { id: p.id, name: p.name, max: p.max, now: p.pts, proj: pp.pts, goal, status,
      gapNow: goal == null ? null : Math.max(0, goal - p.pts), gapProj: goal == null ? null : Math.max(0, goal - pp.pts) };
  });
  const set = rows.filter(r => r.goal != null);
  const goalTotal = set.reduce((a, r) => a + r.goal, 0);
  const complete = rows.length > 0 && set.length === rows.length;
  return { rows, set: set.length, n: rows.length, goalTotal, complete,
    goalBand: complete && L.max ? bandOf(goalTotal * 1000 / L.max) : null,
    met: set.filter(r => r.status === 'met').length, ontrack: set.filter(r => r.status === 'ontrack').length, short: set.filter(r => r.status === 'short').length };
}
/* Starting-point goals that reach a band: the points still needed are spread across
   parameters in proportion to the points each has not yet earned. A planning aid only;
   it does not know which points are realistic to win. */
function suggestGoals(L, bandMin) {
  const ps = L.params.filter(p => p.max > 0);
  const need = bandMin * L.max / 1000 - L.total;
  const head = ps.reduce((a, p) => a + (p.max - p.pts), 0);
  const out = {};
  ps.forEach(p => { const add = need > 0 && head > 0 ? need * (p.max - p.pts) / head : 0; out[p.id] = Math.min(p.max, Math.ceil((p.pts + add) * 2) / 2); });
  return out;
}

/* ---------- Performance goals ----------
   GreenCo target-setting credits (EE1.1, WC1.1, RE1.1, GHG1.1, WM1.1, MCR1.1, GSC1.2) ask for
   performance targets over short and long horizons, not points. A goal here is a % improvement
   against the base year (the latest assessed year) for year 1, year 2 and year 3 (long term).
   Every metric is computed from a period record, so annual and monthly data use one definition. */
const GJ_PER_KWH = 0.0036;
function fyStart(label) { const m = String(label || '').match(/(20\d\d)/); return m ? +m[1] : null; }
function fyLabel(y) { return 'FY ' + y + '-' + String((y + 1) % 100).padStart(2, '0'); }
function goalYears(prof) { const s0 = fyStart(prof.years[2]); return s0 ? [1, 2, 3].map(k => fyLabel(s0 + k)) : ['Year 1', 'Year 2', 'Year 3']; }
const REC_FIELDS = ['prod', 'elec', 'thermal', 'onsiteRE', 'onsiteTh', 'offsiteRE', 'scope1', 'scope2', 'fwProc', 'fwDom', 'hazDisp', 'rm', 'transGHG'];
/* One period's record from plant data (index 0..2), with Scope 1/2 falling back to energy x factors. */
function recordOf(D, i, prof) {
  const r = {}; REC_FIELDS.forEach(k => { r[k] = val(D, k, i); });
  const EF = num(prof.gridEF) || 0, FEF = num(prof.fuelEF) || 0;
  if (r.scope1 == null && r.thermal != null) r.scope1 = r.thermal * FEF;
  if (r.scope2 == null && r.elec != null) r.scope2 = Math.max(0, r.elec - (r.onsiteRE || 0) - (r.offsiteRE || 0)) / 1000 * EF;
  return r;
}
function sumRecords(list) { const r = {}; REC_FIELDS.forEach(k => { const v = list.map(x => x[k]).filter(x => x != null); r[k] = v.length ? v.reduce((a, b) => a + b, 0) : null; }); return r; }
const nz = v => v == null ? 0 : v;
const GOAL_METRICS = [
  { id: 'secE', p: 'EE', name: 'Electrical specific energy', unit: 'kWh/unit', kind: 'ratio', num: r => r.elec, den: r => r.prod, field: 'elec', fieldUnit: 'kWh', fieldName: 'electricity', credit: 'EE4' },
  { id: 'secT', p: 'EE', name: 'Thermal specific energy', unit: 'GJ/unit', kind: 'ratio', num: r => r.thermal, den: r => r.prod, field: 'thermal', fieldUnit: 'GJ', fieldName: 'fuel energy', credit: 'EE4' },
  { id: 'swc', p: 'WC', name: 'Specific fresh water', unit: 'm³/unit', kind: 'ratio', num: r => (r.fwProc == null && r.fwDom == null) ? null : nz(r.fwProc) + nz(r.fwDom), den: r => r.prod, field: 'fwProc', fieldUnit: 'm³', fieldName: 'fresh water', credit: 'WC4.1' },

      ${rows.map(p => `<tr><td>${e(pname(p))}</td>${inv.past[p].map(v => `<td class="r">${v == null ? '<span class="muted">—</span>' : GC.fmtN(v, 1)}</td>`).join('')}<td class="r"><b>${GC.fmtN(sum(inv.past[p]), 1)}</b></td>${inv.next[p].map(v => `<td class="r">${v ? GC.fmtN(v, 1) : '<span class="muted">0</span>'}</td>`).join('')}<td class="r"><b>${GC.fmtN(sum(inv.next[p]), 1)}</b>${inv.unplaced[p] ? `<br><span class="muted small">+${GC.fmtN(inv.unplaced[p], 1)} outside these years</span>` : ''}</td></tr>`).join('')}
      <tr class="grp"><td>Total</td>${pastT.map(v => `<td class="r">${GC.fmtN(v, 1)}</td>`).join('')}<td class="r">${GC.fmtN(sum(pastT), 1)}</td>${nextT.map(v => `<td class="r">${GC.fmtN(v, 1)}</td>`).join('')}<td class="r">${GC.fmtN(sum(nextT), 1)}</td></tr>

  }
  /* Planned capex by initiative and financial year: the rows behind the "next three years" columns above,
     so the two always add up to the same totals. p limits it to one parameter. */
  function investItems(inv, p) {
    const sum = a => a.reduce((x, y) => x + (y || 0), 0), its = inv.items.filter(x => !p || x.p === p);
    const ps = GC.P3.map(x => x.id).filter(q => its.some(x => x.p === q));
    const money = v => v ? GC.fmtN(v, 1) : '<span class="muted">—</span>';
    if (!its.length) return `<p class="muted small">No planned or in-progress initiative${p ? ' for this parameter' : ''} has capex entered.</p>`;
    const row = x => `<tr><td>${e(x.title)}<br><span class="muted small">${e(x.status)}, ${e(x.start || '?')} to ${e(x.end || '?')}</span></td>${x.alloc.map(v => `<td class="r">${money(v)}</td>`).join('')}<td class="r"><b>${GC.fmtN(sum(x.alloc), 1)}</b>${x.outside ? `<br><span class="muted small">+${GC.fmtN(x.outside, 1)} outside these years</span>` : ''}</td></tr>`;
    const subtotal = (label, list, cls) => { const t = [0, 1, 2].map(k => sum(list.map(x => x.alloc[k]))); return `<tr class="${cls}"><td>${e(label)}</td>${t.map(v => `<td class="r">${GC.fmtN(v, 1)}</td>`).join('')}<td class="r">${GC.fmtN(sum(t), 1)}</td></tr>`; };
    return `<div class="scroll"><table class="tbl itbl"><thead><tr><th>Initiative</th>${inv.nextYears.map(y => `<th class="r">${e(y)}</th>`).join('')}<th class="r">Total, next 3 years</th></tr></thead><tbody>
      ${ps.map(q => (p ? '' : `<tr class="sub"><td colspan="5">${e(pname(q))}</td></tr>`) + its.filter(x => x.p === q).map(row).join('') + (p || its.filter(x => x.p === q).length < 2 ? '' : subtotal('Subtotal, ' + pname(q), its.filter(x => x.p === q), 'subt'))).join('')}
      ${subtotal(p ? 'Total, ' + pname(p) : 'Total, all parameters', its, 'grp')}
    </tbody></table></div><p class="muted small" style="margin-top:6px">₹ lakh. Each initiative's capex is spread evenly over the financial years from its start date to its end date. Implemented and dropped initiatives are left out.</p>`;
  }
  /* One tooltip for every [data-gtip] element on the page (hover and keyboard focus). */
  let tipEl = null;
  function show(el, x, y) {
    if (!tipEl) { tipEl = document.createElement('div'); tipEl.className = 'g-tip'; tipEl.setAttribute('role', 'tooltip'); document.body.appendChild(tipEl); }
    const lines = (el.getAttribute('data-gtip') || '').split('\n');
    tipEl.innerHTML = '<b>' + e(lines[0]) + '</b>' + lines.slice(1).map(l => '<div>' + e(l) + '</div>').join('');
    tipEl.style.display = 'block';
    const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
    tipEl.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, x + 14)) + 'px';
    tipEl.style.top = Math.max(8, Math.min(window.innerHeight - h - 8, y + 14)) + 'px';
  }
  function hide() { if (tipEl) tipEl.style.display = 'none'; }
  document.addEventListener('mousemove', ev => { const r = ev.target.closest && ev.target.closest('[data-gtip]'); if (r) show(r, ev.clientX, ev.clientY); else hide(); });
  document.addEventListener('focusin', ev => { const r = ev.target.closest && ev.target.closest('[data-gtip]'); if (r) { const b = r.getBoundingClientRect(); show(r, b.left + b.width * 0.35, b.bottom - 6); } });
  document.addEventListener('focusout', hide);
  document.addEventListener('scroll', hide, true);
  return { planChart, investChart, investItems, fmtChange, goalWord, planStatus, trackStatus, needText, fmtVal, fmtImp, fmtGoal, PLAN, TRACK, pname };
})();

/* Demo stand-in for the ledger's monthly records for one financial year, up to the last completed month.
   Built from the base-year totals with a plausible trend per field, so some goals are on track and some behind.
   INTEGRATION: replace with window.TERRACAP_LEDGER_MONTHLY(profile, fyLabel) returning
   [{ month: 'YYYY-MM', rec: { prod, elec, thermal, onsiteRE, onsiteTh, offsiteRE, scope1, scope2, fwProc, fwDom, hazDisp, rm, transGHG } }]. */
function gcDemoMonthly(S, fy, today) {
  const y0 = GC.fyStart(fy); if (y0 == null) return [];
  const now = today || new Date();
  const base = GC.recordOf(S.data, 2, S.profile);
  const W = { flat: [.083, .085, .080, .082, .084, .083, .081, .084, .085, .083, .080, .090], water: [.095, .100, .085, .075, .075, .078, .080, .080, .080, .083, .084, .085],
    solar: [.100, .100, .080, .060, .060, .070, .080, .085, .085, .090, .090, .100], wind: [.060, .070, .100, .120, .120, .100, .070, .070, .070, .070, .080, .090] };
  ['solar', 'wind'].forEach(k => { W[k] = W[k].map((v, i) => 0.4 * v + 0.6 * W.flat[i]); });  /* damp seasonality so demo intensities stay plausible */
  const nzv = v => v == null ? 0 : v, wobble = (m, ph) => 1 + 0.012 * Math.sin(1.7 * m + ph);
  const out = [];
  for (let m = 0; m < 12; m++) {
    const y = m < 9 ? y0 : y0 + 1, mo = (m + 3) % 12 + 1;
    if (new Date(y, mo, 1) > now) break;  /* month not yet complete */
    const t = (m + 1) / 12, prod = nzv(base.prod) * W.flat[m] * 1.04 * wobble(m, 0.3);
    const perUnit = (k, a, b, ph) => base.prod ? nzv(base[k]) / base.prod * prod * (1 - (a + b * t)) * wobble(m, ph) : 0;
    const elec = perUnit('elec', 0.010, 0.010, 1.1), thermal = perUnit('thermal', 0.030, 0.020, 2.0);
    const onsiteRE = nzv(base.onsiteRE) * W.solar[m], offsiteRE = nzv(base.offsiteRE) * W.wind[m] * 1.06, onsiteTh = nzv(base.onsiteTh) * W.flat[m];
    const grid0 = Math.max(1, nzv(base.elec) - nzv(base.onsiteRE) - nzv(base.offsiteRE)), grid = Math.max(0, elec - onsiteRE - offsiteRE);
    const rec = { prod, elec, thermal, onsiteRE, onsiteTh, offsiteRE,
      scope1: base.thermal ? nzv(base.scope1) / base.thermal * thermal : null, scope2: nzv(base.scope2) / grid0 * grid,
      fwProc: base.prod ? nzv(base.fwProc) / base.prod * prod * 0.975 * (W.water[m] / W.flat[m]) * wobble(m, 0.7) : null,
      fwDom: nzv(base.fwDom) * W.water[m] * wobble(m, 1.4),
      hazDisp: perUnit('hazDisp', 0.020, 0.000, 2.6), rm: perUnit('rm', 0.012, 0.000, 0.4),
      transGHG: nzv(base.transGHG) * W.flat[m] * 1.04 * 0.93 * wobble(m, 1.9) };
    out.push({ month: y + '-' + String(mo).padStart(2, '0'), rec });
  }
  return out;
}

const F = GC.fmtN, MINUS = '\u2212';
let S = null, LENS = 'V3', TAB = 'overview', SRC = { kind: 'demo', at: null };
const C = {}; let charts = {};

/* ---------- data ---------- */
async function loadAssessment() {
  try { if (window.storage && window.storage.get) { const r = await window.storage.get('gc:assessment:v2', false); if (r && r.value) return JSON.parse(r.value); } } catch (e) { }
  try { const v = window.localStorage.getItem('gc:assessment:v2'); if (v) return JSON.parse(v); } catch (e) { }
  return null;
}
function ledgerFetch(profile) { return typeof window.TERRACAP_LEDGER === 'function' ? window.TERRACAP_LEDGER(profile) : gcDemoLedger(); }
function migrate(x) {
  ['judged', 'options', 'best', 'gates', 'targets', 'evidence', 'ai', 'catAi', 'overrides', 'src'].forEach(k => { x[k] = x[k] || {}; });
  x.initiatives = x.initiatives || [];
  ['perfGoals', 'milestones', 'past', 'fieldEvidence'].forEach(k => { x[k] = x[k] || {}; });
  if (!x.aiEngine) x.aiEngine = { id: 'claude', model: '' };
  if (x.data && x.data.scope1 === undefined) { delete x.data.s1Other; x.data.scope1 = [null, null, null]; x.data.scope2 = [null, null, null]; }
  return x;
}
function applyLedger() {
  const L = S.ledger || { values: {}, docs: {} };
  S.src = {};
  GC.FIELDS.forEach(f => {
    if (!f.ledger) { S.src[f.k] = 'manual'; return; }
    if (S.overrides[f.k]) { S.src[f.k] = 'override'; return; }
    const lv = L.values[f.k];
    if (Array.isArray(S.data[f.k])) S.src[f.k] = [0, 1, 2].map(i => { const v = Array.isArray(lv) ? lv[i] : null; if (v != null) { S.data[f.k][i] = v; return 'ledger'; } return 'gap'; });
    else if (lv != null) { S.data[f.k] = lv; S.src[f.k] = 'ledger'; } else S.src[f.k] = 'gap';
  });
}
function usedBy(f, cid) { return f.used.split(' ').some(t => t === cid || cid.replace(/[ab]$/, '') === t); }
function hasEvidence(cid) {
  if ((S.evidence[cid] || []).length) return true;
  return GC.FIELDS.some(f => f.ledger && usedBy(f, cid) && (Array.isArray(S.src[f.k]) ? S.src[f.k].includes('ledger') : S.src[f.k] === 'ledger') && ((S.ledger && S.ledger.docs[f.k]) || []).length);
}
function recompute() {
  C.res = GC.scoreAll(S); C.proj = GC.scoreAll(S, { projected: true });
  C.L = GC.lens(C.res, LENS); C.PL = GC.lens(C.proj, LENS);
  C.plan = GC.goalPlan(S); C.inv = GC.investment(S); C.T = tracking();
}

/* Monthly series for the assessment year. The demo spreads annual ledger totals over
   typical monthly profiles; TerraCAP's ledger holds the real monthly records. */
const W = {
  flat:  [.083, .085, .080, .082, .084, .083, .081, .084, .085, .083, .080, .090],
  water: [.095, .100, .085, .075, .075, .078, .080, .080, .080, .083, .084, .085],
  solar: [.100, .100, .080, .060, .060, .070, .080, .085, .085, .090, .090, .100],
  wind:  [.060, .070, .100, .120, .120, .100, .070, .070, .070, .070, .080, .090]
};
function spread(total, w) { const s = w.reduce((a, b) => a + b, 0); return w.map(x => total == null ? null : total * x / s); }
function ledgerMonthly() {
  if (typeof window.TERRACAP_LEDGER_MONTHLY === 'function') return window.TERRACAP_LEDGER_MONTHLY(S.profile);
  const g = k => { const v = S.data[k]; return Array.isArray(v) ? GC.num(v[2]) : GC.num(v); };
  const y = parseInt((S.profile.years[2].match(/(\d{4})/) || [0, 2024])[1], 10);
  const mn = ['Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec', 'Jan', 'Feb', 'Mar'];
  const labels = mn.map((m, i) => m + ' ' + String(i < 9 ? y : y + 1).slice(2));
  const prod = spread(g('prod'), W.flat), elec = spread(g('elec'), W.flat), th = spread(g('thermal'), W.flat);
  const on = spread(g('onsiteRE'), W.solar), off = spread(g('offsiteRE'), W.wind);
  const Y = C.res.M.Y[2];
  const s12 = spread((Y.s1 || 0) + (Y.s2 || 0), W.flat);
  const water = spread((g('fwProc') || 0) + (g('fwDom') || 0), W.water);
  const waste = spread((g('hazDisp') || 0) + (g('nonHaz') || 0), W.flat);
  return { labels, demo: true, rows: labels.map((l, i) => ({ l, prod: prod[i], energy: elec[i] * 0.0036 + th[i], elec: elec[i], water: water[i], s12: s12[i], waste: waste[i], re: elec[i] ? (on[i] + off[i]) / elec[i] * 100 : null })) };
}

/* ---------- helpers ---------- */

const bandTag = b => `<span class="band-t bc-${b.cls}">${esc(b.name)}</span>`;

function ladder(L, PL) {

  const mk = (cls, v, label) => `<div class="mk ${cls}" style="left:${pos(v)}%"><i></i><em>${label}</em></div>`;
  return `<div class="ladder" role="img" aria-label="Score ${pts(L.bandScore)} of 1000"><div class="track">${segs.map(s => `<div class="seg" style="width:${(s[1] - s[0]) / 10}%;background:var(--b-${s[2]});${s[2] === 'none' ? '' : 'opacity:.85'}"></div>`).join('')}</div>

}

/* ---------- overview ---------- */
function nearMisses() {
  const out = [];
  GC.CREDITS.forEach(c => { const r = C.res.R[c.id]; if (c.kind !== 'C' || !r.next || r.val == null || r.kind !== 'computed') return; const gap = r.next[0] - r.val; const lim = r.unit === '%' ? 2 : Math.max(0.15 * Math.abs(r.next[0]), 0.01); if (gap > 0 && gap <= lim) out.push({ c, r, gain: r.next[1] * (r.max / c.max) - r.pts }); });
  return out.sort((a, b) => b.gain - a.gain);
}
function rOverview() {
  const L = C.L, PL = C.PL, res = C.res;
  const comp = L.params.reduce((a, p) => a + p.comp, 0), claim = L.params.reduce((a, p) => a + p.claim, 0);
  const nb = GC.nextBand(L.bandScore);
  const toNext = nb ? (nb.min - L.bandScore) * (L.total ? L.total / L.bandScore : 1) : 0;
  const cs = GC.CREDITS.filter(c => !res.R[c.id].excluded), ev = cs.filter(c => hasEvidence(c.id)).length;
  const act = S.initiatives.filter(GC.isActive).length;
  const nm = nearMisses();
  return `<div class="kpis">
    <div class="kpi"><span>Indicative score</span><b>${pts(L.total)} <small>/ ${F(L.max, 0)}</small></b>${bandTag(L.band)}</div>
    <div class="kpi"><span>${nb ? 'Points to ' + nb.name : 'Top band reached'}</span><b>${nb ? pts(toNext) : '—'}</b><small>${nb ? 'on the ' + F(L.max, 0) + '-point scale' : ''}</small></div>
    <div class="kpi"><span>If planned initiatives deliver</span><b>${pts(PL.total)}</b>${bandTag(PL.band)} <small>from ${act} initiative${act === 1 ? '' : 's'}</small></div>
    <div class="kpi"><span>Computed from plant data</span><b>${pts(comp)}</b><small>${pts(claim)} self-claimed</small></div>
    <div class="kpi"><span>Mandatory requirements</span><b style="${res.gatesMet === res.gatesN ? '' : 'color:var(--red)'}">${res.gatesMet} / ${res.gatesN}</b><small>${res.gatesMet === res.gatesN ? 'All met' : 'Not ratable until all are met'}</small></div>
    <div class="kpi"><span>Goals on track, ${esc(C.T.fy)} so far</span>${C.T.set ? `<b>${C.T.on} <small>of ${C.T.set}</small></b><small>${C.T.behind} behind, ${C.T.worse} worse than base; ${C.T.n} month${C.T.n === 1 ? '' : 's'} of data</small>` : `<b>—</b><small>Set goals in GreenCo Readiness</small>`}</div>
    <div class="kpi"><span>Credits with evidence</span><b>${Math.round(ev / cs.length * 100)}%</b><small>${ev} of ${cs.length} credits</small></div>
  </div>
  <div class="panel" style="margin-top:14px"><h3>Where the plant sits on the GreenCo scale</h3>${ladder(L, PL)}
    <div class="legend"><span><i class="tick" style="background:var(--ink)"></i>Indicative score now</span><span><i class="tick" style="background:var(--green-d);width:2px"></i>Computed from plant data</span><span><i class="tick dash"></i>If planned initiatives deliver</span></div></div>
  <div class="grid2" style="margin-top:14px">
    <div class="panel"><h3>Points by parameter</h3><div class="chartbox" style="height:320px"><canvas id="chParams"></canvas></div></div>
    <div class="panel"><h3>Close to the next band</h3><p class="muted small" style="margin:2px 0 8px">Performance credits within two percentage points (or 15%) of their next threshold.</p>
      <div class="mini">${nm.length ? nm.map(x => `<div class="it"><b>${x.c.id}</b><span>${esc(x.c.name)}<br><span class="muted small">Now ${fmtVal(x.c, x.r)}, next band at ${x.r.op === '>' ? 'over' : 'at least'} ${F(x.r.next[0], 2)}${x.r.unit === '%' ? '%' : ''}</span></span><span class="g" style="color:var(--green)">+${pts(x.gain)}</span></div>`).join('') : '<p class="muted">No performance credit is close to its next band.</p>'}</div></div>
  </div>`;
}

  const ps = C.L.params.filter(p => p.max > 0), pp = C.PL.params;
  charts.p = new Chart($('#chParams'), { type: 'bar', data: { labels: ps.map(p => p.id), datasets: [

/* ---------- consumption ---------- */
function rConsumption() {
  const m = ledgerMonthly(), R = m.rows, sum = k => R.reduce((a, r) => a + (r[k] || 0), 0);
  const last = R[R.length - 1], prev = R[R.length - 2];
  const d = k => prev[k] ? ((last[k] - prev[k]) / prev[k] * 100) : null;
  const card = (label, v, unit, k, lowerBetter = true) => { const x = d(k); const good = x == null ? null : (lowerBetter ? x <= 0 : x >= 0);
    return `<div class="kpi"><span>${label}, ${esc(S.profile.years[2])}</span><b>${F(v, 0)} <small>${unit}</small></b><small style="color:${good == null ? 'var(--muted)' : good ? 'var(--green)' : 'var(--red)'}">${x == null ? '' : (x > 0 ? '+' : MINUS) + F(Math.abs(x), 1) + '% in ' + esc(last.l) + ' vs ' + esc(prev.l)}</small></div>`; };
  const reYr = C.res.M.reTotal;
  return `<div class="kpis">
    ${card('Energy', sum('energy'), 'GJ', 'energy')}${card('Fresh water', sum('water'), 'm³', 'water')}${card('Scope 1+2', sum('s12'), 'tCO2e', 's12')}${card('Waste', sum('waste'), 't', 'waste')}
    <div class="kpi"><span>Renewable share, ${esc(S.profile.years[2])}</span><b>${F(reYr, 1)}%</b><small>On-site and off-site renewables</small></div>
    ${card('Production', sum('prod'), esc(S.profile.productUnit), 'prod', false)}
  </div>
  ${m.demo ? '<p class="muted small" style="margin-top:8px">Monthly figures in this demo spread the ledger\u2019s annual totals over typical monthly profiles. In TerraCAP they come from the ledger\u2019s monthly records for this plant.</p>' : ''}
  <div class="grid3" style="margin-top:14px">${MONTHLY.map(x => `<div class="panel"><h3>${x[1]}</h3><p class="muted small">${x[2]} by month</p><div class="chartbox" style="height:190px"><canvas id="chM_${x[0]}"></canvas></div></div>`).join('')}</div>
  <div class="panel" style="margin-top:14px"><h3>Monthly summary</h3><div class="scroll"><table class="tbl" style="margin-top:8px"><thead><tr><th>Month</th><th class="r">Production (${esc(S.profile.productUnit)})</th><th class="r">Energy (GJ)</th><th class="r">SEC (GJ/unit)</th><th class="r">Fresh water (m³)</th><th class="r">Scope 1+2 (tCO2e)</th><th class="r">Waste (t)</th><th class="r">Renewable share</th></tr></thead><tbody>
  ${R.slice().reverse().map(r => `<tr><td>${esc(r.l)}</td><td class="r">${F(r.prod, 0)}</td><td class="r">${F(r.energy, 0)}</td><td class="r">${F(r.prod ? r.energy / r.prod : null, 3)}</td><td class="r">${F(r.water, 0)}</td><td class="r">${F(r.s12, 0)}</td><td class="r">${F(r.waste, 1)}</td><td class="r">${F(r.re, 1)}%</td></tr>`).join('')}</tbody></table></div></div>`;
}
/* One measure per chart, one axis each: [key, title, unit, decimals, type] */
const MONTHLY = [['energy', 'Energy', 'GJ', 0, 'bar'], ['s12', 'Scope 1+2 emissions', 'tCO2e', 0, 'bar'], ['water', 'Fresh water', 'm³', 0, 'bar'],

/* ---------- goals: monthly tracking (INTEGRATION: window.TERRACAP_LEDGER_MONTHLY) ---------- */
function monthlyFetch(fy) { return typeof window.TERRACAP_LEDGER_MONTHLY === 'function' ? window.TERRACAP_LEDGER_MONTHLY(S.profile, fy) : gcDemoMonthly(S, fy); }
const MON = ['Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec', 'Jan', 'Feb', 'Mar'];
/* The goal year that contains today is tracked; before year 1 nothing is tracked yet, after year 3 the last year is shown. */
function trackingYear() {
  const Ys = C.plan.years, now = new Date();
  for (let k = 0; k < 3; k++) { const y0 = GC.fyStart(Ys[k]); if (y0 != null && now >= new Date(y0, 3, 1) && now < new Date(y0 + 1, 3, 1)) return { k, fy: Ys[k] }; }
  const y1 = GC.fyStart(Ys[0]);
  return (y1 != null && now < new Date(y1, 3, 1)) ? { k: -1, fy: Ys[0] } : { k: 2, fy: Ys[2] };
}
function tracking() {
  const ty = trackingYear(), ctx = C.plan.ctx;
  const months = ty.k < 0 ? [] : (monthlyFetch(ty.fy) || []);
  const n = months.length, ytdRec = n ? GC.sumRecords(months.map(x => x.rec)) : null;
  const rows = C.plan.rows.map(r => {
    const tk = Math.max(0, ty.k), target = r.targets[tk];
    const ytd = ytdRec ? GC.metricValue(r.m, ytdRec, ctx) : null;
    const st = r.goal.y1 == null && r.goal.y3 == null ? 'nogoal' : GC.trackStatus(r.m, r.base, target, ytd, n / 12);
    let cum = []; const acc = [];
    months.forEach(x => { acc.push(x.rec); cum.push(GC.metricValue(r.m, GC.sumRecords(acc), ctx)); });
    const mon = months.map(x => GC.metricValue(r.m, x.rec, ctx));
    return { r, target, ytd, st, mon, cum, imp: r.m.kind === 'absolute' ? (ytd == null ? null : GC.improvement(r.m, r.base * n / 12, ytd)) : GC.improvement(r.m, r.base, ytd) };
  });
  const set = rows.filter(x => x.st !== 'nogoal');
  return { fy: ty.fy, k: ty.k, n, months, rows, set: set.length, on: set.filter(x => x.st === 'on').length, behind: set.filter(x => x.st === 'behind').length, worse: set.filter(x => x.st === 'worse').length, nodata: set.filter(x => x.st === 'nodata').length };
}
let PATH = 'secT';
function setPath(id) { PATH = id; render(); }
function rGoals() {
  const T = C.T, P = C.plan, Y = P.years;
  const label = T.months.length ? MON[0] + ' to ' + MON[T.n - 1] : 'none yet';
  if (!P.set) return `<div class="panel"><h3>No goals set yet</h3><p class="muted" style="margin-top:6px">Set performance goals in <a href="greenco-readiness.html">GreenCo Readiness</a>, under Goals. Progress against them is tracked here month by month.</p></div>`;
  return `<div class="kpis">
    <div class="kpi"><span>Tracking year</span><b>${esc(T.fy)}</b><small>${T.k < 0 ? 'Starts in April' : 'Year ' + (T.k + 1) + ' of 3, against base ' + esc(P.baseYear)}</small></div>
    <div class="kpi"><span>Months with data</span><b>${T.n} <small>of 12</small></b><small>${esc(label)}</small></div>
    <div class="kpi"><span>On track</span><b style="color:var(--green-d)">${T.on} <small>of ${T.set}</small></b><small>Year to date meets this year's goal</small></div>
    <div class="kpi"><span>Behind goal</span><b style="color:var(--amber)">${T.behind}</b><small>Better than base, not yet at goal</small></div>
    <div class="kpi"><span>Worse than base year</span><b style="color:var(--red)">${T.worse}</b><small>Needs attention</small></div>
  </div>

/* ---------- reports ---------- */
async function download(name, text, type) {
  let dl = null;
  try { if (window.claude && typeof window.claude.use === 'function') dl = await Promise.race([window.claude.use('downloads'), new Promise(r => setTimeout(() => r(null), 3000))]); } catch (e) { }
  if (dl) { try { await dl.save({ filename: name, data: text }); return true; } catch (e) { if (!(e && e.code === 'declined')) toast('Download is not available here.'); return false; } }
  const b = new Blob([text], { type }), a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); return true;
}
function slug() { return (S.profile.plant || 'plant').replace(/[^a-z0-9]+/gi, '-').toLowerCase(); }
async function exportCSV() {
  const q = s => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';

  if (await download('greenco-credits-' + slug() + '.csv', rows.map(r => r.map(q).join(',')).join('\n'), 'text/csv')) toast('Credit table exported');
}

  return `<div class="grid3">
    <div class="panel"><h3>Submission pack</h3><p class="muted small" style="margin:6px 0 12px">Printable readiness pack with the credit table, initiatives register, mandatory requirements and data sources. Built in GreenCo Readiness.</p><a class="btn pri" href="greenco-readiness.html">Open GreenCo Readiness</a></div>
    <div class="panel"><h3>Credit table</h3><p class="muted small" style="margin:6px 0 12px">Every credit with its result, points, type and evidence status, as CSV.</p><button class="btn" onclick="exportCSV()">Download CSV</button></div>
    <div class="panel"><h3>Goal tracking</h3><p class="muted small" style="margin:6px 0 12px">Each goal measure by month for ${esc(C.T.fy)}, with year to date, this year's goal and status, as CSV.</p><button class="btn" onclick="exportGoals()">Download CSV</button></div>
    <div class="panel"><h3>Monthly consumption</h3><p class="muted small" style="margin:6px 0 12px">Monthly production, energy, water, emissions, waste and renewable share for ${esc(S.profile.years[2])}, as CSV.</p><button class="btn" onclick="exportMonthly()">Download CSV</button></div>
  </div>
  <div class="panel" style="margin-top:14px"><h3>Score by version</h3><p class="muted small" style="margin:2px 0 10px">The same plant data scored three ways. Only V3 uses published credit rules; V4 and Lite are provisional.</p>
    <table class="tbl"><thead><tr><th>Version</th><th class="r">Score</th><th>Band</th><th class="r">With planned initiatives</th></tr></thead><tbody>
    ${vs.map(x => `<tr><td>${esc(GC.VERSIONS[x.v].name)} ${x.v !== 'V3' ? '<span class="tag k-prov">Provisional</span>' : ''}</td><td class="r"><b>${pts(x.L.total)}</b> / ${F(x.L.max, 0)}</td><td>${bandTag(x.L.band)}</td><td class="r">${pts(x.P.total)} ${bandTag(x.P.band)}</td></tr>`).join('')}</tbody></table>
    <button class="btn noprint" style="margin-top:12px" data-print onclick="window.print()">Print this dashboard</button></div>`;
}

function orgFetch(profile) { return typeof window.TERRACAP_ORG_PROFILE === 'function' ? window.TERRACAP_ORG_PROFILE(profile) : gcDemoOrgProfile(); }
function applyOrg() { const o = orgFetch(S.profile); if (!o) return; if (o.org) S.profile.org = o.org; if (o.plant) S.profile.plant = o.plant; if (o.location) S.profile.location = o.location; if (o.productionUnit) S.profile.productUnit = o.productionUnit; }

/* ---------- boot ---------- */
(async () => {
  const saved = await loadAssessment();
  if (saved && saved.profile && saved.data) { S = migrate(saved); SRC = { kind: 'saved', at: null }; }
  else { S = migrate(gcSeed()); }
  if (!S.ledger) S.ledger = ledgerFetch(S.profile);
  applyLedger(); applyOrg();
  LENS = S.profile.version || 'V3';
  recompute(); render();
})();
</script>
</body></html>
