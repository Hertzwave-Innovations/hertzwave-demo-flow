function insideMeansHTML(){
  const f=flags();
  return `<div class="note n-info"><span class="i">i</span><div>
    <b>What “Inside” and “Outside” mean.</b>
    ${f.pat?`<br><b>PAT:</b> Inside means every tonne of fuel, every unit of steam and every kWh the unit consumes is added to your total energy (toe), and everything it produces is added to your production. Both feed your SEC. Energy for non-process uses inside the fence — township, hospital, construction — is still metered, then taken out through normalisation, not by leaving the unit out.`:''}
    ${f.ccts?`<br><b>CCTS:</b> Inside means the unit’s direct emissions (Scope 1) and the purchased electricity and heat it uses (Scope 2) are added to your GHG total, and its output to your product.`:''}
    <br><b>Outside</b> means none of it counts. But if its fuel or power comes through your gate meters and invoices, you must subtract it with a sub-meter the verifier can test. If you can’t meter it, you can’t leave it out.
  </div></div>`;
}

function recommend(a, ans){
  const f=flags(), out={};
  const scheme = (k) => {
    if(!ans.fence && !ans.baseline) return {d:'out', t:'Outside the plant and not in the baseline. Leave it out.'};
    if(!ans.fence && ans.baseline) return {d:'in', t:'Outside the fence today but inside the baseline. Keep it in for consistency and record why, or apply for a boundary change.'};
    if(!ans.metered) return {d:'in', t:'You can’t exclude what you can’t meter separately. Keep it in.'};
    if(!ans.process){
      return k==='pat'
        ? {d:'in', t:'Keep it inside the metered boundary and report its energy separately. PAT removes township, colony and construction energy through normalisation.'}
        : (!ans.sub
            ? {d:'in', t:'Non-process, but not separately metered: keep it in and record why. Install a sub-meter if you want to exclude it in future years.'}
            : ans.baseline
              ? {d:'in', t:'Non-process and sub-metered, but it was inside the baseline. Keep it in for consistency with the target, or raise a boundary change with BEE.'}
              : {d:'out', t:'Non-process, sub-metered and not in the baseline: exclude it, and keep the sub-meter readings as evidence.'});
    }
    if(!ans.baseline) return {d:'in', t: k==='pat'
        ? 'New process capacity. Include it and log it as a change; PAT accounts for it through normalisation for capacity and product mix.'
        : 'New process capacity. Include it and log it as a change; it may support a request to BEE to adjust your target.'};
    return {d:'in', t:'A process unit inside the fence and inside the baseline. Inside.'};
  };
  if(f.pat) out.pat=scheme('pat');
  if(f.ccts) out.ccts=scheme('ccts');
  return out;
}

function helperHTML(a){
  const ans = Object.assign({}, ASSET_FACTS[a.id]||a.facts||{}, S.dom.ans[a.id]);
  const Q = [['fence','Is it physically inside the plant fence?'],['metered','Does its fuel or electricity come through your gate meters or invoices?'],['process','Does it serve the production process (not housing, offices or construction)?'],['baseline','Was it inside the boundary in the baseline year?']];
  if(!ans.process) Q.push(['sub','Is it separately sub-metered, so its consumption can be shown on its own?']);
  const r = recommend(a, ans), f=flags();
  const pick = f.ccts ? r.ccts.d : r.pat.d;
  return `<div class="helper">
    <div class="small" style="font-weight:600;margin-bottom:4px">${a.name} — four questions</div>
    ${Q.map(([k,q])=>`<div class="qrow"><span>${q}</span><span class="seg"><button class="${ans[k]?'on':''}" onclick="setAns('${a.id}','${k}',true)">Yes</button><button class="${ans[k]===false?'on':''}" onclick="setAns('${a.id}','${k}',false)">No</button></span></div>`).join('')}
    <div class="rec">
      ${r.pat?`<div><b>PAT</b> — ${r.pat.d==='in'?'Inside':'Outside'}<br><span class="muted">${r.pat.t}</span></div>`:''}
      ${r.ccts?`<div><b>CCTS</b> — ${r.ccts.d==='in'?'Inside':'Outside'}<br><span class="muted">${r.ccts.t}</span></div>`:''}
    </div>
    ${r.pat&&r.ccts&&r.pat.d!==r.ccts.d?`<div class="note n-warn"><span class="i">!</span><div>The schemes differ for this unit. Keep it inside the metered boundary and mark it as excluded for CCTS; the PAT normalisation uses the same sub-meter.</div></div>`:''}
    <div class="row mt"><button class="btn btn-p" onclick="setAsset('${a.id}','${pick}');S.dom.help='none';render()">Use this: ${pick==='in'?'Inside':'Outside'}</button><span class="small muted">The answers are saved with the boundary statement as your reasoning.</span></div>
  </div>`;
}

sCalc = function(){
  const f=flags(), r=domCalc(), d=S.dom, P=PLATFORM;
  const eq=d.eq, sinterEq=eq.sinterSold*eq.sinterSoldFactor;
  const streams=P.streams;
  const fuelRows=streams.filter(s=>s.gcv>0).map(s=>({n:s.name, q:s.qty, g:s.gcv, toe:s.qty*1000*s.gcv/1e7}));
  const allowed=d.target.ccts*r.eqProd, total=r.scope1+r.scope2;
  const patAllowed=d.target.pat*r.eqProd;
  return `
  <div class="crumb">India — domestic</div>
  <h1>Calculation & position</h1>
  <p class="lede">Every number below is built step by step, so you can follow it and your verifier can retrace it. FY2026-27 uses ${P.monthsFY} months of actuals; the remaining ${12-P.monthsFY} months are projected at the same run-rate. This is a tracking position, not a filing figure.</p>

  <div class="card">
    <h2>Step 1 · Equivalent product — the denominator for both schemes</h2>
    <p class="sub">Your main product is crude steel. Intermediates you sell outside the boundary consumed energy and created emissions but never became your crude steel, so each is converted into crude-steel-equivalent tonnes and added. Intermediates you buy in work the other way.</p>
    <div class="tw"><table class="t" style="max-width:760px">
      <thead><tr><th>Flow</th><th class="r">Tonnes</th><th class="r">× Factor</th><th class="r">= Equivalent t</th><th>Source</th></tr></thead>
      <tbody>
        <tr><td>Crude steel produced</td><td class="r num">${fmt(r.crude)}</td><td class="r num">1.00</td><td class="r num">${fmt(r.crude)}</td><td>${PB.plat('Production MIS')}</td></tr>
        <tr><td>Sinter sold outside the boundary</td><td class="r num">${fmt(eq.sinterSold)}</td><td class="r num">${eq.sinterSoldFactor.toFixed(2)}</td><td class="r num">${fmt(sinterEq)}</td><td>${PB.entry()} ${PB.ref()}</td></tr>
        <tr><td>Other adjustments (purchased hot metal, slabs)</td><td class="r num">—</td><td class="r num">—</td><td class="r num">${fmt(eq.billetAdj)}</td><td>${PB.entry()}</td></tr>
      </tbody>
      <tfoot><tr><td colspan="3">Equivalent product</td><td class="r num">${fmt(r.eqProd)}</td><td></td></tr></tfoot>
    </table></div>
    <div class="calc">${fmt(r.crude)} + ${fmt(eq.sinterSold)} × ${eq.sinterSoldFactor.toFixed(2)} + ${fmt(eq.billetAdj)} = <b>${fmt(r.eqProd)} t</b></div>
    <p class="small muted mt">Factors come from BEE’s iron and steel methodology — the same ones used for your baseline. Change them on the Boundary screen, never here.</p>
  </div>

  ${f.ccts?`<div class="card">
    <div class="row" style="justify-content:space-between"><h2>CCTS — greenhouse-gas emission intensity (GEI) and Carbon Credit Certificates (CCCs)</h2><span class="tag ${d.target.cctsStatus==='draft'?'t-amber':'t-teal'}">Target: ${d.target.cctsStatus==='draft'?'draft notification':'gazetted'}</span></div>
    <div class="step"><div class="sn">2</div><div><b>Total GHG emissions</b> = Scope 1 + Scope 2
      <div class="tw"><table class="t mt"><tbody>${streams.map(s=>`<tr><td>${s.name}</td><td class="r num">${fmt(s.tco2)} tCO₂e</td></tr>`).join('')}
      <tr><td><b>Scope 1</b> — all source streams, from the GHG ledger</td><td class="r num"><b>${fmt(r.scope1)}</b></td></tr>
      <tr><td><b>Scope 2</b> — grid electricity ${fmt(P.elec.gridMWh)} MWh × ${r.cctsEF} tCO₂/MWh (latest CEA average grid factor, Procedure §4(4)(vii))</td><td class="r num"><b>${fmt(r.scope2)}</b></td></tr></tbody></table></div>
      <div class="calc">${fmt(r.scope1)} + ${fmt(r.scope2)} = <b>${fmt(total)} tCO₂e</b></div>
      <p class="small muted mt">Captive power plant fuel is already in Scope 1, so its electricity is not counted again in Scope 2.</p></div></div>
    <div class="step"><div class="sn">3</div><div><b>GHG emission intensity (GEI)</b> = total emissions ÷ equivalent product
      <div class="calc">${fmt(total)} ÷ ${fmt(r.eqProd)} = <b>${fmt(r.gei,4)} tCO₂e per tonne</b></div></div></div>
    <div class="step"><div class="sn">4</div><div><b>Position against your target</b> — 1 carbon credit certificate (CCC) = 1 tCO₂e
      <div class="calc">Emissions allowed at target = ${fmt(d.target.ccts,3)} × ${fmt(r.eqProd)} = ${fmt(allowed)} tCO₂e<br>
      ${r.cctsGap>0?'Shortfall':'Surplus'} = ${fmt(total)} − ${fmt(allowed)} = <b>${fmt(Math.abs(r.cctsGap))} CCCs</b><br>
      Same thing per tonne: (${fmt(r.gei,4)} − ${fmt(d.target.ccts,3)}) × ${fmt(r.eqProd)} = ${fmt(r.cctsGap)}</div>
      <p class="small mt">${r.cctsGap>0?`<b>You emitted ${fmt(r.cctsGap)} tCO₂e more than the target allows.</b> You must buy and surrender that many CCCs by the deadline. Missing them brings environmental compensation of twice the average CCC trading price.`:`<b>You emitted ${fmt(-r.cctsGap)} tCO₂e less than the target allows.</b> BEE issues that many CCCs, which you can sell or bank.`}</p>
      <div class="grid3 mt">
        <div class="stat"><div class="sl">Target ${PB.ref()}</div><div class="sv">${fmt(d.target.ccts,3)}</div><div class="su">illustrative — load from the schedule</div></div>
        <div class="stat"><div class="sl">Achieved GEI</div><div class="sv">${fmt(r.gei,3)}</div><div class="su">tCO₂e / t eq. product</div></div>
        <div class="stat ${r.cctsGap>0?'hi':'ok'}"><div class="sl">${r.cctsGap>0?'Projected shortfall':'Projected surplus'}</div><div class="sv">${fmt(Math.abs(r.cctsGap))}</div><div class="su">CCCs</div></div>
      </div></div></div>
    <div class="note n-warn"><span class="i">!</span><div><b>Target watch.</b> Your target is from the 26 June 2026 draft schedule. When the final notification is gazetted, TerraCAP reloads your row and recomputes this position.</div></div>
  </div>`:''}

  ${f.pat?`<div class="card">
    <h2>PAT — specific energy consumption (SEC) and Energy Saving Certificates (ESCerts)</h2>
    <div class="step"><div class="sn">2</div><div><b>Total energy in tonnes of oil equivalent (toe)</b>. Fuel: tonnes × 1,000 kg × GCV (kcal/kg) ÷ 10,000,000 kcal per toe. Grid electricity: MWh × 1,000 kWh × ${d.patGridKcal} kcal/kWh ÷ 10,000,000.
      <div class="tw"><table class="t mt"><thead><tr><th>Energy input</th><th class="r">Quantity</th><th class="r">GCV</th><th class="r">toe</th></tr></thead><tbody>
      ${fuelRows.map(x=>`<tr><td>${x.n}</td><td class="r num">${fmt(x.q)} t</td><td class="r num">${fmt(x.g)} kcal/kg</td><td class="r num">${fmt(x.toe)}</td></tr>`).join('')}
      <tr><td>Grid electricity</td><td class="r num">${fmt(P.elec.gridMWh)} MWh</td><td class="r num">${d.patGridKcal} kcal/kWh</td><td class="r num">${fmt(r.gridToe)}</td></tr></tbody>
      <tfoot><tr><td colspan="3">Total energy</td><td class="r num">${fmt(r.toe)}</td></tr></tfoot></table></div>
      <p class="small muted mt">Limestone and other fluxes carry no energy and are not in this table. Captive power is counted once, as the coal it burns.</p></div></div>
    <div class="step"><div class="sn">3</div><div><b>Specific energy consumption (SEC)</b> = total energy ÷ equivalent product
      <div class="calc">${fmt(r.toe)} ÷ ${fmt(r.eqProd)} = <b>${fmt(r.sec,4)} toe per tonne</b> (before normalisation)</div></div></div>
    <div class="step"><div class="sn">4</div><div><b>Position against your cycle target</b> — 1 ESCert = 1 toe
      <div class="calc">Energy allowed at target = ${fmt(d.target.pat,3)} × ${fmt(r.eqProd)} = ${fmt(patAllowed)} toe<br>
      ${r.patGap>0?'Shortfall':'Surplus'} = ${fmt(r.toe)} − ${fmt(patAllowed)} = <b>${fmt(Math.abs(r.patGap))} ESCerts</b></div>
      <p class="small mt">${r.patGap>0?`<b>You used ${fmt(r.patGap)} toe more than the target allows</b>, so you need that many ESCerts.`:`<b>You used ${fmt(-r.patGap)} toe less</b>, so you earn that many ESCerts.`} Before filing, the SEC is normalised for capacity utilisation, product mix, fuel quality and power mix as the BEE normalisation document sets out. Normalisation can move this figure substantially.</p>
      <div class="grid3 mt">
        <div class="stat"><div class="sl">Cycle target ${PB.ref()}</div><div class="sv">${fmt(d.target.pat,3)}</div><div class="su">toe/t — illustrative</div></div>
        <div class="stat"><div class="sl">Achieved SEC</div><div class="sv">${fmt(r.sec,3)}</div><div class="su">toe/t, before normalisation</div></div>
        <div class="stat ${r.patGap>0?'hi':'ok'}"><div class="sl">${r.patGap>0?'Projected shortfall':'Projected surplus'}</div><div class="sv">${fmt(Math.abs(r.patGap))}</div><div class="su">ESCerts</div></div>
      </div></div></div>
  </div>`:''}
  <div class="btns"><button class="btn btn-p" onclick="go('d_verify')">Verify & submit</button></div>`;
};

function evDone(id){ return !!(id && S.ev[id]); }
function tplButtons(id){
  if(!id||!TEMPLATES[id]) return '';
  const e=S.ev[id];
  return `<span class="tplb"><button class="btn" onclick="tplDownload('${id}')">Download template</button><button class="btn" onclick="tplOpen('${id}')">Fill online</button><button class="btn" onclick="tplUpload('${id}')">Upload</button>${e?`<span class="tag t-teal">${e.by==='upload'?'Uploaded: '+esc(e.file):'Filled online '+e.date}</span>`:''}</span>`;
}
function tplDownload(id){
  const T=TEMPLATES[id], name=T.title.replace(/[^A-Za-z0-9]+/g,'_').replace(/_+$/,'');
  let blob, ext;
  if(T.kind==='table'){
    const rows=[T.cols].concat(T.rows());
    const csv='﻿'+rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
    blob=new Blob([csv],{type:'text/csv'}); ext='csv';
  } else {
    const secs=T.sections();
    const html=`<html><head><meta charset="utf-8"><title>${T.title}</title></head><body style="font-family:Calibri,Arial;font-size:11pt"><h1 style="font-size:16pt">${T.title}</h1><p style="color:#666">${PLATFORM.entity} · ${PLATFORM.installation} · prepared by TerraCAP ${new Date().toISOString().slice(0,10)} · ${RULESET.id}</p>${secs.map(([h,b])=>`<h2 style="font-size:12pt">${h}</h2><p>${esc(b||'[to complete]').replace(/\n/g,'<br>')}</p>`).join('')}</body></html>`;
    blob=new Blob([html],{type:'application/msword'}); ext='doc';
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`TerraCAP_${name}.${ext}`; a.click();
}
function tplUpload(id){
  const i=document.createElement('input'); i.type='file'; i.accept='.pdf,.doc,.docx,.xls,.xlsx,.csv,.jpg,.jpeg,.png';
  i.onchange=()=>{ if(i.files[0]){ S.ev[id]={by:'upload', file:i.files[0].name, date:new Date().toISOString().slice(0,10)}; render(); } };
  i.click();
}
let MODAL=null;
function tplOpen(id){
  const T=TEMPLATES[id];
  MODAL={id, data: S.ev[id]&&S.ev[id].data ? JSON.parse(JSON.stringify(S.ev[id].data)) : (T.kind==='table'? T.rows().map(r=>r.map(String)) : T.sections().map(([h,b])=>[h,b]))};
  drawModal();
}
function drawModal(){
  document.getElementById('modal')?.remove();
  if(!MODAL) return;
  const T=TEMPLATES[MODAL.id], D=MODAL.data;
  const body = T.kind==='table'
    ? `<div class="tw"><table class="t"><thead><tr>${T.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${D.map((r,i)=>`<tr>${r.map((v,j)=>`<td><input type="text" value="${esc(v)}" oninput="MODAL.data[${i}][${j}]=this.value"></td>`).join('')}</tr>`).join('')}</tbody></table></div>
       <button class="btn mt" onclick="MODAL.data.push(TEMPLATES[MODAL.id].cols.map(()=>''));drawModal()">Add row</button>`
    : D.map(([h,b],i)=>`<div class="sec"><label>${h}</label><textarea oninput="MODAL.data[${i}][1]=this.value">${esc(b||'')}</textarea></div>`).join('');
  document.body.insertAdjacentHTML('beforeend', `<div class="modal-bg" id="modal" onclick="if(event.target===this){MODAL=null;drawModal()}"><div class="modal" role="dialog" aria-label="${esc(T.title)}">
    <h2>${T.title}</h2><p class="sub">Pre-filled from TerraCAP where the data exists. Complete the rest and save — it goes into the evidence binder, dated.</p>
    ${body}
    <div class="btns"><button class="btn btn-p" onclick="S.ev[MODAL.id]={by:'online',date:new Date().toISOString().slice(0,10),data:MODAL.data};MODAL=null;drawModal();render()">Save to binder</button><button class="btn" onclick="tplDownload(MODAL.id)">Download instead</button><button class="btn btn-g" onclick="MODAL=null;drawModal()">Cancel</button></div>
  </div></div>`);
}

function factorHelpHTML(){
  const R = S.setup.sector==='steel' ? (function(){ const P=PLATFORM; const sinterDir=(P.streams.filter(s=>s.proc==='sinter').reduce((a,s)=>a+s.tco2,0))/P.prod.sinter; const ind=P.elec.sinterMWh*0.727/P.prod.sinter; const D=domCalc(); return {sinter:sinterDir+ind, gei:D.gei}; })() : null;

    <p class="mono" style="background:#fafafa;padding:8px 10px;border-radius:6px">equivalence factor ≈ energy (PAT) or emissions (CCTS) per tonne of intermediate, up to that stage<br>÷ energy or emissions per tonne of main product</p>
    ${R?`<p><b>Sense-check on your own data:</b> making a tonne of sinter here emits about ${fmt(R.sinter,3)} tCO₂e. A tonne of crude-steel-equivalent emits about ${fmt(R.gei,3)}. ${fmt(R.sinter,3)} ÷ ${fmt(R.gei,3)} = <b>${fmt(R.sinter/R.gei,3)}</b> — close to the 0.10 used here. A large gap between your sense-check and the notified factor is worth raising with your verifier, but the notified factor still applies.</p>`:''}
    <p>For PAT, the factors are in the normalisation document for your sector. For CCTS, they are in the GHG-intensity methodology behind your target notification.</p>
  </div></details>`;
}

  ${flags().pat?`<li>PAT: ${A.metric||'specific energy consumption (SEC) = total energy (toe) ÷ equivalent product'}; ESCerts = (achieved − target) × output, after normalisation</li>`:''}</ol></div>`;
};

Object.assign(SCREENS, {d_data:sData, d_calc:sCalc, d_verify:sVerify, c_handoff:sHandoff});

/* ════════════════════════════════════════════════════════════════════════
   v4.4 — second expert review (12 Oct 2026)
   · Applicability, target and denominator come from the entity’s notification
     record, not from the industry archetype (archetypes stay as prompts).
   · CCTS boundary rules follow the BEE Detailed Procedure v1.0 with clause refs.
   · Every result carries a status: Draft estimate → Verified → Registry/regulator confirmed.
   · Rule register adds IR (EU) 2026/1740 (corrected default values).
   ════════════════════════════════════════════════════════════════════════ */

/* ---------- rule register additions ---------- */
RULESET.id = 'EU-CBAM-DEF-2026.4';
RULESET.items.splice(RULESET.items.findIndex(x=>x.k==='dv')+1, 0,
  {k:'dv2', name:'Implementing Regulation (EU) 2026/1740 — correcting the Default Values Act', ver:'In force 3 Aug 2026; applies from 1 Jan 2026. Replaces Annexes I and IV of 2025/2621', status:'In force · values NOT loaded', use:'Corrected default values and route indicators; TARIC splits white/grey clinker and cement; calcined clay = TARIC 2507 00 80 80; mark-ups now applied by the Registry'});
RULESET.items.push({k:'ccts', name:'BEE — Detailed Procedure for Compliance Mechanism under CCTS', ver:'Version 1.0, July 2024', status:'In force (India)', use:'Boundary inclusions and exclusions, biomass, renewables, exported power, grid factor, Forms 1/A/B, timelines, CCC formula'});
const REFDATA_STATUS_V44 = 'PLACEHOLDER — benchmarks (2025/2620) and default values (2025/2621 as corrected by 2026/1740) not loaded';
stamp = function(){ return `${RULESET.id} · CN 2026 · reference data: ${REFDATA_STATUS_V44}`; };

/* ---------- result status ---------- */
const RESULT_STATES = ['Draft estimate','Verified','Regulator / Registry confirmed'];
function resultChip(state, why){
  const cls = state==='Draft estimate' ? 't-amber' : state==='Verified' ? 't-teal' : 't-blue';
  return `<span class="tag ${cls}" title="${esc(why||'')}">${state}</span>`;
}
function domResultState(){ return S.dom.notif.status!=='Final' || PLATFORM.monthsFY<12 ? 'Draft estimate' : (S.dom.ver.icmRef ? 'Regulator / Registry confirmed' : 'Verified'); }
function cbamResultState(){ return /NOT loaded/.test(REFDATA_STATUS_V44) || !S.cbam.ver.vr ? 'Draft estimate' : (S.reg.state==='Registered' ? 'Regulator / Registry confirmed' : 'Verified'); }

/* ---------- entity notification record ---------- */
S.dom.notif = {
  status:'Draft',                                   /* Draft → Final (gazetted) */
  entityId:'CCTS obligated entity ID — from the schedule (demo: IS-0xx)',
  instrument:'GHG Emission Intensity Target Rules, 2025 — revised draft notification for iron & steel, 26 Jun 2026',
  baselineYear:'FY2023-24', baselineGEI:2.51,
  years:'FY2026-27 (FY2025-26 left blank in the draft)', targets:{'FY2026-27':2.33},
  eqProduct:'Tonnes of equivalent product, as worked out in the notified schedule',
  forms:'Form 1 (monitoring plan) within 3 months of the start of the year; Form A + ACVA’s Form B within 3 months of its end',
  pat:'PAT Cycle VII (FY2022-23 to FY2024-25) — completed. No later cycle notified for this DC in the demo.'
};
function notifHTML(){
  const n=S.dom.notif, f=flags();
  return `<div class="card">
    <div class="row" style="justify-content:space-between"><h2>0 · Your notification record</h2>${n.status==='Final'?'<span class="tag t-teal">Gazetted</span>':'<span class="tag t-amber">Draft notification</span>'}</div>
    <p class="sub">Applicability, target, baseline and the product basis come from the notification that names this plant — not from its industry. The industry template below only suggests which units to look at.</p>
    <table class="t"><tbody>
      ${f.ccts?`<tr><td style="width:220px">CCTS obligated entity</td><td>${esc(n.entityId)}</td></tr>
      <tr><td>Instrument</td><td>${esc(n.instrument)}</td></tr>
      <tr><td>Baseline</td><td>${n.baselineYear} · GEI ${fmt(n.baselineGEI,3)} tCO₂e/t ${PB.ref()}</td></tr>
      <tr><td>Compliance years and targets</td><td>${esc(n.years)} — ${Object.entries(n.targets).map(([y,v])=>`${y}: ${fmt(v,3)}`).join(' · ')} ${PB.ref()}</td></tr>
      <tr><td>Equivalent product</td><td>${esc(n.eqProduct)}</td></tr>
      <tr><td>Forms and timelines</td><td>${esc(n.forms)}</td></tr>`:''}
      ${f.pat?`<tr><td style="width:220px">PAT</td><td>${esc(n.pat)}</td></tr>`:''}
    </tbody></table>
    <div class="row mt"><label class="small">Notification status <select class="fi" style="width:auto;display:inline-block" onchange="S.dom.notif.status=this.value;render()"><option ${n.status==='Draft'?'selected':''}>Draft</option><option ${n.status==='Final'?'selected':''}>Final</option></select></label>
      <span class="small muted">In production this record loads from the official schedule. While it is draft, every domestic result is labelled a draft estimate.</span></div>
    ${f.pat && /completed/.test(n.pat)?`<div class="note n-warn"><span class="i">!</span><div><b>PAT for FY2026-27:</b> your last notified cycle has ended. PAT figures for this year are only meaningful if BEE notifies a new cycle for this DC. The PAT calculations are kept for comparison.</div></div>`:''}
  </div>`;
}

/* ---------- CCTS boundary rules from the procedure ---------- */
const CCTS_RULES = [
  ['Included','Direct emissions from fuel combustion; process emissions; emissions from electricity and heat imported into the plant','§3.4(1)'],
  ['Excluded','Energy consumed in the colony attached to the plant','§3.4(3)(iv)'],
  ['Excluded','Temporary or major construction work','§3.4(3)(iv)'],
  ['Excluded','Outside transportation','§3.4(3)(iv)'],
  ['Excluded','Refrigerant leakages in office buildings and processes','§3.4(3)(v)'],
  ['Excluded, reported separately','GHG emissions from biomass or biogenic energy sources','§3.4(3)(i), §4(4)(v)'],
  ['Subtracted','Emissions from producing energy exported out of the plant boundary (captive, cogeneration, waste heat)','§3.4(3)(vii), §4(11)'],
  ['Zero emission, with evidence','Renewable energy used on site or procured; Renewable Energy Certificates do not count','§4(12)'],
  ['Grid factor','Latest CEA average grid emission factor; supplier-specific only under a dedicated PPA verified independently','§4(4)(vii)'],
  ['Denominator','Main product, or equivalent product worked out from the product mix per standard practice — as fixed in your notification','§3.4(4)']
];
function cctsRulesHTML(){
  return `<details class="help"><summary>CCTS boundary rules — what the BEE procedure includes and excludes</summary><div class="hb">
    <table class="t"><tbody>${CCTS_RULES.map(r=>`<tr><td style="width:170px"><b>${r[0]}</b></td><td>${r[1]}</td><td class="small muted" style="width:150px">${r[2]}</td></tr>`).join('')}</tbody></table>
    <p class="src mt">BEE, Detailed Procedure for Compliance Mechanism under CCTS, version 1.0 (July 2024). If BEE issues a later version, TerraCAP updates this table and records the change.</p></div></details>`;
}

/* recommendation: CCTS non-process units follow §3.4(3) */
const _recommendV43 = recommend;
recommend = function(a, ans){
  const out=_recommendV43(a, ans);
  if(out.ccts && ans.fence && ans.metered && ans.process===false){
    out.ccts = ans.sub
      ? {d:'out', t:'Colony, construction and outside transport are excluded under the CCTS procedure (§3.4(3)(iv)). Subtract it using the sub-meter readings and keep them as evidence.'}
      : {d:'in', t:'Excluded under the CCTS procedure (§3.4(3)(iv)), but without a sub-meter or a verifiable estimate you can’t subtract it. Until you have one, it stays in your metered total and the verifier will note it.'};
  }
  return out;
};
/* tips that quoted the old CCTS shortcut */
[STEEL_ASSETS.find(a=>a.id==='a8')].concat(...Object.values(SECTOR_ARCH).map(s=>s.units||[])).forEach(u=>{
  if(u && /colony|Township|township/i.test(u.name)) u.tip='PAT normalises it out. CCTS excludes colony energy (Procedure §3.4(3)(iv)) — subtract it with a sub-meter or verifiable estimate.';
});

/* ---------- overrides ---------- */
const _sBoundaryV43 = sBoundary;
sBoundary = function(){
  let h=_sBoundaryV43();
  h=h.replace('<div class="card">\n    <h2>1 · The obligated unit</h2>', notifHTML()+'\n  <div class="card">\n    <h2>1 · The obligated unit</h2>');
  h=h.replace('<div class="dt-row h">', (flags().ccts?cctsRulesHTML():'')+'<div class="dt-row h">');
  return h;
};
const _sCalcV43 = sCalc;
sCalc = function(){
  S.dom.target.ccts = S.dom.notif.targets['FY2026-27'];
  S.dom.target.cctsStatus = S.dom.notif.status==='Final' ? 'gazetted' : 'draft';
  const st=domResultState();
  let h=_sCalcV43();
  h=h.replace('<h1>Calculation & position</h1>', `<h1>Calculation & position</h1><div class="row" style="margin:-2px 0 10px">${resultChip(st, 'Draft while the notification is draft or months are projected')}<span class="small muted">Results move to “Verified” after the ACVA’s Form B, and to “Regulator confirmed” once BEE accepts the filing.</span></div>`);
  /* procedure lines the platform must show even when zero */
  h=h.replace('<p class="small muted mt">Captive power plant fuel is already in Scope 1, so its electricity is not counted again in Scope 2.</p>',
    `<p class="small muted mt">Captive power plant fuel is already in Scope 1, so its electricity is not counted again in Scope 2. Electricity exported to the grid: 0 MWh this year (would be subtracted, §4(11)). Biomass emissions: 0 tCO₂ (would be reported separately, not counted, §4(4)(v)). Colony energy: excluded via sub-meter (§3.4(3)(iv)).</p>`);
  return h;
};
const _sFAV43 = sFA;
sFA = function(){ return _sFAV43().replace('<h1>Free allocation & carbon price</h1>', `<h1>Free allocation & carbon price</h1><div class="row" style="margin:-2px 0 10px">${resultChip(cbamResultState(),'Draft until benchmarks and defaults are loaded and validated, and the year is verified')}<span class="small muted">Estimates stay inside TerraCAP until reference data is validated and the year is verified.</span></div>`); };
const _sSEEV43 = sSEE;
sSEE = function(){ return _sSEEV43().replace('<h1>Embedded emissions</h1>', `<h1>Embedded emissions</h1><div class="row" style="margin:-2px 0 10px">${resultChip(cbamResultState())}</div>`); };

/* customer packages carry the result status in their header (part7 custPackage) — no final issue while draft */

Object.assign(SCREENS, {d_boundary:sBoundary, d_calc:sCalc, c_fa:sFA, c_see:sSEE});
render();

</script>
</body></html>
