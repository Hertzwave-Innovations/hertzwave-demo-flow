function wsLimit(kind, s) {
    s = s || wsGetSettings();

// ── Ledger: generation and disposal side by side, with live pending tracking ─────────────────
function wsLogFor(id) {
    var log = wsGetLog();
    if (!log[id]) log[id] = { open: { q: '', u: '', d: '' }, rows: [{ gq: '', gu: '', gd: '', dq: '', du: '', dd: '', ref: '' }] };
    return log[id];
}
function wsNum(v) { var n = parseFloat(v); return isNaN(n) ? 0 : n; }
function wsDays(dateStr, today) {
    var t = Date.parse(dateStr);
    if (isNaN(t)) return null;
    return Math.floor((today - t) / 86400000);
}

// FIFO ageing: disposals consume the oldest generation lots first; whatever remains is pending
function wsPending(kind, it, s) {
    s = s || wsGetSettings();
    var cfg = wsItemCfg(kind, it, s), R = cfg.unit, L = wsLimit(kind, s), rec = wsLogFor(it.id);
    var lots = [], disposed = 0, problems = [], missingDate = false;
    var oq = wsNum(rec.open.q);
    if (oq > 0) {
        var c0 = wsConv(oq, rec.open.u || R, R);
        if (c0 == null) problems.push('opening stock unit not convertible to ' + R);
        else { lots.push({ q: c0, d: rec.open.d }); if (!rec.open.d) missingDate = true; }
    }
    rec.rows.forEach(function(r) {
        var g = wsNum(r.gq), d = wsNum(r.dq);
        if (g > 0) {
            var cg = wsConv(g, r.gu || R, R);
            if (cg == null) problems.push('generation unit ' + (r.gu || R) + ' not convertible to ' + R);
            else { lots.push({ q: cg, d: r.gd }); if (!r.gd) missingDate = true; }
        }
        if (d > 0) {
            var cd = wsConv(d, r.du || R, R);
            if (cd == null) problems.push('disposal unit ' + (r.du || R) + ' not convertible to ' + R);
            else disposed += cd;
        }
    });
    lots.sort(function(a, b) { return (Date.parse(a.d) || 0) - (Date.parse(b.d) || 0); });
    var gen = lots.reduce(function(a, l) { return a + l.q; }, 0);
    var left = disposed, oldest = null;
    for (var i = 0; i < lots.length; i++) {
        var take = Math.min(left, lots[i].q);
        lots[i].rem = lots[i].q - take;
        left -= take;
        if (lots[i].rem > 1e-9 && oldest === null) oldest = lots[i].d;
    }
    var pending = Math.max(gen - disposed, 0);
    var age = oldest ? wsDays(oldest, Date.now()) : null;
    var status = 'none';
    if (problems.length) status = 'err';
    else if (gen === 0 && disposed === 0) status = 'none';
    else if (disposed - gen > 1e-9) status = 'over';
    else if (pending <= 1e-9) status = 'clear';
    else if (L.days == null) status = 'ok';
    else if (age === null) status = 'nodate';
    else if (age > L.days) status = 'red';
    else if (age > L.days * 0.75) status = 'amber';
    else status = 'ok';
    return { unit: R, gen: gen, disposed: disposed, pending: pending, oldest: oldest, age: age, limit: L, status: status, problems: problems, missingDate: missingDate };
}

function wsFmt(n) { return (Math.round(n * 1000) / 1000).toLocaleString('en-IN', { maximumFractionDigits: 3 }); }

function wsPendHTML(kind, it, s) {
    var p = wsPending(kind, it, s), L = p.limit;
    var limTxt = L.days == null ? 'no time limit' : (kind === 'bmw' && L.days <= 2 ? '48-hour limit' : L.days + '-day ' + (L.stat ? 'statutory' : 'internal') + ' limit');
    var msg = {
        none: 'No entries yet', clear: '✓ All generated quantity disposed',
        ok: 'Pending ' + wsFmt(p.pending) + ' ' + p.unit + (p.age != null ? ' · oldest ' + p.age + ' days' : '') + ' · within ' + limTxt,
        amber: '⚠ Pending ' + wsFmt(p.pending) + ' ' + p.unit + ' · oldest ' + p.age + ' days — approaching ' + limTxt,
        red: '⛔ OVERDUE — ' + wsFmt(p.pending) + ' ' + p.unit + ' pending for ' + p.age + ' days, beyond the ' + limTxt,
        nodate: '⚠ Pending ' + wsFmt(p.pending) + ' ' + p.unit + ' — add generation dates to track the ' + limTxt,
        over: '⚠ Disposed (' + wsFmt(p.disposed) + ') exceeds generated + carried forward (' + wsFmt(p.gen) + ') — add the carried-forward stock',
        err: '⚠ ' + p.problems.join('; ')
    }[p.status];
    var todo = wsLogFor(it.id).rows.filter(function(r) { return wsDispatchState(r) === 'todo'; }).length;
    if (todo) msg += ' · 🚚 ' + todo + ' dispatch' + (todo > 1 ? 'es' : '') + ' missing manifest / transporter / vehicle';
    return '<div class="ws6-pend st-' + p.status + '"><span>' + msg + '</span><span class="ws6-pendnums">Generated ' + wsFmt(p.gen) +
        ' · Disposed ' + wsFmt(p.disposed) + ' · Pending ' + wsFmt(p.pending) + ' ' + p.unit + '</span></div>';
}

    var fac = cfg.fac !== '' && facs[cfg.fac] ? facs[cfg.fac] : null;
    var nm = wsDisplayName(kind, it, s);
    var mlabel = fw.manifest[kind] || 'Reference';
    var uo = function(sel) { return wsUnitOptions(R, sel || R); };
    var inp = function(r, f, v, type, ph) {
        return '<input class="ws6-cell" type="' + type + '" data-sid="' + sid + '" data-r="' + r + '" data-f="' + f + '" value="' + wsEsc(v) + '"' +
            (ph ? ' placeholder="' + ph + '"' : '') + (type === 'number' ? ' min="0" step="any"' : '') + ' oninput="wsLedgerInput(this)">';
    };
    var sel = function(r, f, v) {
        return '<select class="ws6-cell ws6-u" data-sid="' + sid + '" data-r="' + r + '" data-f="' + f + '" onchange="wsLedgerInput(this)">' + uo(v) + '</select>';
    };
    var pick = function(r, f, v, opts, blank) {
        return '<select class="ws6-cell" data-sid="' + sid + '" data-r="' + r + '" data-f="' + f + '" onchange="wsLedgerInput(this)">' +
            (blank ? '<option value="">' + blank + '</option>' : '') +
            opts.map(function(o) { var val = o[0], lab = o[1]; return '<option value="' + wsEsc(val) + '"' + (String(v) === String(val) ? ' selected' : '') + '>' + wsEsc(lab) + '</option>'; }).join('') + '</select>';
    };
    var rows = rec.rows.map(function(r, i) {
        var ds = wsDispatchState(r);
        var dBtn = '<button class="ws6-dbtn ds-' + ds + '" title="Dispatch & manifest details" onclick="wsToggleDispatch(\'' + sid + '\',' + i + ')">🚚' +
            (ds === 'todo' ? ' !' : (ds === 'done' ? ' ✓' : '')) + '</button>';
        var rfac = r.rfac !== undefined && r.rfac !== '' ? r.rfac : cfg.fac;
        var detail = '<tr class="ws6-disp" id="wsd-' + sid + '-' + i + '"' + (r.open ? '' : ' hidden') + '><td colspan="8"><div class="ws6-dgrid">' +
            '<div><div class="ws6-lbl">' + wsEsc(mlabel) + '</div>' + inp(i, 'ref', r.ref, 'text', 'e.g. MH/2026/000123') + '</div>' +
            '<div><div class="ws6-lbl">Transporter</div>' + pick(i, 'tr', r.tr, (s.trans || []).map(function(t, j) { return [j, t.name || ('Transporter ' + (j + 1))]; }), 'Select…') + '</div>' +
            '<div><div class="ws6-lbl">Vehicle registration no.</div>' + inp(i, 'veh', r.veh, 'text', 'e.g. KA01AB1234') + '</div>' +
            '<div><div class="ws6-lbl">Mode of transport</div>' + pick(i, 'mode', r.mode || 'Road', WS_MODES.map(function(m) { return [m, m]; })) + '</div>' +
            '<div><div class="ws6-lbl">Receiving facility</div>' + pick(i, 'rfac', rfac, facs.map(function(f, j) { return [j, f.name || ('Facility ' + (j + 1))]; }), 'Select…') + '</div>' +
            '<div><div class="ws6-lbl">No. of containers</div>' + inp(i, 'nc', r.nc, 'number', '0') + '</div>' +
            '<div><div class="ws6-lbl">Packaging</div>' + pick(i, 'pkg', r.pkg, WS_PACK.map(function(m) { return [m, m]; }), 'Select…') + '</div>' +
            '<div><div class="ws6-lbl">Physical form / consistency</div>' + pick(i, 'form', r.form, WS_FORMS.map(function(m) { return [m, m]; }), 'Select…') + '</div>' +
            '<div class="ws6-dwide"><div class="ws6-lbl">Special handling instructions</div>' + inp(i, 'sh', r.sh, 'text', 'optional') + '</div>' +
            '</div></td></tr>';
        return '<tr>' +
            '<td data-l="Generated">' + inp(i, 'gq', r.gq, 'number', '0') + '</td><td data-l="Unit">' + sel(i, 'gu', r.gu) + '</td><td data-l="Generation date">' + inp(i, 'gd', r.gd, 'date') + '</td>' +
            '<td class="ws6-sep" data-l="Disposed">' + inp(i, 'dq', r.dq, 'number', '0') + '</td><td data-l="Unit">' + sel(i, 'du', r.du) + '</td><td data-l="Disposal date">' + inp(i, 'dd', r.dd, 'date') + '</td>' +
            '<td data-l="Dispatch">' + dBtn + '</td>' +
            '<td>' + (rec.rows.length > 1 ? '<button class="ws6-x" title="Remove entry" onclick="wsLedgerRow(\'' + kind + '\',\'' + sid + '\',' + i + ')">✕</button>' : '') + '</td></tr>' + detail;
    }).join('');
    return '<div class="ws6-card" id="wsc-' + sid + '" data-kind="' + kind + '">' +
        '<div class="ws6-cardhd"><span class="ws6-code">' + wsEsc(it.code) + '</span><span class="ws6-cardname">' + wsEsc(nm.main) +
        (nm.sub ? ' <span class="ws6-regname">(' + wsEsc(nm.sub) + ')</span>' : '') + '</span>' +
        '<span class="ws6-cardmeta">Unit: ' + R + (fac ? ' · Sent to: ' + wsEsc(fac.name || 'facility') : '') + '</span></div>' +
        '<div class="ws6-open">Carried forward (undisposed stock at period start): ' + inp('open', 'q', rec.open.q, 'number', '0') +
        ' <select class="ws6-cell ws6-u" data-sid="' + sid + '" data-r="open" data-f="u" onchange="wsLedgerInput(this)">' + uo(rec.open.u) + '</select>' +
        ' generated on ' + inp('open', 'd', rec.open.d, 'date') + '</div>' +
        '<div class="ws6-tblwrap"><table class="ws6-ltbl"><thead><tr><th colspan="3" class="ws6-th-g">📥 Generated</th><th colspan="4" class="ws6-th-d">📤 Disposed / handed over</th><th></th></tr>' +
        '<tr><th>Quantity</th><th>Unit</th><th>Date</th><th class="ws6-sep">Quantity</th><th>Unit</th><th>Date</th><th>Dispatch</th><th></th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table></div>' +
        '<button class="ws6-add" onclick="wsLedgerRow(\'' + kind + '\',\'' + sid + '\',-1)">+ Add entry</button>' +
        '<div id="wsp-' + sid + '-pend">' + wsPendHTML(kind, it, s) + '</div></div>';
}
function wsToggleDispatch(sid, i) {
    var m = WS_SID_MAP[sid]; if (!m) return;
    var rec = wsLogFor(m.it.id); rec.rows[i].open = !rec.rows[i].open; wsSaveLog();
    var tr = document.getElementById('wsd-' + sid + '-' + i);
    if (tr) tr.hidden = !rec.rows[i].open;
}

var WS_SID_MAP = {};
function wsLedgerHTML(kind, s) {
    var items = wsActiveItems(kind, s);
    items.forEach(function(it) { WS_SID_MAP[wsSid(it.id)] = { kind: kind, it: it }; });
    if (!items.length) {
        return '<div class="ws6-empty">No ' + ({ hw: 'hazardous', nh: 'non-hazardous', ew: 'e-waste', bat: 'battery', bmw: 'bio-medical', cd: 'C&D' }[kind] || '') + ' items are configured for this facility. ' +
            'An admin selects them in <strong>⚙ Waste Settings</strong>.</div>';
    }
    return items.map(function(it) { return wsCardHTML(kind, it, s); }).join('') +
        '<div class="ws6-sum" id="wss-' + kind + '">' + wsSummaryHTML(kind, s) + '</div>';
}
function wsSummaryHTML(kind, s) {
    var items = wsActiveItems(kind, s), L = wsLimit(kind, s), red = 0, amber = 0;
    var rows = items.map(function(it) {
        var p = wsPending(kind, it, s);
        if (p.status === 'red') red++;
        if (p.status === 'amber' || p.status === 'nodate' || p.status === 'over' || p.status === 'err') amber++;
        var lbl = { none: '—', clear: 'Cleared', ok: 'Within limit', amber: 'Approaching', red: 'OVERDUE', nodate: 'Date missing', over: 'Check entries', err: 'Unit error' }[p.status];
        var nm = wsDisplayName(kind, it, s);
        return '<tr class="st-' + p.status + '"><td><span class="ws6-code">' + wsEsc(it.code) + '</span> ' + wsEsc(nm.main) + '</td><td>' + wsFmt(p.gen) + '</td><td>' + wsFmt(p.disposed) +
            '</td><td><strong>' + wsFmt(p.pending) + '</strong> ' + p.unit + '</td><td>' + (p.age == null || p.pending <= 1e-9 ? '—' : p.age + ' d') + '</td><td><span class="ws6-badge st-' + p.status + '">' + lbl + '</span></td></tr>';
    }).join('');
    var head = red ? '<div class="ws6-alert red">⛔ ' + red + ' item' + (red > 1 ? 's' : '') + ' held beyond the ' + (L.days == null ? '' : L.days + '-day ') + 'limit — arrange disposal and record the reason.</div>'
        : (amber ? '<div class="ws6-alert amber">⚠ ' + amber + ' item' + (amber > 1 ? 's need' : ' needs') + ' attention.</div>' : '<div class="ws6-alert ok">✓ No overdue stock.</div>');
    return '<div class="ws6-h">⏱ Pending / accumulated stock</div>' + head +
        '<div class="ws6-tblwrap"><table class="ws6-stbl"><thead><tr><th>Item</th><th>Generated</th><th>Disposed</th><th>Pending</th><th>Oldest</th><th>Status</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '<p class="ws6-p">Limit basis: ' + wsEsc(L.basis) + '. Ageing is first-in-first-out: disposals clear the oldest stock first.</p>';
}
function wsLedgerInput(el) {
    var sid = el.getAttribute('data-sid'), m = WS_SID_MAP[sid];
    if (!m) return;
    var rec = wsLogFor(m.it.id), r = el.getAttribute('data-r'), f = el.getAttribute('data-f');
    if (r === 'open') rec.open[f] = el.value; else rec.rows[parseInt(r, 10)][f] = el.value;
    wsSaveLog();
    if (r !== 'open') {
        var card = document.getElementById('wsc-' + sid);
        var btn = card && card.querySelectorAll('.ws6-dbtn')[parseInt(r, 10)];
        if (btn) { var ds = wsDispatchState(rec.rows[parseInt(r, 10)]); btn.className = 'ws6-dbtn ds-' + ds; btn.textContent = '🚚' + (ds === 'todo' ? ' !' : (ds === 'done' ? ' ✓' : '')); }
    }
    var s = wsGetSettings();
    var pend = document.getElementById('wsp-' + sid + '-pend');
    if (pend) pend.innerHTML = wsPendHTML(m.kind, m.it, s);
    var sum = document.getElementById('wss-' + m.kind);
    if (sum) sum.innerHTML = wsSummaryHTML(m.kind, s);
}
function wsLedgerRow(kind, sid, idx) {
    var m = WS_SID_MAP[sid];
    if (!m) return;
    var rec = wsLogFor(m.it.id);
    if (idx < 0) rec.rows.push({ gq: '', gu: '', gd: '', dq: '', du: '', dd: '', ref: '' }); else rec.rows.splice(idx, 1);
    wsSaveLog();
    var card = document.getElementById('wsc-' + sid);
    var s = wsGetSettings();
    if (card) card.outerHTML = wsCardHTML(kind, m.it, s);
    var sum = document.getElementById('wss-' + kind);
    if (sum) sum.innerHTML = wsSummaryHTML(kind, s);
}

function wsLimitLine(kind, s) {
    var L = wsLimit(kind, s);
    if (L.days == null) return 'No time limit applies (' + wsEsc(L.basis) + ').';
    return (kind === 'bmw' && L.days <= 2 ? '48 hours' : L.days + ' days') + ' — ' + wsEsc(L.basis) + '.';
}

// ── WS.1 Hazardous ────────────────────────────────────────────────────────────────────────
function renderWS1(body) {
    var s = wsGetSettings(), fw = wsFw(s), key = s.framework;
    var who = key === 'CPCB'
        ? 'Facilities that generate waste listed in <strong>Schedule I</strong> of the HOWM Rules 2016 (or waste that crosses Schedule II limits) and hold an SPCB hazardous waste authorisation — manufacturing, chemicals, pharma, automotive, printing, ETP operators. <strong>Pure IT offices, retail and most service businesses do not need WS.1.</strong> Entries here are your Form 3 record and feed the Form 4 annual return (due 30 June).'
        : 'Facilities that produce waste classified as hazardous under ' + wsEsc(fw.name) + '. Offices without process waste usually only need Solid Waste and WS.2.';
    body.innerHTML = wsBanner('#dc2626', '#fef2f2', '⚠️ Who fills this form?', who) +
        '<div class="ws6-toprow"><div class="ws6-h">' + wsEsc(fw.hwTitle) + '</div>' + wsFwChip(s) + '</div>' +
        '<p class="ws6-p">Enter each generation and each disposal on the same line or on separate lines — the pending stock is worked out below. Storage limit: ' + wsLimitLine('hw', s) + '</p>' +
        wsLedgerHTML('hw', s);
}

// ── WS.2 Non-hazardous ───────────────────────────────────────────────────────────────────
function renderWS2(body) {
    var s = wsGetSettings(), fw = wsFw(s);
    body.innerHTML = wsBanner('#2563eb', '#eff6ff', '🗑️ Who fills this form?',
        'Any facility that generates commercial or industrial non-hazardous waste — paper and cardboard, plastic, metal scrap, glass, wood, process residues. ' +
        'IT companies, offices, warehouses and factories all use it. Household-type waste from canteens and washrooms goes in <strong>Solid Waste</strong>, not here.') +
        '<div class="ws6-toprow"><div class="ws6-h">' + wsEsc(fw.nhTitle) + '</div>' + wsFwChip(s) + '</div>' +
        '<p class="ws6-p">Pending threshold: ' + wsLimitLine('nh', s) + '</p>' +
        wsLedgerHTML('nh', s);
}

// ── Solid waste ──────────────────────────────────────────────────────────────────────────
function renderWSSW(body) {
    var s = wsGetSettings(), fw = wsFw(s), key = s.framework, log = wsGetLog();
    var who = key === 'CPCB'
        ? 'Every entity — offices, IT companies, hotels, hospitals, campuses and factories — must segregate solid waste into four streams under the <strong>SWM Rules 2026</strong> (in force from 1 April 2026). ' +
          'If you have no hazardous process waste, Solid Waste plus WS.2 may be all you need. ' +
          (s.bwg === 'yes' ? '<strong>This facility is marked as a Bulk Waste Generator</strong> — record how much was processed on-site and how much was handed over, because wet waste must be processed on-site or covered by an EBWGR certificate.'
                           : (s.bwg === 'no' ? 'This facility is not a Bulk Waste Generator — handover to the ULB is the main route; quantities are still needed for BRSR Principle 6.'
                                              : 'Set Bulk Waste Generator status in ⚙ Waste Settings — it decides which columns are mandatory.'))
        : 'Every workplace that generates everyday municipal-type waste. Used for GRI 306 and ' + wsEsc(fw.name) + ' separate-collection obligations.';
    var cards = fw.sw.map(function(st) {
        var id = s.framework + ':sw:' + st.code, r = log[id] || (log[id] = { gq: '', gu: 'kg', oq: '', hq: '', route: '', ref: '' });
        var f = function(name, ph, type) {
            return '<input class="ws6-cell" type="' + (type || 'number') + '" min="0" step="any" data-sw="' + wsEsc(id) + '" data-f="' + name + '" value="' + wsEsc(r[name]) +
                '" placeholder="' + (ph || '0') + '" oninput="wsSWInput(this)">';
        };
        return '<div class="ws-solid-card"><div class="ws-solid-card-hdr" style="background:' + st.color + ';">' + st.icon + ' ' + wsEsc(st.label) + '</div>' +
            '<div class="ws-solid-card-body"><p class="ws6-p">' + wsEsc(st.hint) + '</p>' +
            '<div class="ws6-swgrid"><div><div class="ws6-lbl">Generated</div>' + f('gq') + '</div>' +
            '<div><div class="ws6-lbl">Unit</div><select class="ws6-cell" data-sw="' + wsEsc(id) + '" data-f="gu" onchange="wsSWInput(this)">' +
            ['kg', 'MT'].map(function(u) { return '<option' + (r.gu === u ? ' selected' : '') + '>' + u + '</option>'; }).join('') + '</select></div>' +
            '<div><div class="ws6-lbl">Processed on-site</div>' + f('oq') + '</div>' +
            '<div><div class="ws6-lbl">Handed over</div>' + f('hq') + '</div>' +
            '<div><div class="ws6-lbl">Handed over to</div><select class="ws6-cell" data-sw="' + wsEsc(id) + '" data-f="route" onchange="wsSWInput(this)"><option value="">Select…</option>' +
            st.routes.map(function(o) { return '<option' + (r.route === o ? ' selected' : '') + '>' + wsEsc(o) + '</option>'; }).join('') + '</select></div>' +
            '<div><div class="ws6-lbl">Receipt / agency ref</div>' + f('ref', 'optional', 'text') + '</div></div>' +
            '<div id="swb-' + wsSid(id) + '">' + wsSWBalance(r) + '</div></div></div>';
    }).join('');
    body.innerHTML = wsBanner('#16a34a', '#f0fdf4', '🗂️ Who fills this form?', who) +
        '<div class="ws6-toprow"><div class="ws6-h">' + wsEsc(fw.swTitle) + '</div>' + wsFwChip(s) + '</div>' +
        '<p class="ws6-p">Solid waste has no storage-period clock — it is handed over daily. What matters is that every kilogram generated is accounted for as processed on-site or handed over.</p>' + cards;
    wsSaveLog();
}
function wsSWBalance(r) {
    var g = wsNum(r.gq), o = wsNum(r.oq), h = wsNum(r.hq), u = r.gu || 'kg';
    if (!g && !o && !h) return '<div class="ws6-pend st-none"><span>No entries yet</span></div>';
    var gap = g - o - h;
    if (Math.abs(gap) <= Math.max(0.05 * g, 1e-9)) return '<div class="ws6-pend st-clear"><span>✓ Fully accounted — ' + wsFmt(o) + ' on-site, ' + wsFmt(h) + ' handed over (' + u + ')</span></div>';
    if (gap < 0) return '<div class="ws6-pend st-over"><span>⚠ Processed + handed over exceeds generated by ' + wsFmt(-gap) + ' ' + u + ' — check entries</span></div>';
    return '<div class="ws6-pend st-amber"><span>⚠ ' + wsFmt(gap) + ' ' + u + ' unaccounted (' + Math.round(gap / g * 100) + '% of generated) — record where it went</span></div>';
}
function wsSWInput(el) {
    var id = el.getAttribute('data-sw'), log = wsGetLog();
    log[id] = log[id] || {};
    log[id][el.getAttribute('data-f')] = el.value;
    wsSaveLog();
    var b = document.getElementById('swb-' + wsSid(id));
    if (b) b.innerHTML = wsSWBalance(log[id]);
}

// ── WS.3 E-waste & special waste ─────────────────────────────────────────────────────────
function renderWS3(body) {
    var s = wsGetSettings(), fw = wsFw(s), key = s.framework;
    var tab = function(k, title, note) {
        return '<div class="ws6-toprow"><div class="ws6-h">' + wsEsc(title) + '</div>' + wsFwChip(s) + '</div><p class="ws6-p">' + note + ' Limit: ' + wsLimitLine(k, s) + '</p>' + wsLedgerHTML(k, s);
    };
    var ewNote = key === 'CPCB'
        ? 'Bulk consumers (≥1,000 EEE units in the FY) must hand e-waste only to a <strong>registered producer, refurbisher or recycler</strong>. The 2022 Rules removed the bulk-consumer annual return, so keep recycler receipts as evidence. Convert device counts to kg using average unit mass.'
        : 'Hand WEEE / e-waste only to authorised treatment facilities or compliance schemes and keep the receipt.';

    var batNote = key === 'CPCB'
        ? 'Portable cells from office devices in small numbers can go in Special Care Waste (Solid Waste). UPS, DG, vehicle, EV and bulk laptop batteries belong here and go only to registered recyclers / refurbishers.'
        : 'Record batteries by category and keep the recycler receipt.';
    var bmwNote = key === 'CPCB'
        ? 'Only for occupiers handling bio-medical waste. Hand over to the Common Bio-medical Waste Treatment Facility (CBWTF); untreated waste must not be held beyond 48 hours. Annual report in Form IV by 30 June.'
        : 'Only for facilities generating healthcare waste.';
    var cdNote = key === 'CPCB' ? 'Only when construction, renovation or demolition happens on site. Asbestos-containing debris is hazardous — record it in WS.1.' : 'Only when construction or demolition happens on site.';
    var tabs = [['ew', '💻 E-Waste', fw.ewTitle, ewNote], ['bat', '🔋 Battery', fw.batTitle, batNote],
                ['bmw', '🏥 ' + (key === 'CPCB' ? 'Bio-Medical' : 'Healthcare'), fw.bmwTitle, bmwNote], ['cd', '🏗️ C&D', fw.cdTitle, cdNote]]
        .filter(function(t) { return wsActiveItems(t[0], s).length > 0; });
    var banner = wsBanner('#7c3aed', '#faf5ff', '💻 Who fills this form?',
        '<strong>E-waste:</strong> any entity retiring IT, telecom or electrical equipment — especially IT companies, BPOs, banks and large offices. ' +
        '<strong>Battery:</strong> UPS / stand-by / forklift / fleet / EV battery replacement. <strong>Bio-medical:</strong> hospitals, clinics, labs, pharma QC, occupational health centres. ' +
        '<strong>C&D:</strong> construction, renovation or demolition on site. Only the streams and categories selected in ⚙ Waste Settings appear below.');
    if (!tabs.length) {
        body.innerHTML = banner + '<div class="ws6-empty">No e-waste, battery, bio-medical or C&D categories are configured for this facility. An admin selects them in <strong>⚙ Waste Settings</strong>.</div>';
        return;
    }
    body.innerHTML = banner +
        '<div class="ws-tab-bar">' + tabs.map(function(t, i) { return '<button class="ws-tab-btn' + (i ? '' : ' active') + '" onclick="wsShowTab(\'ws3\',\'' + t[0] + '\',this)">' + t[1] + '</button>'; }).join('') + '</div>' +
        tabs.map(function(t, i) { return '<div id="ws3-' + t[0] + '" class="ws-tab-panel' + (i ? '' : ' active') + '">' + tab(t[0], t[2], t[3]) + '</div>'; }).join('');
}

</script>
<script>
// ── v8 report builders ──
// ── WS.00 — Waste Reports & Returns (access-controlled) ─────────────────────────────────────
// Reports are generated from the ledger (single source of truth). Drafts are live; "Finalise"
// freezes a versioned, hashed snapshot into the repository, which auditors read and which is
// the only thing that can be distributed.

var WS_REPO = null;
var WS_ROLE = 'admin';            // demo role switch: admin | esg | auditor
var WS_RPT_CUR = null;            // report currently in preview

function wsRepo() {
    if (WS_REPO) return WS_REPO;
    try { var r = localStorage.getItem('WASTE_REPO_V7'); if (r) WS_REPO = JSON.parse(r); } catch (e) {}
    if (!WS_REPO) WS_REPO = [];
    return WS_REPO;
}
function wsRepoSave() { try { localStorage.setItem('WASTE_REPO_V7', JSON.stringify(WS_REPO)); } catch (e) {} }
function wsHash(str) { var h = 5381; for (var i = 0; i < str.length; i++) { h = ((h << 5) + h + str.charCodeAt(i)) >>> 0; } return ('00000000' + h.toString(16)).slice(-8).toUpperCase(); }

function wsPeriod() {
    var s = wsGetSettings();
    if (s.rptFrom && s.rptTo) return { from: s.rptFrom, to: s.rptTo, label: s.rptFrom + ' to ' + s.rptTo };
    var el = document.getElementById('selYear'), y = el ? parseInt(el.value, 10) : new Date().getFullYear();
    return { from: (y - 1) + '-04-01', to: y + '-03-31', label: 'FY ' + (y - 1) + '–' + String(y).slice(2) + ' (1 Apr ' + (y - 1) + ' – 31 Mar ' + y + ')' };
}
function wsIn(d, P) { return !!d && d >= P.from && d <= P.to; }

// Flatten every ledger entry of a kind into dated events in the item's reporting unit
function wsEvents(kind, s, P) {
    var out = [];
    wsActiveItems(kind, s).forEach(function(it) {
        var cfg = wsItemCfg(kind, it, s), rec = wsLogFor(it.id), nm = wsDisplayName(kind, it, s);
        rec.rows.forEach(function(r, i) {
            var g = wsNum(r.gq), d = wsNum(r.dq);
            if (g > 0 && (!P || wsIn(r.gd, P))) out.push({ type: 'gen', date: r.gd || '', it: it, nm: nm, unit: cfg.unit, q: wsConv(g, r.gu || cfg.unit, cfg.unit) || 0, r: r, i: i });
            if (d > 0 && (!P || wsIn(r.dd, P))) out.push({ type: 'disp', date: r.dd || '', it: it, nm: nm, unit: cfg.unit, q: wsConv(d, r.du || cfg.unit, cfg.unit) || 0, r: r, i: i, kind: kind });
        });
    });
    out.sort(function(a, b) { return (a.date || '').localeCompare(b.date || ''); });

    Object.keys(s.fac).forEach(function(fk) {

                wsItems(k, s).forEach(function(it) { var r = log[it.id]; if (r && r.rows) r.rows.forEach(function(x) { if (x.rfac !== undefined && x.rfac !== '') { var v = parseInt(x.rfac, 10); x.rfac = v === i ? '' : (v > i ? String(v - 1) : String(v)); } }); });
            });
        }
    });
    if (meta.trans) s.trans = (s.trans || []).filter(function(t) { return !t.sample; });
    s.sampleMeta = { fac: [], kgpc: [], trans: false };
    wsSaveSettings(s); wsSaveLog();
    wmCustody('sample data cleared', s.facility || 'site', n + ' entries removed').then(wmRender);
}
