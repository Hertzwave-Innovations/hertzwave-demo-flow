<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GreenCo readiness | TerraCAP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --ink:#13302A; --muted:#5A716B; --faint:#8AA09A; --line:#D5DFDB; --line-2:#E6EDEA;
  --bg:#EDF2F0; --card:#FFFFFF; --sunk:#F5F8F7;
  --green:#1D7456; --green-d:#155840; --claim:#9CCBB6; --green-soft:#E0F0E8;
  --ai:#4346A0; --ai-soft:#ECECF8; --amber:#935708; --amber-soft:#FBEFD8; --red:#A33131; --red-soft:#F8E2E2;
  --b-cert:#4F7596; --b-bron:#9A5A2F; --b-silv:#8B959A; --b-gold:#B48710; --b-plat:#2F6B70; --b-none:#C7D2CE;
  --r-s:5px; --r-m:9px; --r-l:14px;
  --font:'Manrope', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ink:#E4EEEA; --muted:#A3B8B1; --faint:#71877F; --line:#2E4540; --line-2:#253A35;
  --bg:#0F1D1A; --card:#162824; --sunk:#12221F; --green:#4DB38A; --green-d:#7CCBAA; --claim:#2F6A55; --green-soft:#1C3B31;
  --ai:#9EA1F0; --ai-soft:#23244A; --amber:#E0A450; --amber-soft:#3A2C14; --red:#E57B7B; --red-soft:#3D1F1F; --b-none:#34514A;
}}
:root[data-theme="dark"]{
  --ink:#E4EEEA; --muted:#A3B8B1; --faint:#71877F; --line:#2E4540; --line-2:#253A35;
  --bg:#0F1D1A; --card:#162824; --sunk:#12221F; --green:#4DB38A; --green-d:#7CCBAA; --claim:#2F6A55; --green-soft:#1C3B31;
  --ai:#9EA1F0; --ai-soft:#23244A; --amber:#E0A450; --amber-soft:#3A2C14; --red:#E57B7B; --red-soft:#3D1F1F; --b-none:#34514A;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.25}
h2{font-size:22px;font-weight:800;letter-spacing:-.01em}
h3{font-size:16px;font-weight:700}
h4{font-size:14px;font-weight:700}
p{margin:0}
a{color:var(--green)}
.muted{color:var(--muted)} .small{font-size:12.5px}
/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:150px}
.brand b{font-size:15px;font-weight:800;color:var(--green-d)}
.brand span{font-size:12px;color:var(--muted)}
.plantctx{flex:1;min-width:0}
.plantctx b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plantctx span{font-size:12px;color:var(--muted)}
.lens select{padding:6px 8px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--card)}
.lens label{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.pill{display:flex;align-items:baseline;gap:8px;padding:6px 12px;border-radius:var(--r-m);background:var(--sunk);border:1px solid var(--line)}
.pill b{font-size:18px;font-weight:800}
.pill .bn{font-weight:700;font-size:13px}
/* shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100% - 60px)}
.rail{border-right:1px solid var(--line);padding:16px 10px;background:var(--card);position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto}
.rail button{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:var(--r-m);cursor:pointer}
.rail button:hover{background:var(--sunk)}
.rail button.on{background:var(--green-soft)}
.rail .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:1.5px solid var(--line);color:var(--muted);background:var(--card)}
.rail button.on .n{border-color:var(--green);color:var(--green)}
.rail .n.ok,.rail button.on .n.ok{background:var(--green);border-color:var(--green);color:#fff}
.rail .n.plain{border:0;background:none;font-size:15px}
.rail .t b{display:block;font-weight:700;font-size:13.5px}
.rail .t span{font-size:11.5px;color:var(--muted)}
.rail hr{border:0;border-top:1px solid var(--line-2);margin:10px 6px}
main{padding:22px 26px 60px;min-width:0}
.sechead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.sechead p{color:var(--muted);max-width:70ch;margin-top:4px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:18px}
.panel+.panel{margin-top:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--green)}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
.btn.pri:hover{background:var(--green-d)}
.btn.ai{border-color:var(--ai);color:var(--ai)}
.btn.ai:hover{background:var(--ai-soft)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn[disabled]{opacity:.55;cursor:progress}
.btn.sm{padding:4px 9px;font-size:12px}
/* chips and tags */
.tag{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11.5px;font-weight:700;border:1px solid transparent;white-space:nowrap}
.k-computed{background:var(--green-soft);color:var(--green-d)}
.k-claimed{background:var(--sunk);color:var(--muted);border-color:var(--line)}
.k-prov{background:var(--amber-soft);color:var(--amber)}
.k-ai{background:var(--ai-soft);color:var(--ai)}
.k-bad{background:var(--red-soft);color:var(--red)}
.k-ok{background:var(--green);color:#fff}
.st-Planned{background:var(--sunk);color:var(--muted);border-color:var(--line)}
.st-In\ progress{background:var(--amber-soft);color:var(--amber)}
.st-Implemented{background:var(--green-soft);color:var(--green-d)}
.band-t{font-weight:800}
.bc-plat{color:var(--b-plat)} .bc-gold{color:var(--b-gold)} .bc-silv{color:var(--b-silv)} .bc-bron{color:var(--b-bron)} .bc-cert{color:var(--b-cert)} .bc-none{color:var(--muted)}
/* notices */
.note{padding:10px 14px;border-radius:var(--r-m);font-size:13px;border:1px solid var(--line);background:var(--sunk);color:var(--muted)}
.note.warn{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.note.bad{background:var(--red-soft);border-color:transparent;color:var(--red)}
.note.ai{background:var(--ai-soft);border-color:transparent;color:var(--ai)}
.note b{color:inherit}
.disclaim{font-size:12.5px;color:var(--muted);border-left:3px solid var(--amber);padding:6px 12px;background:var(--card);border-radius:0 var(--r-s) var(--r-s) 0;margin-bottom:16px}
/* hero + ladder */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:26px;align-items:start}
.hero .big{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.hero .big .num{font-size:64px;font-weight:800;letter-spacing:-.03em;line-height:1}
.hero .big .of{font-size:16px;color:var(--muted);font-weight:600}
.hero .big .bn{font-size:26px;font-weight:800}
.hero .cap{color:var(--muted);margin-top:4px}
.ladder{margin-top:22px;position:relative;padding-top:48px;padding-bottom:58px}
.ladder .track{display:flex;height:16px;border-radius:4px;overflow:hidden}
.ladder .seg{height:100%}
.ladder .blabels{position:relative;height:30px;margin-top:4px}
.ladder .blabels span{position:absolute;font-size:11px;line-height:1.25;color:var(--muted);white-space:nowrap;padding-left:3px;border-left:1px solid var(--line)}
.ladder .mk{position:absolute;top:48px;transform:translateX(-50%)}
.ladder .mk i{display:block;width:3px;height:16px;background:var(--ink)}
.ladder .mk em{position:absolute;left:50%;transform:translateX(-50%);bottom:20px;font-style:normal;font-size:11.5px;font-weight:800;white-space:nowrap;background:var(--card);padding:0 4px}
.ladder .mk.proj i{background:none;border-left:2px dashed var(--ai);width:0}
.ladder .mk.proj em{bottom:38px;color:var(--ai)}
.ladder .mk.comp i{background:var(--green-d);width:2px}
.ladder .mk.comp em{bottom:auto;top:56px;color:var(--green-d);font-weight:600}
.stats{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.stats div{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line-2)}
.stats div:last-child{border-bottom:0}
.stats b{font-weight:800}
/* parameter bars */
.pbars{display:grid;gap:10px}
.pbar{display:grid;grid-template-columns:minmax(150px,1.2fr) minmax(0,2fr) 92px;gap:14px;align-items:center;cursor:pointer;padding:4px 6px;border-radius:var(--r-s)}
.pbar:hover{background:var(--sunk)}
.pbar .nm{font-weight:600;font-size:13px}
.bar{position:relative;height:12px;background:var(--line-2);border-radius:3px;overflow:hidden;display:flex}
.bar .c{background:var(--green)} .bar .l{background:var(--claim);background-image:repeating-linear-gradient(135deg,transparent 0 3px,rgba(255,255,255,.35) 3px 5px)}
.bar .pj{position:absolute;top:-2px;bottom:-2px;border-left:2px dashed var(--ai)}
.pbar .v{text-align:right;font-weight:700;font-size:13px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle}
/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:700;color:var(--muted);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr.grp td{background:var(--sunk);font-weight:700;color:var(--ink);font-size:12.5px}
.scroll{overflow-x:auto}
.tbl input[type=number],.tbl input[type=text]{width:100%;min-width:92px;padding:5px 7px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--card);text-align:right}
.tbl input:focus{border-color:var(--green);outline:none}
.src{font-size:11px;color:var(--green-d);white-space:nowrap}
.used{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.used span{font-size:10.5px;padding:0 5px;border-radius:3px;background:var(--line-2);color:var(--muted)}
/* forms */
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px 16px}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--card)}
.fld textarea{min-height:66px;resize:vertical}
.fld .hint{font-size:11.5px;color:var(--faint);margin-top:3px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.chk input{margin-top:3px}
.vcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.vcard{border:1.5px solid var(--line);border-radius:var(--r-m);padding:12px;cursor:pointer;background:var(--card);text-align:left}
.vcard.on{border-color:var(--green);background:var(--green-soft)}
.vcard b{display:block;font-size:14px}
.vcard span{font-size:12px;color:var(--muted)}
/* assessment */
.two{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
.plist{position:sticky;top:80px;display:grid;gap:2px}
.plist button{display:grid;grid-template-columns:1fr auto;gap:6px;text-align:left;border:0;background:none;padding:8px 10px;border-radius:var(--r-s);cursor:pointer;font-size:13px}
.plist button:hover{background:var(--card)}
.plist button.on{background:var(--card);box-shadow:inset 3px 0 0 var(--green);font-weight:700}
.plist small{color:var(--muted);font-weight:600}
.credit{border:1px solid var(--line);border-radius:var(--r-m);padding:14px 16px;background:var(--card);margin-bottom:10px}
.credit .ch{display:flex;gap:10px;align-items:flex-start}
.credit .cid{font-weight:800;color:var(--green-d);min-width:58px;font-size:13px}
.credit h4{flex:1;font-weight:600}
.credit .pts{font-weight:800;white-space:nowrap}
.credit .pts small{color:var(--muted);font-weight:600}
.calc{display:flex;gap:18px;align-items:center;margin-top:10px;flex-wrap:wrap}
.calc .mv{min-width:110px}
.calc .mv b{font-size:20px;font-weight:800;display:block;line-height:1.1}
.calc .mv span{font-size:11.5px;color:var(--muted)}
.bchips{display:flex;flex-wrap:wrap;gap:5px}
.bchip{font-size:11.5px;padding:2px 7px;border-radius:var(--r-s);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.bchip b{color:var(--ink)}
.bchip.on{background:var(--green);border-color:var(--green);color:#fff}
.bchip.on b{color:#fff}
.bchip.nx{border-color:var(--ai);color:var(--ai);border-style:dashed}
.levels{display:flex;flex-wrap:wrap;gap:0;margin-top:10px;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden;width:fit-content;max-width:100%}
.levels button{border:0;border-right:1px solid var(--line);background:var(--card);padding:6px 10px;font-size:12px;cursor:pointer}
.levels button:last-child{border-right:0}
.levels button.on{background:var(--green);color:#fff;font-weight:700}
.cfoot{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line-2);font-size:12px;color:var(--muted)}
.cfoot a{cursor:pointer}
.gates{display:grid;gap:6px;margin-bottom:14px}
/* initiatives */
.ptabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.ptabs button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:5px 12px;cursor:pointer;font-size:12.5px;font-weight:600}
.ptabs button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.ptabs button small{opacity:.7;margin-left:4px}
.init{border:1px solid var(--line);border-radius:var(--r-m);background:var(--card);padding:14px 16px;margin-bottom:10px}
.init .ih{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.init .ih h4{flex:1;min-width:200px;font-size:15px}
.init .meta{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.init .meta b{color:var(--ink)}
.imps{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:4px}
.imps li{font-size:13px}
.imps li b{font-weight:700}
.eff{margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.eff .d{font-weight:800;font-size:15px}
.eff .d.pos{color:var(--green)} .eff .d.zero{color:var(--muted)}
.basis{font-size:12.5px;color:var(--muted);margin-top:8px}
.aicard{margin-top:12px;border:1px solid var(--ai);border-radius:var(--r-m);background:var(--ai-soft);padding:12px 14px;color:var(--ink)}
.aicard .ah{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.aicard .ah b{color:var(--ai)}
.aicard h5{margin:10px 0 4px;font-size:12px;color:var(--ai)}
.aicard ul{margin:0;padding-left:18px}
.aicard li{margin:2px 0;font-size:13px}
.verdict{font-weight:800;padding:2px 9px;border-radius:20px;font-size:12px;background:var(--card)}
.v-good{color:var(--green)} .v-mid{color:var(--amber)} .v-bad{color:var(--red)}
.goal .ok{color:var(--green);font-weight:700} .goal .short{color:var(--amber);font-weight:700} .goal .no{color:var(--red);font-weight:700}
.goal select{padding:3px 6px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--card);font-size:12.5px}
/* lists */
.mini{display:grid;gap:8px}
.mini .it{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13px;cursor:pointer}
.mini .it:last-child{border-bottom:0}
.mini .it b{color:var(--green-d)}
.mini .it .g{font-weight:800;white-space:nowrap}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,25,21,.45);z-index:50;display:grid;place-items:center;padding:20px}
.modal[hidden]{display:none}
.mbox{background:var(--card);border-radius:var(--r-l);max-width:760px;width:100%;max-height:calc(100vh - 40px);overflow:auto;padding:20px 22px;border:1px solid var(--line)}
.mbox h3{margin-bottom:14px}
.improw{display:grid;grid-template-columns:minmax(0,2fr) 130px minmax(0,1fr) 34px;gap:8px;align-items:center;margin-bottom:6px}
.improw select,.improw input{padding:7px 8px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--card);width:100%}
.improw .cur{font-size:11.5px;color:var(--muted)}
.mfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.lv{text-align:right;padding:5px 8px;background:var(--green-soft);color:var(--green-d);border-radius:var(--r-s);font-weight:700;min-width:92px}
.tbl input.gapin{border-color:var(--amber);background:var(--amber-soft)}
.linkbtn{border:0;background:none;color:var(--green);cursor:pointer;padding:0;font-size:12px;text-decoration:underline;font-weight:600}
.ledgerbar{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.lstat b{display:block;font-size:24px;font-weight:800;line-height:1.1}
.lstat span{font-size:12px;color:var(--muted)}
.aimode{font-size:11.5px;color:var(--muted);margin-top:4px;text-align:right}
/* evidence */
.evrow{display:grid;grid-template-columns:64px minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-2);align-items:start;font-size:13px}
.evrow .files{display:flex;flex-direction:column;gap:3px}
.evrow .files span{font-size:12px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.evhead{display:grid;grid-template-columns:64px minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:12px;font-size:12px;font-weight:700;color:var(--muted);padding-bottom:6px;border-bottom:1px solid var(--line)}
@media (max-width:980px){.evhead{display:none}}
.evrow .files button{border:0;background:none;color:var(--red);cursor:pointer;font-size:12px;padding:0}
/* pack */
.doc{background:#fff;color:#1a2a26;border:1px solid var(--line);border-radius:var(--r-m);padding:34px 40px;max-width:1000px}
.doc h1{font-size:26px;margin-bottom:4px}
.doc h2{font-size:17px;margin:26px 0 8px;padding-bottom:4px;border-bottom:2px solid #1D7456}
.doc .tbl th{color:#4d625c} .doc .tbl td{border-color:#e3e9e7}
.doc .dis{border:1px solid #d9a441;background:#fdf6e7;padding:10px 14px;border-radius:6px;font-size:12.5px;margin:14px 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:9px 16px;border-radius:var(--r-m);font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.toast.show{opacity:1}
.chartbox{position:relative;height:260px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
@media (max-width: 980px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;display:flex;overflow-x:auto;gap:4px;padding:8px;border-right:0;border-bottom:1px solid var(--line)}
  .rail button{width:auto;min-width:150px}
  .rail hr{display:none}
  .hero,.grid2,.grid3,.two,.vcards{grid-template-columns:1fr}
  .plist{position:static;display:flex;overflow-x:auto}
  .plist button{min-width:150px}
  .top{flex-wrap:wrap}
  .hero .big .num{font-size:48px}
  main{padding:16px 14px 50px}
  .evrow{grid-template-columns:1fr}
  .pbar{grid-template-columns:1fr 80px}
  .pbar .bar{grid-column:1 / -1;order:3}
}
@media print{
  .top,.rail,.noprint,.disclaim{display:none!important}
  .shell{display:block} main{padding:0} body{background:#fff}
  .doc{border:0;padding:0;max-width:none}
}

<script>
/* ==========================================================================
   GreenCo readiness engine — TerraCAP
   Pure functions: no DOM. Deterministic scoring; AI never touches scores.
   Source basis: CII GreenCo Rating System V3 Abridged Reference Guide (June 2018)
   for credit-level rules; CII GreenCo Annual Report 2024-25 for V4 and Lite
   parameter weights. V4/Lite credit-level criteria are not public: V4/Lite
   scores are a provisional projection of V3 credit results (see v4Of()).
   ========================================================================== */
'use strict';
const GC = (() => {

const LEVELS = [
  { v: 0,    label: 'Not started' },
  { v: 0.25, label: 'Initiated' },
  { v: 0.5,  label: 'Partly in place' },
  { v: 0.75, label: 'Largely in place' },
  { v: 1,    label: 'Fully evidenced' }
];

const BANDS = [
  { min: 750, name: 'Platinum',  cls: 'plat' },
  { min: 650, name: 'Gold',      cls: 'gold' },
  { min: 550, name: 'Silver',    cls: 'silv' },
  { min: 450, name: 'Bronze',    cls: 'bron' },
  { min: 350, name: 'Certified', cls: 'cert' }
];
function bandOf(s) { for (const b of BANDS) if (s >= b.min) return b; return { min: 0, name: 'Below Certified', cls: 'none' }; }
function nextBand(s) { const asc = [...BANDS].reverse(); for (const b of asc) if (s < b.min) return b; return null; }

/* Sector classification. ee = EE4 category (1-4), re = RE category (1-4),
   ghg = 'int' | 'non'. null = sector not listed in that V3 table. */
const SECTORS = {
  'Automobile':            { seg: 'mfg', ee: 1, re: 1, ghg: 'non' },
  'Engineering':           { seg: 'mfg', ee: 1, re: 1, ghg: 'non' },
  'Foundry':               { seg: 'mfg', ee: 1, re: null, ghg: null },
  'FMCG':                  { seg: 'mfg', ee: 1, re: null, ghg: 'non' },
  'Food processing':       { seg: 'mfg', ee: null, re: 1, ghg: null },
  'Textile':               { seg: 'mfg', ee: 1, re: null, ghg: 'non' },
  'Chemical':              { seg: 'mfg', ee: 2, re: 2, ghg: 'int' },
  'Pharmaceutical':        { seg: 'mfg', ee: 2, re: 2, ghg: 'non' },
  'Pulp & Paper':          { seg: 'mfg', ee: 2, re: 2, ghg: 'int' },
  'Petrochemical':         { seg: 'mfg', ee: 2, re: 2, ghg: 'int' },
  'Glass':                 { seg: 'mfg', ee: 2, re: null, ghg: null },
  'Tyre':                  { seg: 'mfg', ee: 2, re: 2, ghg: null },
  'Non-ferrous metals':    { seg: 'mfg', ee: 2, re: 2, ghg: 'int' },
  'Cement':                { seg: 'mfg', ee: 3, re: 3, ghg: 'int' },
  'Iron & steel':          { seg: 'mfg', ee: 3, re: 3, ghg: 'int' },
  'Chlor-alkali':          { seg: 'mfg', ee: 3, re: null, ghg: null },
  'Aluminium':             { seg: 'mfg', ee: 4, re: 3, ghg: 'int' },
  'Fertilizer':            { seg: 'mfg', ee: 4, re: 4, ghg: 'int' },
  'Refinery':              { seg: 'mfg', ee: 4, re: 4, ghg: 'int' },
  'IT & ITeS':             { seg: 'svc', ee: 1, re: 1, ghg: 'non' },
  'Hotels':                { seg: 'svc', ee: 1, re: null, ghg: 'non' },
  'Logistics':             { seg: 'svc', ee: 1, re: null, ghg: null },
  'Airports':              { seg: 'svc', ee: 1, re: null, ghg: null },
  'Ports':                 { seg: 'svc', ee: 1, re: null, ghg: null }
};
const EE_STEP = { 1: 2.5, 2: 1, 3: 0.5, 4: 0.25 };
const RE_EXP  = { 1: 90, 2: 70, 3: 50, 4: 30 };

function classify(prof) {
  const s = SECTORS[prof.sector] || { seg: 'mfg' };
  const pick = (ov, auto, dflt) => {
    if (ov && ov !== 'auto') return { v: isNaN(+ov) ? ov : +ov, src: 'override' };
    if (auto != null) return { v: auto, src: 'guide' };
    return { v: dflt, src: 'default' };
  };
  return { seg: s.seg, ee: pick(prof.eeCatOv, s.ee, 1), re: pick(prof.reCatOv, s.re, 1), ghg: pick(prof.ghgOv, s.ghg, 'non') };
}

/* ---------- Parameters ---------- */
const P3 = [
  { id: 'EE',    name: 'Energy Efficiency', max: 150 },
  { id: 'WC',    name: 'Water Conservation', max: 100 },
  { id: 'RE',    name: 'Renewable Energy', max: 100 },
  { id: 'GHG',   name: 'GHG Emission Reduction', max: 100 },
  { id: 'WM',    name: 'Waste Management', max: 100 },
  { id: 'MCR',   name: 'Material Conservation, Recycling & Recyclability', max: 100 },
  { id: 'GSC',   name: 'Green Supply Chain', max: 100 },
  { id: 'PSLCA', name: 'Product Stewardship & Life Cycle Aspects', max: 125 },
  { id: 'IE',    name: 'Innovation for Environment', max: 50 },
  { id: 'GI',    name: 'Green Infrastructure & Ecology', max: 75 }
];
const P4 = [
  { id: 'MS',  name: 'Management Systems', w: 75,  lite: 50 },
  { id: 'EM',  name: 'Energy Management', w: 150, lite: 125 },
  { id: 'CM',  name: 'Carbon Management', w: 150, lite: 100 },
  { id: 'WA',  name: 'Water Management', w: 125, lite: 100 },
  { id: 'MRM', name: 'Material Resource Management', w: 125, lite: 100 },
  { id: 'GS4', name: 'Green Supply Chain', w: 100, lite: 50 },
  { id: 'PS4', name: 'Product Stewardship & Life Cycle Approach', w: 125, lite: 75 },
  { id: 'IE4', name: 'Innovation for Environment', w: 50, lite: 50 },
  { id: 'GBE', name: 'Green Built Environment & Others', w: 100, lite: 50 }
];
/* PROVISIONAL mapping of V3 credits into V4 parameters. Not CII criteria. */
function v4Of(id) {
  const m = id.match(/^([A-Z]+)(\d+)?/); const p = m[1]; const n = m[2] ? +m[2] : 0;
  if (p === 'EE')    return n <= 2 ? 'MS' : 'EM';
  if (p === 'WC')    return n <= 2 ? 'MS' : 'WA';
  if (p === 'RE')    return n === 1 ? 'MS' : n === 2 ? 'EM' : 'CM';
  if (p === 'GHG')   return n <= 3 ? 'MS' : 'CM';
  if (p === 'WM')    return n <= 3 ? 'MS' : 'MRM';
  if (p === 'MCR')   return n <= 3 ? 'MS' : 'MRM';
  if (p === 'GSC')   return n <= 3 ? 'MS' : 'GS4';
  if (p === 'PSLCA') return 'PS4';
  if (p === 'IE')    return 'IE4';
  return 'GBE';
}

const VERSIONS = {
  V3:   { id: 'V3', name: 'GreenCo V3', sub: 'June 2018 guide, credit-level', basis: 'Credit rules from the CII V3 reference guide.', provisional: false },
  V4:   { id: 'V4', name: 'GreenCo V4', sub: '2023, parameter weights only', basis: 'CII has published V4 parameter weights, not credits. Scores project V3 credit results onto V4 weights through a provisional mapping.', provisional: true },
  LITE: { id: 'LITE', name: 'GreenCo Lite', sub: '700 points, scaled to 1000', basis: 'CII has published Lite parameter weights, not credits. Scores use the same provisional mapping, scaled from 700 to 1000.', provisional: true }
};

/* ---------- Plant data fields ---------- */
/* yrs: 3 = baseline / middle / current year; 1 = current value only.
   ledger: true = auto-filled from the TerraCAP activity ledger in production. */
const FIELDS = [
  { k: 'prod', g: 'Production', label: 'Production output', unit: 't', yrs: 3, ledger: true, used: 'EE4 WC4.1 GHG4 GHG6.2 WM4.1 MCR4.1 MCR5 MCR6.1' },
  { k: 'elec', g: 'Energy', label: 'Electricity consumed (all sources)', unit: 'kWh', yrs: 3, ledger: true, used: 'EE4 RE2 RE3 GHG4' },
  { k: 'thermal', g: 'Energy', label: 'Fuel energy (thermal)', unit: 'GJ', yrs: 3, ledger: true, used: 'EE4 RE2 RE3 GHG4' },
  { k: 'onsiteRE', g: 'Energy', label: 'On-site renewable electricity', unit: 'kWh', yrs: 3, ledger: true, used: 'RE2 RE3 GHG4' },
  { k: 'onsiteTh', g: 'Energy', label: 'On-site renewable thermal', unit: 'GJ', yrs: 3, ledger: true, used: 'RE2' },
  { k: 'offsiteRE', g: 'Energy', label: 'Off-site renewable electricity (PPA, open access, captive)', unit: 'kWh', yrs: 3, ledger: true, used: 'RE3 GHG4' },
  { k: 'scope1', g: 'Emissions', label: 'Scope 1 emissions (GHG inventory)', unit: 'tCO2e', yrs: 3, ledger: true, used: 'GHG4 GHG5' },
  { k: 'scope2', g: 'Emissions', label: 'Scope 2 emissions, location-based (GHG inventory)', unit: 'tCO2e', yrs: 3, ledger: true, used: 'GHG4 GHG5' },
  { k: 'scope3', g: 'Emissions', label: 'Scope 3 within the GreenCo boundary (categories 4, 5, 6, 7, 9)', unit: 'tCO2e', yrs: 3, ledger: true, used: 'GHG5 GHG6.2' },
  { k: 'offsets', g: 'Emissions', label: 'Offsets and sequestration', unit: 'tCO2e', yrs: 1, used: 'GHG5' },
  { k: 's3c1', ledger: true, g: 'Emissions', label: 'Scope 3 inventoried: material logistics', unit: 'yes/no', yrs: 1, bool: true, used: 'GHG6.1' },
  { k: 's3c2', ledger: true, g: 'Emissions', label: 'Scope 3 inventoried: business travel', unit: 'yes/no', yrs: 1, bool: true, used: 'GHG6.1' },
  { k: 's3c3', ledger: true, g: 'Emissions', label: 'Scope 3 inventoried: waste disposal', unit: 'yes/no', yrs: 1, bool: true, used: 'GHG6.1' },
  { k: 's3c4', ledger: true, g: 'Emissions', label: 'Scope 3 inventoried: employee commute', unit: 'yes/no', yrs: 1, bool: true, used: 'GHG6.1' },
  { k: 'fwProc', g: 'Water', label: 'Fresh water, process', unit: 'm³', yrs: 3, ledger: true, used: 'WC4.1 WC6' },
  { k: 'fwDom', g: 'Water', label: 'Fresh water, domestic', unit: 'm³', yrs: 3, ledger: true, used: 'WC4.1 WC6' },
  { k: 'rwhPot', g: 'Water', label: 'Rainwater harvesting potential', unit: 'm³', yrs: 1, used: 'WC5.1' },
  { k: 'rwhCap', g: 'Water', label: 'Rainwater actually captured', unit: 'm³', yrs: 1, used: 'WC5.1' },
  { k: 'rwProc', g: 'Water', label: 'Harvested rainwater used in process', unit: 'm³', yrs: 1, used: 'WC5.2' },
  { k: 'recharge', g: 'Water', label: 'Groundwater recharge beyond the fence', unit: 'm³', yrs: 1, used: 'WC6' },
  { k: 'rechargeProj', g: 'Water', label: 'Beyond-fence recharge projects completed', unit: 'count', yrs: 1, int: true, used: 'WC6' },
  { k: 'hazDisp', g: 'Waste', label: 'Hazardous waste disposed', unit: 't', yrs: 3, ledger: true, used: 'WM4.1' },
  { k: 'hazAFR', g: 'Waste', label: 'Hazardous waste used as alternate fuel or raw material', unit: 't', yrs: 1, used: 'WM4.1' },
  { k: 'nonHaz', g: 'Waste', label: 'Non-hazardous waste generated', unit: 't', yrs: 3, ledger: true, used: 'WM4.2' },
  { k: 'landfill', g: 'Waste', label: 'Waste to landfill, including residue at recyclers', unit: 't', yrs: 1, used: 'WM4.3' },
  { k: 'effl', g: 'Waste', label: 'Process effluent generated', unit: 'm³', yrs: 3, used: 'WM5.1' },
  { k: 'efflRec', g: 'Waste', label: 'Process effluent recycled into process', unit: 'm³', yrs: 1, used: 'WM5.1' },
  { k: 'zldProc', g: 'Waste', label: 'Zero liquid discharge, process effluent', unit: 'yes/no', yrs: 1, bool: true, used: 'WM5.1' },
  { k: 'sew', g: 'Waste', label: 'Domestic sewage generated', unit: 'm³', yrs: 3, used: 'WM5.2' },
  { k: 'sewRec', g: 'Waste', label: 'Sewage recycled (process or domestic use)', unit: 'm³', yrs: 1, used: 'WM5.2' },
  { k: 'zldSew', g: 'Waste', label: 'Zero liquid discharge, sewage', unit: 'yes/no', yrs: 1, bool: true, used: 'WM5.2' },
  { k: 'rm', g: 'Materials', label: 'Raw material consumed', unit: 't', yrs: 3, ledger: true, used: 'MCR4.1' },
  { k: 'recycledIn', g: 'Materials', label: 'Recycled or waste material share of raw material', unit: '%', yrs: 1, pct: true, used: 'MCR4.2' },
  { k: 'cons', g: 'Materials', label: 'Major consumables (lube, coolant, chemicals)', unit: 't', yrs: 3, used: 'MCR5' },
  { k: 'pkg', g: 'Materials', label: 'Outbound packaging material', unit: 't', yrs: 3, used: 'MCR6.1' },
  { k: 'pkgRec', g: 'Materials', label: 'Recycled content in packaging', unit: '%', yrs: 1, pct: true, used: 'MCR6.2' },
  { k: 'supCrit', g: 'Supply chain', label: 'Critical suppliers', unit: 'count', yrs: 1, int: true, used: 'GSC4.3 GSC4.5' },
  { k: 'supAud', g: 'Supply chain', label: 'Critical suppliers audited', unit: 'count', yrs: 1, int: true, used: 'GSC4.3' },
  { k: 'supRated', g: 'Supply chain', label: 'Critical suppliers GreenCo-rated', unit: 'count', yrs: 1, int: true, used: 'GSC4.5' },
  { k: 'supImp', g: 'Supply chain', label: 'Supplier improvement over baseline', unit: '%', yrs: 1, pct: true, used: 'GSC4.2' },
  { k: 'inPkg', g: 'Supply chain', label: 'Incoming packaging from suppliers', unit: 't', yrs: 3, used: 'GSC6.1' },
  { k: 'transGHG', g: 'Supply chain', label: 'Transport emissions, upstream and downstream', unit: 'tCO2e', yrs: 3, ledger: true, used: 'GSC6.2' },
  { k: 'emp', g: 'People and site', label: 'Employees', unit: 'count', yrs: 1, int: true, used: 'GI4' },
  { k: 'certPros', g: 'People and site', label: 'Accredited green professionals', unit: 'count', yrs: 1, int: true, used: 'GI4' },
  { k: 'housingPct', g: 'People and site', label: 'Employees housed within 5 km', unit: '%', yrs: 1, pct: true, used: 'GI1.3' },
  { k: 'commutePct', g: 'People and site', label: 'Employees on shuttle, carpool, public transport, walk or cycle', unit: '%', yrs: 1, pct: true, used: 'GI1.3' }
];
const FIELD = Object.fromEntries(FIELDS.map(f => [f.k, f]));

/* ---------- Metrics ---------- */
function num(x) { if (x === '' || x == null) return null; const n = parseFloat(x); return isFinite(n) ? n : null; }
function val(D, k, i) { const v = D[k]; return Array.isArray(v) ? num(v[i]) : num(v); }
function red(a, b) { return (a == null || b == null || a === 0) ? null : (a - b) / a * 100; }
function div(a, b) { return (a == null || b == null || b === 0) ? null : a / b; }
function pctOf(a, b) { const d = div(a, b); return d == null ? null : d * 100; }

function computeMetrics(D, prof, inits, projected) {
  const cls = classify(prof);
  const EF = num(prof.gridEF) || 0, FEF = num(prof.fuelEF) || 0;
  const Y = [0, 1, 2].map(i => {
    const g = k => val(D, k, i);
    const prod = g('prod'), elec = g('elec'), th = g('thermal');
    const on = g('onsiteRE') || 0, onTh = g('onsiteTh') || 0, off = g('offsiteRE') || 0;
    const totGJ = (elec == null || th == null) ? null : elec * 0.0036 + th;
    const grid = elec == null ? null : Math.max(0, elec - on - off);
    const inv1 = g('scope1'), inv2 = g('scope2');
    const s2 = inv2 != null ? inv2 : (grid == null ? null : grid / 1000 * EF);
    const s1 = inv1 != null ? inv1 : (th == null ? null : th * FEF);
    const fwP = g('fwProc'), fwD = g('fwDom');
    const fw = (fwP == null && fwD == null) ? null : (fwP || 0) + (fwD || 0);
    return {
      prod, elec, th, on, onTh, off, totGJ, grid, s1, s2, fw,
      sec: div(totGJ, prod),
      ghgInt: (s1 == null || s2 == null) ? null : div(s1 + s2, prod),
      s3: g('scope3'), s3Int: div(g('scope3'), prod),
      swc: div(fw, prod),
      hazSpec: div(g('hazDisp'), prod), haz: g('hazDisp'),
      nonHaz: g('nonHaz'), effl: g('effl'), sew: g('sew'),
      rmSpec: div(g('rm'), prod), consSpec: div(g('cons'), prod), pkgSpec: div(g('pkg'), prod),
      inPkg: g('inPkg'), trans: g('transGHG')
    };
  });
  const c = Y[2], b = Y[0], g = k => val(D, k, 2);
  const elecOnly = cls.re.v >= 3;
  let onsitePct = null, offsitePct = null;
  if (elecOnly) { onsitePct = pctOf(c.on, c.elec); offsitePct = pctOf(c.off, c.elec); }
  else if (c.totGJ) { onsitePct = (c.on * 0.0036 + c.onTh) / c.totGJ * 100; offsitePct = c.off * 0.0036 / c.totGJ * 100; }
  const allGHG = (c.s1 == null || c.s2 == null) ? null : c.s1 + c.s2 + (c.s3 || 0);
  const innovInits = (inits || []).filter(x => x.innov && (x.status === 'Implemented' || (projected && x.include !== false && (x.status === 'Planned' || x.status === 'In progress'))));
  const reTotal = (onsitePct == null) ? null : onsitePct + (offsitePct || 0);
  const M = {
    Y, elecOnly,
    secRed: red(b.sec, c.sec),
    onsitePct, offsitePct, reTotal,
    reSub: onsitePct == null ? null : (offsitePct || 0) + Math.max(0, onsitePct - 5),
    ghgRed: red(b.ghgInt, c.ghgInt),
    offsetPct: pctOf(g('offsets'), allGHG), s3Missing: !c.s3,
    s3cats: ['s3c1', 's3c2', 's3c3', 's3c4'].filter(k => num(D[k]) > 0).length,
    s3Red: red(b.s3Int, c.s3Int),
    swcRed: red(b.swc, c.swc),
    rwhPct: pctOf(g('rwhCap'), g('rwhPot')),
    rwProc: g('rwProc'),
    rechargeRatio: div(g('recharge'), c.fw), rechargeProj: g('rechargeProj'),
    hazRed: red(b.hazSpec, c.hazSpec), afrPct: pctOf(g('hazAFR'), c.haz),
    nonHazRed: red(b.nonHaz, c.nonHaz),
    landfill: g('landfill'),
    efflRed: red(b.effl, c.effl), efflRecPct: pctOf(g('efflRec'), c.effl), zldProc: num(D.zldProc) > 0,
    sewRed: red(b.sew, c.sew), sewRecPct: pctOf(g('sewRec'), c.sew), zldSew: num(D.zldSew) > 0,
    rmRed: red(b.rmSpec, c.rmSpec), recycledIn: g('recycledIn'),
    consRed: red(b.consSpec, c.consSpec), pkgRed: red(b.pkgSpec, c.pkgSpec), pkgRec: g('pkgRec'),
    supAudPct: pctOf(g('supAud'), g('supCrit')), supRatedPct: pctOf(g('supRated'), g('supCrit')),
    supImp: g('supImp'), inPkgRed: red(b.inPkg, c.inPkg), transRed: red(b.trans, c.trans),
    certPct: pctOf(g('certPros'), g('emp')), housingPct: g('housingPct'), commutePct: g('commutePct'),
    innovCount: innovInits.length, reBonus: reTotal != null && reTotal > 80
  };
  return M;
}

/* ---------- Banding ---------- */
function band(v, bands, op) {
  if (v == null) return { pts: 0, idx: -1 };
  let pts = 0, idx = -1;
  bands.forEach((b, i) => { const ok = op === '>' ? v > b[0] : v >= b[0]; if (ok) { pts = b[1]; idx = i; } });
  return { pts, idx };
}
const steps = (arr, ptsStep) => arr.map((t, i) => [t, (i + 1) * ptsStep]);

/* ---------- Credits ---------- */
const CREDITS = [];
const J = (id, p, name, max, ev) => CREDITS.push({ id, p, name, max, kind: 'J', ev });
const O = (id, p, name, max, opts, ev) => CREDITS.push({ id, p, name, max, kind: 'O', opts, ev });
const C = (id, p, name, max, spec) => CREDITS.push(Object.assign({ id, p, name, max, kind: 'C' }, spec));

// Energy Efficiency 150
J('EE1.1', 'EE', 'Target-setting method and separate electrical and thermal SEC targets', 10, 'Target-setting method, benchmark source, separate electrical and thermal SEC targets.');
J('EE1.2', 'EE', 'Budget allocated versus spent on energy projects', 5, 'Approved budget note or ERP budget head; allocated vs spent for three years.');
J('EE1.3', 'EE', 'Monthly energy reviews chaired by the plant head', 5, 'Twelve sets of minutes comparing SEC with target and previous month.');
J('EE2.1', 'EE', 'Awareness and employee suggestions', 5, 'Programme records, suggestion list with cost-benefit, rewards given.');
J('EE2.2', 'EE', 'Annual energy training', 5, 'Training-needs list, attendance, advanced training for the energy cell.');
J('EE2.3', 'EE', 'Energy scorecard in appraisals', 5, 'Appraisal template showing energy weightage for relevant roles.');
J('EE3.1', 'EE', 'Metering of consumers above 10% and 5% of load', 10, 'Equipment register and daily monitoring sheets for metered consumers.');

/* ---------- Scoring ---------- */
function fmtN(v, d = 1) { return v == null || !isFinite(v) ? '—' : (+v).toLocaleString('en-IN', { maximumFractionDigits: d }); }

function ctxOf(prof) { const k = classify(prof); return { seg: k.seg, ee: k.ee.v, re: k.re.v, ghg: k.ghg.v }; }

function scoreCredit(c, M, ctx, st) {
  let max = c.max;
  if (ctx.seg === 'svc') {
    if (c.p === 'PSLCA') return { excluded: true, pts: 0, max: 0, kind: 'excluded', answered: true };
    if (c.p === 'MCR' || c.p === 'GSC') max = c.max * 0.75;
  }
  const scale = max / c.max;
  if (st.profile.igbc && /^GI1\./.test(c.id)) return { pts: max, max, kind: 'claimed', answered: true, note: 'Option 1: IGBC Green Factory rated.' };
  if (c.kind === 'J') { const a = st.judged[c.id]; return { pts: a == null ? 0 : LEVELS[a].v * max, max, kind: 'claimed', answered: a != null, level: a }; }
  if (c.kind === 'O') { const a = st.options[c.id]; const o = a == null ? null : c.opts[a]; return { pts: o ? o[1] * scale : 0, max, kind: 'claimed', answered: a != null, opt: a }; }
  let r;
  if (c.fn) r = c.fn(M, ctx, st);
  else { const b = typeof c.bands === 'function' ? c.bands(ctx) : c.bands; const x = band(M[c.m], b, c.op); r = { val: M[c.m], pts: x.pts, bands: b, op: c.op, unit: c.unit }; }
  if (r.bands && r.val != null) { const x = band(r.val, r.bands, r.op || '>='); r.idx = x.idx; r.next = r.bands[x.idx + 1] || null; }
  let pts = Math.min(c.max, r.pts || 0), kind = 'computed';
  if (c.best && st.best[c.id]) { pts = c.max; kind = 'claimed'; r.note = 'Best-performer claim: full points if the assessor accepts national-best evidence.'; }
  return Object.assign({}, r, { pts: pts * scale, raw: pts, max, kind, answered: r.val != null });
}

function cloneData(D) { return JSON.parse(JSON.stringify(D)); }
/* Apply a change to the assessment-year value. Energy changes also move the
   inventoried Scope 1/2 totals by the saved energy times the profile factors,
   so ledger emissions stay the base and initiatives adjust them. */
function addField(D, k, d, prof) {
  const f = FIELD[k]; if (!f) return;
  const clamp = (v, ff) => { let x = Math.max(0, v); if (ff.pct) x = Math.min(100, x); if (ff.bool) x = x > 0 ? 1 : 0; return x; };
  const bump = (key, dd) => { const ff = FIELD[key]; if (Array.isArray(D[key])) D[key][2] = clamp((num(D[key][2]) || 0) + dd, ff); else D[key] = clamp((num(D[key]) || 0) + dd, ff); };
  bump(k, d);
  if (!prof) return;
  const EF = num(prof.gridEF) || 0, FEF = num(prof.fuelEF) || 0;
  const has = key => Array.isArray(D[key]) && num(D[key][2]) != null;
  if (has('scope2')) {
    if (k === 'elec') bump('scope2', d / 1000 * EF);
    if (k === 'onsiteRE' || k === 'offsiteRE') bump('scope2', -d / 1000 * EF);
  }
  if (has('scope1') && k === 'thermal') bump('scope1', d * FEF);
}
function isActive(i) { return i.include !== false && (i.status === 'Planned' || i.status === 'In progress'); }
function activeIds(st, opt = {}) {
  return (st.initiatives || []).filter(i => {
    if (opt.set) return opt.set.includes(i.id);
    if (!isActive(i)) return false;
    if (opt.exclude === i.id) return false;
    if (opt.only && opt.only !== i.id) return false;
    return true;
  }).map(i => i.id);
}
function project(st, opt = {}) {
  const D = cloneData(opt.D || st.data);
  const ids = activeIds(st, opt);
  (st.initiatives || []).forEach(i => {
    if (!ids.includes(i.id)) return;

  return u === '%' ? F(r.val, 2) + '%' : F(r.val, 2) + unitSuffix(u);
}
function fmtDelta(k, d) {
  const f = GC.FIELD[k]; if (!f || d == null) return '—';
  const a = Math.abs(d);
  const s = d > 0 ? '+' : d < 0 ? MINUS : '';
  if (f.bool) return d > 0 ? 'switch to yes' : 'switch to no';
  return s + F(a, f.int ? 0 : (a < 10 ? 2 : 0)) + unitSuffix(f.unit);
}
function pts(x) { return F(x, 1); }
function bandTag(b) { return `<span class="band-t bc-${b.cls}">${esc(b.name)}</span>`; }
function kindTag(r) {
  if (r.kind === 'computed') return '<span class="tag k-computed" title="Scored from plant data">Computed</span>';
  if (r.kind === 'excluded') return '<span class="tag k-claimed">Not applicable</span>';
  return '<span class="tag k-claimed" title="Self-claimed readiness; needs assessor acceptance">Self-claimed</span>';
}
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200); }
function paramName(id) { const p = GC.P3.find(x => x.id === id) || GC.P4.find(x => x.id === id); return p ? p.name : id; }
function linkedInits(cid) { return S.initiatives.filter(i => i.credit === cid); }
function destroyCharts() { Object.values(charts).forEach(c => { try { c.destroy(); } catch (e) { } }); charts = {}; }
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

/* ---------- shell ---------- */
const NAV = [
  { id: 'dash', label: 'Overview' },
  { id: 'profile', n: 1, label: 'Plant profile' },
  { id: 'data', n: 2, label: 'Plant data' },
  { id: 'assess', n: 3, label: 'Assessment' },
  { id: 'inits', n: 4, label: 'Initiatives' },
  { id: 'gap', n: 5, label: 'Gaps and roadmap' },
  { id: 'evidence', n: 6, label: 'Evidence' },
  { id: 'pack', n: 7, label: 'Submission pack' },
  { id: 'compare', label: 'Compare versions' }
];
function dataCompleteness() {
  let n = 0, f = 0;
  GC.FIELDS.forEach(fd => { const v = S.data[fd.k]; if (Array.isArray(v)) { n += 3; f += v.filter(x => GC.num(x) != null).length; } else { n++; if (GC.num(v) != null) f++; } });
  return n ? f / n : 0;
}
function evidenceCoverage() {
  const res = RES(); const cs = GC.CREDITS.filter(c => !res.R[c.id].excluded);
  return cs.filter(c => (S.evidence[c.id] || []).length || ledgerDocsForCredit(c.id).length).length / cs.length;
}
function stepStatus(id) {
  const res = RES();
  switch (id) {
    case 'dash': return GC.VERSIONS[S.profile.version].name;
    case 'profile': return S.profile.sector ? esc(S.profile.sector) : 'Not set';
    case 'data': { const s = ledgerStats(); return s.led + ' from ledger, ' + s.man + ' entered here'; }
    case 'assess': return Math.round(res.coverage * 100) + '% of credits answered';
    case 'inits': { const a = S.initiatives.filter(GC.isActive).length; return S.initiatives.length + ' logged, ' + a + ' in projection'; }
    case 'gap': return pts(res.max - res.total) + ' points not yet earned';
    case 'evidence': return Math.round(evidenceCoverage() * 100) + '% of credits evidenced';
    case 'pack': return 'Export and print';
    case 'compare': return 'V3, V4, Lite';
  }
  return '';
}
function stepDone(id) {
  const res = RES();

}

  }).join('');
}

const DISCLAIMER = 'Indicative self-assessment computed from data entered in TerraCAP. This is not a CII rating. CII assessors and the judges\u2019 panel determine the actual rating.';

  const v = GC.VERSIONS[S.profile.version];

/* ---------- ladder ---------- */
function ladder(L, PL) {
  const f = L.total ? L.bandScore / L.total : 1;
  const compS = L.params.reduce((a, p) => a + p.comp, 0) * f;
  const pos = v => Math.max(0, Math.min(100, v / 10));
  const segs = [[0, 350, 'none', ''], [350, 450, 'cert', 'Certified'], [450, 550, 'bron', 'Bronze'], [550, 650, 'silv', 'Silver'], [650, 750, 'gold', 'Gold'], [750, 1000, 'plat', 'Platinum']];
  const track = segs.map(s => `<div class="seg" style="width:${(s[1] - s[0]) / 10}%;background:var(--b-${s[2]});${s[2] === 'none' ? '' : 'opacity:.85'}"></div>`).join('');
  const labels = segs.filter(s => s[3]).map(s => `<span style="left:${s[0] / 10}%">${s[3]}<br>${s[0]}</span>`).join('');
  const mk = (cls, v, label) => `<div class="mk ${cls}" style="left:${pos(v)}%"><i></i><em>${label}</em></div>`;
  return `<div class="ladder" role="img" aria-label="Score ${pts(L.bandScore)} of 1000 on the GreenCo band scale">
    <div class="track">${track}</div><div class="blabels">${labels}</div>
    ${mk('', L.bandScore, 'Now ' + pts(L.bandScore))}
    ${PL && Math.abs(PL.bandScore - L.bandScore) > 0.5 ? mk('proj', PL.bandScore, 'With initiatives ' + pts(PL.bandScore)) : ''}
    ${mk('comp', compS, 'From plant data ' + pts(compS))}
  </div>`;
}

/* ---------- overview ---------- */
function nearMisses() {
  const res = RES(), out = [];
  GC.CREDITS.forEach(c => {
    const r = res.R[c.id];
    if (c.kind !== 'C' || !r.next || r.val == null || r.kind !== 'computed') return;
    const gap = r.next[0] - r.val;
    const lim = r.unit === '%' ? 2 : Math.max(0.15 * Math.abs(r.next[0]), 0.01);
    if (gap > 0 && gap <= lim) out.push({ c, r, gap, gain: r.next[1] * (r.max / c.max) - r.pts });
  });
  return out.sort((a, b) => b.gain - a.gain);
}
function biggestGaps(n) {
  const res = RES();
  return GC.CREDITS.map(c => ({ c, r: res.R[c.id], lost: res.R[c.id].max - res.R[c.id].pts })).filter(x => !x.r.excluded && x.lost > 0.05).sort((a, b) => b.lost - a.lost).slice(0, n);
}

        ${ladder(L, PL)}
        <div class="legend"><span><i style="background:var(--ink)"></i>Indicative score now</span><span><i style="background:var(--green-d)"></i>Points computed from plant data</span><span><i style="border-top:2px dashed var(--ai);height:0"></i>If planned initiatives deliver</span></div>
      </div>
      <div class="stats">
        <div><span>Computed from plant data</span><b>${pts(comp)}</b></div>

        <div><span>Credits answered</span><b>${Math.round(res.coverage * 100)}%</b></div>

        <div><span>Platinum+ readiness</span><b style="font-weight:600;font-size:12.5px;text-align:right">${plat}</b></div>
      </div>
    </div>
    ${gatesOk ? '' : '<div class="note bad" style="margin-top:14px"><b>Mandatory requirements are incomplete.</b> CII will not rate the plant until every mandatory requirement is met, whatever the points total. Open Assessment to see which.</div>'}
    ${L.note ? '<div class="note warn" style="margin-top:14px">' + esc(L.note) + '</div>' : ''}
  </div>
  <div class="grid2" style="margin-top:14px">
    <div class="panel">
      <div class="row" style="margin-bottom:12px"><h3>Points by parameter</h3><span class="sp"></span><span class="muted small">Select a row to open it</span></div>
      <div class="pbars">${L.params.filter(p => p.max > 0).map(p => {
        const pp = PL.params.find(x => x.id === p.id);

          <span class="nm">${esc(p.name)}</span>

          <span class="v">${pts(p.pts)} <span class="muted small">/ ${F(p.max, 0)}</span></span></div>`;

      <div class="legend"><span><i style="background:var(--green)"></i>Computed</span><span><i style="background:var(--claim)"></i>Self-claimed</span><span><i style="border-top:2px dashed var(--ai);height:0"></i>With planned initiatives</span></div>

    </div>

/* ---------- plant data ---------- */
function setD(k, i, v) {
  const f = GC.FIELD[k]; const n = v === '' ? '' : (f.bool ? (v ? 1 : 0) : parseFloat(v));
  if (Array.isArray(S.data[k])) S.data[k][i] = n; else S.data[k] = n;

}
function rowSource(f) {
  if (!f.ledger) return '<span class="muted small">Entered here</span>';
  const o = S.overrides[f.k];
  if (o) return `<span class="tag k-prov">Overridden</span><div class="muted small" style="margin-top:3px;max-width:220px">${esc(o.reason)}</div><button class="linkbtn" onclick="revertRow('${f.k}')">Revert to ledger</button>`;
  const n = isArr(f.k) ? 3 : 1, cells = [...Array(n)].map((_, i) => srcOf(f.k, i));
  const led = cells.filter(c => c === 'ledger').length;
  if (!led) return '<span class="small" style="color:var(--amber)">Not in ledger: enter here</span>';
  return `<span class="src">From ledger${led < n ? `, ${n - led} year${n - led > 1 ? 's' : ''} missing` : ''}</span><br><button class="linkbtn" onclick="overrideRow('${f.k}')">Override</button>`;
}
function rData() {
  const p = S.profile, res = RES(), Y = res.M.Y, st = ledgerStats(), L = S.ledger || {};
  const groups = [...new Set(GC.FIELDS.map(f => f.g))];
  const cell = (f, i) => {
    const v = Array.isArray(S.data[f.k]) ? S.data[f.k][i] : S.data[f.k];
    const src = srcOf(f.k, i);

/* ---------- AI review ----------
   Route, in order:
   1. window.TERRACAP_AI_ENDPOINT (INTEGRATION): TerraCAP's server-side proxy. It receives an Anthropic
      Messages API body ({model, max_tokens, system, messages}), adds the API key server-side, and returns
      the Messages API response unchanged. Never put an API key in the page.
   2. Published Claude artifact: the "sample" capability, billed to the viewer's Claude account.
   3. Claude chat preview: direct Messages API call, which the preview proxies.
   A copy of this file opened from disk has none of these, and says so. */
const CAPS = {};
function getCap(name) {
  if (CAPS[name] !== undefined) return Promise.resolve(CAPS[name]);
  if (!(window.claude && typeof window.claude.use === 'function')) { CAPS[name] = null; return Promise.resolve(null); }
  return Promise.race([window.claude.use(name), new Promise(r => setTimeout(() => r(null), 11000))])
    .then(x => (CAPS[name] = x || null), () => (CAPS[name] = null));
}
const AI_NET_MSG = 'This page could not reach an AI service. AI review runs on the published TerraCAP demo link, in the Claude preview, or inside TerraCAP once window.TERRACAP_AI_ENDPOINT points to the AI proxy. A copy of the file opened straight from disk cannot call it.';
const SAMPLE_MSG = { not_granted: 'AI review needs permission to use your Claude account. Allow it when asked, or reload the page to be asked again.', rate_limited: 'Too many AI reviews are running. Wait a minute, then run this one again.', cancelled: 'Review cancelled.' };
function aiRoute() { if (window.TERRACAP_AI_ENDPOINT) return 'TerraCAP AI proxy'; if (CAPS.sample) return 'your Claude account (the first review asks permission)'; return 'Claude preview connection'; }
function parseAI(data) {
  const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n').replace(/```json|```/g, '').trim();
  const a = text.indexOf('{'), z = text.lastIndexOf('}');
  if (a < 0 || z < a) throw new Error('The AI response was not in the expected format. Run the review again.');
  return JSON.parse(text.slice(a, z + 1));
}
async function aiCall(system, payload) {
  const body = JSON.stringify(payload);
  const req = JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 1000, system, messages: [{ role: 'user', content: body }] });
  if (window.TERRACAP_AI_ENDPOINT) {
    let res;
    try { res = await fetch(window.TERRACAP_AI_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: req }); }
    catch (e) { throw new Error('The TerraCAP AI proxy at ' + window.TERRACAP_AI_ENDPOINT + ' could not be reached.'); }
    if (!res.ok) throw new Error('The TerraCAP AI proxy returned status ' + res.status + '.');
    return parseAI(await res.json());
  }
  const sample = await getCap('sample');
  if (sample) {
    try { return await sample.json(system + '\n\nInput (JSON):\n' + body + '\n\nReturn only the JSON object described above.', { modelTier: 'default' }); }
    catch (e) { throw new Error(SAMPLE_MSG[e && e.code] || ('AI review failed: ' + ((e && e.message) || 'unknown error') + '.')); }
  }
  let res;
  try { res = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: req }); }
  catch (e) { throw new Error(AI_NET_MSG); }
  if (!res.ok) throw new Error('The AI service returned status ' + res.status + '. ' + (res.status === 401 || res.status === 403 ? AI_NET_MSG : ''));
  return parseAI(await res.json());
}

  <div class="panel"><div class="evhead"><span>Credit</span><span>What the assessor looks for</span><span>From TerraCAP ingestion</span><span>Uploaded for GreenCo</span><span></span></div>
  ${cs.map(c => { const fl = S.evidence[c.id] || [], ld = ledgerDocsForCredit(c.id); return `<div class="evrow"><b style="color:var(--green-d)">${c.id}</b><div><div style="font-weight:600">${esc(c.name)}</div><div class="muted small">${esc(c.ev)}</div></div>
    <div class="files">${ld.length ? ld.map(d => `<span><span class="tag k-computed">Ledger</span> ${esc(d.name)} <span class="muted">${F(d.count, 0)} records, ${esc(d.period)}</span></span>`).join('') : '<span class="muted">None linked</span>'}</div>
    <div class="files">${fl.length ? fl.map((f, k2) => `<span>📄 ${esc(f.name)} <span class="muted">${F(f.size / 1024, 0)} KB</span><button onclick="rmEv('${c.id}',${k2})" aria-label="Remove ${esc(f.name)}">Remove</button></span>`).join('') : '<span class="muted">Nothing uploaded</span>'}</div>
    <button class="btn sm" onclick="attach('${c.id}')">Upload</button></div>`; }).join('')}</div>`;
}
function aEvidence() {
  const res = RES(), el = $('#chEv'); if (!el) return;
  const ps = GC.P3.filter(x => !(res.ctx.seg === 'svc' && x.id === 'PSLCA'));
  const ks = ps.map(x => { const c2 = GC.CREDITS.filter(c => c.p === x.id); return { n: c2.length, k: evCounts(c2) }; });
  const pc = (v, n) => +(v / n * 100).toFixed(0);
  charts.e = new Chart(el, { type: 'bar', data: { labels: ps.map(x => x.id), datasets: [
    { label: 'Ledger records only', data: ks.map(x => pc(x.k.led, x.n)), backgroundColor: cssVar('--claim'), stack: 's' },
    { label: 'Uploads (with or without ledger)', data: ks.map(x => pc(x.k.up + x.k.both, x.n)), backgroundColor: cssVar('--green'), stack: 's' }] },
    options: { responsive: true, maintainAspectRatio: false, scales: { y: { stacked: true, max: 100, ticks: { callback: v => v + '%' } }, x: { stacked: true } } } });
}

/* ---------- submission pack ---------- */
async function download(name, text, type) {
  const dl = await getCap('downloads');
  if (dl) {
    try { await dl.save({ filename: name, data: text }); return true; }
    catch (e) { if (!(e && e.code === 'declined')) toast('Download is not available here (' + ((e && e.code) || 'error') + ').'); return false; }
  }
  const b = new Blob([text], { type }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); return true;
}
function slug() { return (S.profile.plant || 'plant').replace(/[^a-z0-9]+/gi, '-').toLowerCase(); }
async function exportJSON() { if (await download('greenco-' + slug() + '.json', JSON.stringify(Object.assign({ exported: new Date().toISOString(), disclaimer: DISCLAIMER }, S), null, 2), 'application/json')) toast('Assessment exported'); }
async function exportCSV() {
  const res = RES(), q = s => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
  const rows = [['credit', 'parameter', 'name', 'type', 'value', 'points', 'max', 'ledger_record_sets', 'uploaded_files', 'v4_parameter_provisional']];
  GC.CREDITS.forEach(c => { const r = res.R[c.id]; if (r.excluded) return; rows.push([c.id, c.p, c.name, r.kind, c.kind === 'C' ? fmtVal(c, r) : (r.level != null ? GC.LEVELS[r.level].label : (r.opt != null ? c.opts[r.opt][0] : '')), r.pts.toFixed(2), r.max, ledgerDocsForCredit(c.id).length, (S.evidence[c.id] || []).length, GC.v4Of(c.id)]); });
  if (await download('greenco-credits-' + slug() + '.csv', rows.map(r => r.map(q).join(',')).join('\n'), 'text/csv')) toast('Credit table exported');
}
function importJSON() { const f = $('#importFile'); f.value = ''; f.click(); }
function resetDemo() { confirmBox('Replace the current assessment with the demo plant?', 'Load demo plant', () => { S = gcSeed(); S.ledger = ledgerFetch(S.profile); applyLedger(); commit('Demo plant loaded'); }); }
function rPack() {
  const res = RES(), L = CACHE.lens, PL = CACHE.plens, p = S.profile, Y = res.M.Y;
  const verName = GC.VERSIONS[p.version].name;
  return `<div class="sechead noprint"><div><h2>Submission pack</h2><p>A TerraCAP-format readiness pack for the plant team and consultant. It is not a CII template; map it to the CII questionnaire or portal for the version the plant registers under.</p></div>
    <div class="row"><button class="btn pri" onclick="window.print()">Print or save as PDF</button><button class="btn" onclick="exportJSON()">Download assessment (JSON)</button><button class="btn" onclick="exportCSV()">Download credit table (CSV)</button><button class="btn ghost" onclick="importJSON()">Import JSON</button><button class="btn ghost" onclick="resetDemo()">Load demo plant</button></div></div>
  <div class="doc">
    <h1>GreenCo readiness pack</h1>
    <p>${esc(p.plant)}, ${esc(p.org)}, ${esc(p.location)}</p>
    <p class="small" style="color:#5a6e68">Sector: ${esc(p.sector)}. Scoring version: ${esc(verName)}${p.customerLabel ? ' (customer label: ' + esc(p.customerLabel) + ')' : ''}. Period: ${esc(p.years[0])} to ${esc(p.years[2])}. Generated ${new Date().toLocaleDateString('en-IN')} in TerraCAP.</p>
    <div class="dis"><b>Indicative only.</b> ${DISCLAIMER} ${GC.VERSIONS[p.version].provisional ? esc(GC.VERSIONS[p.version].basis) : ''} Sector classifications and provisional rules used in this pack are listed in section 6.</div>
    <h2>1. Summary</h2>
    <table class="tbl"><tbody>
      <tr><td>Indicative score</td><td class="r"><b>${pts(L.total)} of ${F(L.max, 0)}</b></td><td>${esc(L.band.name)}${L.bandScore !== L.total ? ' (on ' + pts(L.bandScore) + ' of 1000)' : ''}</td></tr>
      <tr><td>Computed from plant data</td><td class="r">${pts(L.params.reduce((a, x) => a + x.comp, 0))}</td><td></td></tr>
      <tr><td>Self-claimed readiness</td><td class="r">${pts(L.params.reduce((a, x) => a + x.claim, 0))}</td><td>Needs assessor acceptance</td></tr>
      <tr><td>If planned initiatives deliver</td><td class="r">${pts(PL.total)}</td><td>${esc(PL.band.name)}</td></tr>
      <tr><td>Mandatory requirements met</td><td class="r">${res.gatesMet} of ${res.gatesN}</td><td>${res.gatesMet === res.gatesN ? 'Complete' : 'Incomplete: plant is not ratable until met'}</td></tr>
      <tr><td>Credits answered</td><td class="r">${Math.round(res.coverage * 100)}%</td><td></td></tr>
      <tr><td>Credits with evidence attached</td><td class="r">${Math.round(evidenceCoverage() * 100)}%</td><td></td></tr>
    </tbody></table>
    <h2>2. Parameters</h2>
    <table class="tbl"><thead><tr><th>Parameter</th><th class="r">Computed</th><th class="r">Self-claimed</th><th class="r">Total</th><th class="r">Max</th></tr></thead><tbody>
    ${L.params.filter(x => x.max > 0).map(x => `<tr><td>${esc(x.name)}</td><td class="r">${pts(x.comp)}</td><td class="r">${pts(x.claim)}</td><td class="r"><b>${pts(x.pts)}</b></td><td class="r">${F(x.max, 0)}</td></tr>`).join('')}</tbody></table>
    <h2>3. Mandatory requirements</h2>
    <table class="tbl"><tbody>${GC.GATES.filter(g => !(res.ctx.seg === 'svc' && g.p === 'PSLCA')).map(g => `<tr><td>${g.p}</td><td>${esc(g.label)}</td><td>${S.gates[g.id] ? 'Met' : '<b style="color:#a33131">Not met</b>'}</td></tr>`).join('')}</tbody></table>
    <h2>4. Credit detail (V3 credits)</h2>
    <table class="tbl"><thead><tr><th>Credit</th><th>Result</th><th>Type</th><th class="r">Points</th><th class="r">Ledger records</th><th class="r">Uploads</th></tr></thead><tbody>
    ${GC.P3.map(pp => { const cs = GC.CREDITS.filter(c => c.p === pp.id && !res.R[c.id].excluded); if (!cs.length) return ''; return `<tr class="grp"><td colspan="6">${esc(pp.name)}</td></tr>` + cs.map(c => { const r = res.R[c.id]; return `<tr><td><b>${c.id}</b> ${esc(c.name)}</td><td>${c.kind === 'C' ? fmtVal(c, r) : (r.level != null ? GC.LEVELS[r.level].label : (r.opt != null ? esc(c.opts[r.opt][0]) : 'Not answered'))}</td><td>${r.kind === 'computed' ? 'Computed' : 'Self-claimed'}</td><td class="r">${pts(r.pts)} / ${F(r.max, 1)}</td><td class="r">${ledgerDocsForCredit(c.id).length}</td><td class="r">${(S.evidence[c.id] || []).length}</td></tr>`; }).join(''); }).join('')}</tbody></table>
    <h2>5. Initiatives register</h2>
    <table class="tbl"><thead><tr><th>Initiative</th><th>Status</th><th>Quantified impact per year</th><th class="r">Capex (₹ lakh)</th><th class="r">Points if delivered</th><th>AI review</th></tr></thead><tbody>
    ${S.initiatives.map(i => { const e = i.status === 'Implemented' ? null : GC.initiativeEffect(S, i.id); const a = S.ai[i.id]; return `<tr><td><b>${esc(i.title)}</b><br><span style="color:#5a6e68">${esc(paramName(i.p))}${i.credit ? ', ' + i.credit : ''}${i.innov ? ', innovation project' : ''}</span></td><td>${esc(i.status)}</td><td>${(i.impacts || []).map(x => esc(GC.FIELD[x.f].label) + ': ' + fmtDelta(x.f, GC.num(x.d))).join('<br>') || '—'}</td><td class="r">${F(i.capex, 1)}</td><td class="r">${e ? '+' + pts(e.standalone) : 'In data'}</td><td>${a && !a.error ? esc(a.verdict || '').replace(/_/g, ' ') : '—'}</td></tr>`; }).join('')}</tbody></table>
    <h2>6. Basis and assumptions</h2>
    <table class="tbl"><tbody>
      <tr><td>Data source</td><td>${ledgerStats().led} values from ${esc((S.ledger || {}).source || 'the TerraCAP ledger')}${S.ledger && S.ledger.syncedAt ? ', synced ' + new Date(S.ledger.syncedAt).toLocaleDateString('en-IN') : ''}; ${ledgerStats().man} entered in this workflow.${Object.keys(S.overrides || {}).length ? '<br><b>Ledger overrides:</b><br>' + Object.entries(S.overrides).map(([k, o]) => esc(GC.FIELD[k].label) + ': ' + esc(o.reason)).join('<br>') : ' No ledger values overridden.'}</td></tr>
      <tr><td>Credit rules</td><td>CII GreenCo V3 abridged reference guide (June 2018). V4 and Lite parameter weights from the CII GreenCo annual report 2024-25; their credit criteria are not public, so V4 and Lite scores project V3 credit results through a provisional mapping.</td></tr>
      <tr><td>Sector classification</td><td>EE4 category ${res.ctx.ee}, renewable category ${res.ctx.re} (${GC.RE_EXP[res.ctx.re]}% expected), ${res.ctx.ghg === 'int' ? 'GHG-intensive' : 'non-intensive'}. Proposed by the plant; accepted or changed by the assessor.</td></tr>
      <tr><td>Provisional rules</td><td>${GC.CREDITS.filter(c => c.provisional).map(c => '<b>' + c.id + '</b>: ' + esc(c.provisional)).join('<br>')}</td></tr>
      <tr><td>Emission factors</td><td>Grid ${esc(p.gridEF)} tCO2/MWh; fuel ${esc(p.fuelEF)} tCO2/GJ, applied to all three years.</td></tr>
      <tr><td>Key figures (${esc(p.years[0])} to ${esc(p.years[2])})</td><td>SEC ${F(Y[0].sec, 3)} to ${F(Y[2].sec, 3)} GJ per unit; Scope 1+2 intensity ${F(Y[0].ghgInt, 4)} to ${F(Y[2].ghgInt, 4)} t per unit; specific fresh water ${F(Y[0].swc, 3)} to ${F(Y[2].swc, 3)} m³ per unit.</td></tr>
      <tr><td>AI reviews</td><td>Advisory text from a language model on the plausibility of initiative quantities. They do not affect any score in this pack.</td></tr>
    </tbody></table>
  </div>`;
}

/* ---------- compare versions ---------- */
function rCompare() {
  const res = RES(), proj = PROJ();
  const Ls = ['V3', 'V4', 'LITE'].map(v => ({ v, L: GC.lens(res, v), P: GC.lens(proj, v) }));
  return `<div class="sechead"><div><h2>Compare versions</h2><p>The same plant data scored three ways. Useful when a plant is moving from a V3 cycle to V4, or deciding between the full rating and Lite.</p></div></div>
  <div class="note warn" style="margin-bottom:14px">Only V3 is scored against published credit rules. V4 and Lite scores are a provisional projection of V3 credit results onto the published parameter weights, and will change once CII's credit criteria for those versions are loaded.</div>
  <div class="grid3">${Ls.map(x => `<div class="panel" style="${S.profile.version === x.v ? 'border-color:var(--green);border-width:2px' : ''}">
    <div class="row"><h3>${GC.VERSIONS[x.v].name}</h3><span class="sp"></span>${x.L.provisional && x.v !== 'V3' ? '<span class="tag k-prov">Provisional</span>' : ''}</div>
    <p class="muted small">${esc(GC.VERSIONS[x.v].sub)}</p>
    <div class="big" style="display:flex;align-items:baseline;gap:8px;margin-top:10px"><span style="font-size:36px;font-weight:800">${pts(x.L.total)}</span><span class="muted">/ ${F(x.L.max, 0)}</span></div>
    <p>${bandTag(x.L.band)} <span class="muted small">on ${pts(x.L.bandScore)} of 1000</span></p>
    <p class="small" style="margin-top:6px">With planned initiatives: <b>${pts(x.P.total)}</b> ${bandTag(x.P.band)}</p>
    ${S.profile.version !== x.v ? `<button class="btn sm" style="margin-top:10px" onclick="setVersion('${x.v}')">Use this version</button>` : '<p class="small" style="margin-top:10px;color:var(--green-d);font-weight:700">Current scoring version</p>'}
    <table class="tbl" style="margin-top:12px"><tbody>${x.L.params.filter(q => q.max > 0).map(q => `<tr><td>${esc(q.name)}</td><td class="r">${pts(q.pts)}</td><td class="r muted">${F(q.max, 0)}</td></tr>`).join('')}</tbody></table>
  </div>`).join('')}</div>
  <div class="panel" style="margin-top:14px"><h3>Band score on a 1000-point scale</h3><div class="chartbox"><canvas id="chCmp"></canvas></div></div>`;
}
function aCompare() {
  const el = $('#chCmp'); if (!el) return;
  const res = RES(), proj = PROJ(), vs = ['V3', 'V4', 'LITE'];
  charts.c = new Chart(el, { type: 'bar', data: { labels: vs.map(v => GC.VERSIONS[v].name), datasets: [
    { label: 'Now', data: vs.map(v => +GC.lens(res, v).bandScore.toFixed(1)), backgroundColor: cssVar('--green') },
    { label: 'With planned initiatives', data: vs.map(v => +GC.lens(proj, v).bandScore.toFixed(1)), backgroundColor: cssVar('--ai') }] },
    options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 1000 } } } });
}

/* ---------- boot ---------- */
document.getElementById('evFile').addEventListener('change', e => {
  if (!EVT) return; S.evidence[EVT] = S.evidence[EVT] || [];
  [...e.target.files].forEach(f => S.evidence[EVT].push({ name: f.name, size: f.size, date: new Date().toISOString().slice(0, 10) }));
  commit(e.target.files.length + ' file(s) attached to ' + EVT);
});
document.getElementById('importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const j = JSON.parse(await f.text()); if (!j.profile || !j.data) throw new Error('missing profile or data'); S = migrate(j); if (!S.ledger) S.ledger = ledgerFetch(S.profile); applyLedger(); commit('Assessment imported'); }
  catch (err) { toast('Import failed: ' + err.message); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
(async () => {
  S.ledger = ledgerFetch(S.profile); applyLedger(); recompute(); render();
  const saved = await restore();
  if (saved && saved.profile && saved.data) { S = migrate(saved); if (!S.ledger) S.ledger = ledgerFetch(S.profile); applyLedger(); recompute(); render(); }
  Promise.all([getCap('sample'), getCap('downloads')]).then(() => { if (V.sec === 'inits') render(); });
})();
</script>
</body></html>
