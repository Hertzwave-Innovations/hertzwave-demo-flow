<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TerraCAP — Carbon Market Compliance</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d1512; --ink2:#374151; --mute:#6b7280; --faint:#9ca3af; --line:#e5e7eb; --line2:#f1f2f4; --bg:#f7f8f7; --card:#ffffff;
  --teal:#1d9e75; --teal-d:#0f7a60; --teal-bg:#e1f5ee; --teal-bg2:#f0faf5;
  --coral:#993c1d; --coral-bg:#faece7; --coral-bg2:#fdf3ef;
  --amber:#a6660f; --amber-bg:#faeeda; --amber-bg2:#fffaf2;
  --blue:#185fa5; --blue-bg:#e6f1fb; --blue-bg2:#f2f8fe;
  --sans:'DM Sans',system-ui,sans-serif; --head:'Plus Jakarta Sans',system-ui,sans-serif; --mono:'DM Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);font-size:13.5px;color:var(--ink);background:var(--bg);line-height:1.5}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* ---------- top bar ---------- */
#top{position:sticky;top:0;z-index:20;height:52px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 18px}
.brand{font-family:var(--head);font-weight:800;font-size:16px;color:var(--teal-d);letter-spacing:-.01em}
.brand small{font-family:var(--sans);font-weight:500;font-size:12px;color:var(--mute);margin-left:8px}
.chips{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 10px;border-radius:20px;background:var(--line2);color:var(--ink2);white-space:nowrap}
.chip b{font-weight:600}
.demo-flag{font-size:11px;color:var(--amber);background:var(--amber-bg);padding:3px 9px;border-radius:20px}

/* ---------- layout ---------- */
#app{display:grid;grid-template-columns:262px minmax(0,1fr);min-height:calc(100vh - 52px)}
#nav{background:#fff;border-right:1px solid var(--line);padding:14px 0 30px;position:sticky;top:52px;height:calc(100vh - 52px);overflow-y:auto}
#main{padding:26px 34px 80px;max-width:1080px;width:100%;min-width:0}
@media(max-width:900px){#app{grid-template-columns:minmax(0,1fr)}#top{height:auto;min-height:52px;flex-wrap:wrap;padding:8px 16px}.chips{margin-left:0}.chips .chip:nth-child(n+2){display:none}#nav{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line)}#main{padding:20px 16px 60px}}

.ng{font-size:11px;font-weight:600;color:var(--faint);padding:14px 18px 6px;display:flex;align-items:center;gap:8px}
.ng .rg{font-weight:500;font-size:10.5px;padding:1px 7px;border-radius:10px}
.rg-dom{background:var(--blue-bg);color:var(--blue)}
.rg-eu{background:var(--coral-bg);color:var(--coral)}
.rg-uk{background:var(--amber-bg);color:var(--amber)}
.ni{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;text-align:left;padding:7px 18px;cursor:pointer;color:var(--ink2);border-left:3px solid transparent;font-size:13px}
.ni:hover{background:#fafafa}
.ni.on{background:var(--teal-bg2);border-left-color:var(--teal);color:var(--teal-d);font-weight:600}
.ni .st{width:18px;height:18px;border-radius:50%;border:1.5px solid #cfd3d8;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff}
.ni .st.done{background:var(--teal);border-color:var(--teal)}
.ni .st.part{border-color:var(--amber);background:conic-gradient(var(--amber) 0 50%,transparent 50%)}
.ni .meta{margin-left:auto;font-size:10.5px;color:var(--faint);font-family:var(--mono)}
.ni.off{opacity:.38;cursor:not-allowed}

/* ---------- page furniture ---------- */
.crumb{font-size:12px;color:var(--mute);margin-bottom:6px}
h1{font-family:var(--head);font-size:24px;font-weight:800;letter-spacing:-.015em;line-height:1.2;margin-bottom:6px}
.lede{color:var(--mute);font-size:14px;max-width:720px;margin-bottom:22px}
h2{font-family:var(--head);font-size:15.5px;font-weight:700;margin-bottom:4px}
h3{font-size:13.5px;font-weight:600;margin-bottom:3px}
.sub{color:var(--mute);font-size:12.5px;margin-bottom:12px;max-width:720px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:14px}
.card.tight{padding:14px 16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}.opts{grid-template-columns:1fr !important}}
.hr{height:1px;background:var(--line2);margin:14px 0}

/* question blocks in setup */
.q{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;padding:20px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:none}
.qn{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-weight:600;font-size:12px;display:flex;align-items:center;justify-content:center}
.q.locked{opacity:.4;pointer-events:none}
.qt{font-family:var(--head);font-weight:700;font-size:15px;margin-bottom:3px}

/* option tiles */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:10px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:11px 13px;text-align:left;cursor:pointer;transition:border-color .12s}
.opt:hover{border-color:#c9cdd2}
.opt.sel{border-color:var(--teal);background:var(--teal-bg2)}
.opt .ot{font-weight:600;font-size:13px;display:flex;align-items:center;gap:7px}
.opt .od{font-size:11.5px;color:var(--mute);margin-top:3px;line-height:1.4}
.opt.sug{position:relative}
.opt.sug::after{content:'Suggested';position:absolute;top:-8px;right:10px;font-size:10px;background:var(--blue);color:#fff;padding:1px 7px;border-radius:8px}

/* provenance badges */
.pb{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:500;padding:1px 7px;border-radius:5px;white-space:nowrap;vertical-align:1px}
.pb::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.pb-plat{background:var(--teal-bg);color:var(--teal-d)}
.pb-calc{background:var(--blue-bg);color:var(--blue)}
.pb-entry{background:var(--amber-bg);color:var(--amber)}
.pb-ref{background:#eef0f2;color:#4b5563}
.pb-ev{background:var(--coral-bg);color:var(--coral)}
.pb-def{background:var(--coral-bg);color:var(--coral)}

/* notices */
.note{display:flex;gap:10px;padding:11px 14px;border-radius:8px;font-size:12.5px;line-height:1.55;margin:10px 0}
.note .i{flex-shrink:0;font-weight:700}
.n-info{background:var(--blue-bg2);color:#1e3a6b;border:1px solid rgba(24,95,165,.18)}
.n-warn{background:var(--amber-bg2);color:#6b4410;border:1px solid rgba(166,102,15,.22)}
.n-bad{background:var(--coral-bg2);color:#7a2e15;border:1px solid rgba(153,60,29,.22)}
.n-ok{background:var(--teal-bg2);color:#0b5c48;border:1px solid rgba(29,158,117,.22)}

/* help drawer */
details.help{margin-top:10px;border:1px solid var(--line);border-radius:8px;background:#fcfcfc}
details.help summary{cursor:pointer;padding:9px 13px;font-size:12.5px;font-weight:600;color:var(--blue);list-style:none;display:flex;align-items:center;gap:7px}
details.help summary::-webkit-details-marker{display:none}
details.help summary::before{content:'?';width:17px;height:17px;border-radius:50%;background:var(--blue-bg);color:var(--blue);font-size:11px;display:flex;align-items:center;justify-content:center}
details.help[open] summary{border-bottom:1px solid var(--line)}
details.help .hb{padding:12px 14px;font-size:12.5px;color:var(--ink2);line-height:1.6}
details.help .hb p{margin-bottom:8px}
details.help .hb ul{margin:0 0 8px 18px}
details.help .hb li{margin-bottom:4px}
.src{font-size:11px;color:var(--faint)}

/* tables */
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{text-align:left;font-weight:600;font-size:11px;color:var(--mute);padding:7px 8px;border-bottom:1.5px solid var(--line);vertical-align:bottom}
table.t td{padding:7px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t tr:last-child td{border-bottom:none}
table.t .r{text-align:right}
table.t .c{text-align:center}
table.t .num{font-family:var(--mono);font-size:12px}
table.t tfoot td{border-top:1.5px solid var(--line);font-weight:600}
table.t input[type=number],table.t input[type=text],table.t select{width:100%;border:1px solid var(--line);border-radius:5px;padding:4px 6px;background:#fff;font-size:12px}
table.t input[type=number]{font-family:var(--mono);text-align:right}
.tw{overflow-x:auto}

/* fields */
.f{margin-bottom:12px}
.fl{font-size:12.5px;font-weight:500;color:var(--ink2);margin-bottom:4px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.fi{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:#fff}
.fi[readonly]{background:var(--teal-bg2);color:var(--teal-d)}
.fh{font-size:11.5px;color:var(--mute);margin-top:4px;line-height:1.45}
.fu{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#fff}
.fu input{flex:1;border:none;padding:8px 10px;font-family:var(--mono);outline:none;min-width:0}
.fu span{padding:8px 10px;background:#fafafa;border-left:1px solid var(--line);font-size:11.5px;color:var(--mute);white-space:nowrap}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;cursor:pointer;line-height:1.5}
.chk input{margin-top:3px;accent-color:var(--teal)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:500;font-size:13px}
.btn:hover{background:#fafafa}
.btn-p{background:var(--teal);border-color:var(--teal);color:#fff}
.btn-p:hover{background:var(--teal-d)}
.btn-c{background:var(--coral);border-color:var(--coral);color:#fff}
.btn-g{border-color:transparent;background:transparent;color:var(--teal-d)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}

/* tags */
.tag{display:inline-flex;align-items:center;font-size:11px;font-weight:500;padding:1px 8px;border-radius:10px;white-space:nowrap}
.t-teal{background:var(--teal-bg);color:var(--teal-d)}
.t-amber{background:var(--amber-bg);color:var(--amber)}
.t-coral{background:var(--coral-bg);color:var(--coral)}
.t-blue{background:var(--blue-bg);color:var(--blue)}
.t-gray{background:var(--line2);color:var(--mute)}

/* obligation register */
.obl{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.oc{border:1px solid var(--line);border-radius:10px;padding:14px 15px;background:#fff;display:flex;flex-direction:column;gap:6px}
.oc .ok{font-size:11px;font-weight:600}
.oc .ot{font-family:var(--head);font-weight:700;font-size:14.5px}
.oc .od{font-size:12px;color:var(--mute);flex:1}
.oc .ox{font-size:11.5px;color:var(--ink2);font-family:var(--mono)}
.oc.dom{border-top:3px solid var(--blue)}
.oc.eu{border-top:3px solid var(--coral)}
.oc.uk{border-top:3px solid var(--amber)}

/* CN picker */
.cn-search{display:flex;gap:8px;margin-top:10px}
.cn-list{max-height:280px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;margin-top:8px;background:#fff}
.cn-g{font-size:11px;font-weight:600;color:var(--mute);padding:8px 12px 4px;background:#fafafa;position:sticky;top:0;border-bottom:1px solid var(--line2)}
.cn-i{display:grid;grid-template-columns:22px 92px 1fr auto;gap:8px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line2);cursor:pointer;font-size:12.5px}
.cn-i:hover{background:#fafcfb}
.cn-i input{accent-color:var(--teal)}
.cn-i code{font-family:var(--mono);font-size:12px;color:var(--ink)}
.cn-sel{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cn-chip{display:inline-flex;gap:6px;align-items:center;font-size:12px;background:var(--coral-bg2);border:1px solid rgba(153,60,29,.25);color:var(--coral);border-radius:20px;padding:3px 6px 3px 10px}
.cn-chip button{border:none;background:none;cursor:pointer;color:var(--coral);font-size:14px;line-height:1;padding:0 3px}

/* category card */
.cat{border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden;background:#fff}
.cat-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;background:#fbfbfb;border-bottom:1px solid var(--line)}
.cat-h .cn{font-family:var(--head);font-weight:700;font-size:14px}
.cat-b{padding:12px 16px}
.kv{display:grid;grid-template-columns:170px 1fr;gap:6px 14px;font-size:12.5px}
.kv dt{color:var(--mute)}
.kv dd{color:var(--ink)}
@media(max-width:600px){.kv{grid-template-columns:1fr}}

/* chain diagram */
.chain{display:flex;align-items:stretch;gap:0;overflow-x:auto;max-width:100%;padding:6px 0 10px}
.cnode{min-width:128px;border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;font-size:12px;position:relative}
.cnode .nt{font-weight:600;font-size:12.5px}
.cnode .nv{font-family:var(--mono);font-size:12px;margin-top:3px}
.cnode .nm{font-size:10.5px;color:var(--mute);margin-top:2px}
.cnode.in{border-color:rgba(29,158,117,.5);background:var(--teal-bg2)}
.cnode.buy{border-color:rgba(166,102,15,.45);background:var(--amber-bg2)}
.cnode.def{border-color:rgba(153,60,29,.5);background:var(--coral-bg2)}
.cnode.good{border-color:var(--ink);border-width:2px}
.carr{display:flex;align-items:center;padding:0 6px;color:var(--faint);font-size:16px}

/* big numbers */
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px 15px}
.stat .sl{font-size:11.5px;color:var(--mute)}
.stat .sv{font-family:var(--head);font-weight:800;font-size:22px;line-height:1.15;margin-top:3px}
.stat .su{font-size:11px;color:var(--faint);font-family:var(--mono)}
.stat.hi{border-color:rgba(153,60,29,.35);background:var(--coral-bg2)}
.stat.hi .sv{color:var(--coral)}
.stat.ok .sv{color:var(--teal-d)}

/* formula strip */
.eq{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap;margin:10px 0}
.eq .term{flex:1 1 104px;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fafafa;text-align:center}
.eq .term .tl{font-size:10.5px;color:var(--mute);line-height:1.3;min-height:27px}
.eq .term .tv{font-family:var(--mono);font-size:15px;font-weight:500;margin-top:3px}
.eq .op{display:flex;align-items:center;color:var(--faint);font-size:15px}
.eq .term.out{background:var(--coral-bg2);border-color:rgba(153,60,29,.3)}
.eq .term.out .tv{color:var(--coral);font-weight:600}

/* timeline */
.months{max-width:100%;display:grid;grid-template-columns:repeat(15,1fr);gap:2px;margin:10px 0 4px}
.mo{height:28px;border-radius:3px;font-size:9.5px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--mono)}
.mo.fyA{background:#9bb7d4}.mo.fyB{background:var(--blue)}
.mo.cy{outline:2px solid var(--coral);outline-offset:-2px}
.mlab{display:grid;grid-template-columns:repeat(15,1fr);gap:2px;font-size:10px;color:var(--mute);text-align:center}

/* binder */
.bi{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:#fff}
.bi .bx{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;margin-top:1px}
.bi.ok .bx{background:var(--teal-bg);color:var(--teal-d)}
.bi.miss .bx{background:var(--amber-bg);color:var(--amber)}
.bi.bad .bx{background:var(--coral-bg);color:var(--coral)}
.bi .bt{font-weight:500;font-size:12.5px}
.bi .bs{font-size:11.5px;color:var(--mute);margin-top:1px}
.bi .ba{margin-left:auto;flex-shrink:0;display:flex;gap:6px;align-items:center}

/* decision tree rows */
.dt-row{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.6fr;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2);font-size:12.5px}
.dt-row.h{font-size:11px;color:var(--mute);font-weight:600;border-bottom:1.5px solid var(--line)}
@media(max-width:760px){.dt-row{grid-template-columns:1fr}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:none;background:#fff;padding:4px 10px;font-size:12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:#fff}

.empty{padding:30px;text-align:center;color:var(--mute);font-size:13px}
.mono{font-family:var(--mono)}
.muted{color:var(--mute)}
.small{font-size:11.5px}
.mt{margin-top:12px}
.mb0{margin-bottom:0}
</style>
</head>
<body>
<header id="top">
  <div class="brand">TerraCAP<small>Carbon market compliance</small></div>
  <span class="demo-flag">Demo data — fictional installation</span>
  <div class="chips" id="chips"></div>
</header>
<div id="app">
  <nav id="nav" aria-label="Workflow"></nav>
  <main id="main"></main>
</div>
<script>
/* ════════════════════════════════════════════════════════════════════════
   TerraCAP — Carbon Market Compliance (v3)
   Reference data, platform data (demo), state and calculation engines.

   Sources for the CBAM reference data:
   - Regulation (EU) 2023/956 as amended by (EU) 2025/2083 — Annex I goods,
     Annex II (goods counted on direct emissions only), Annex III (exempt countries)
   - Methodology Act, Implementing Regulation (EU) 2025/2547 — aggregated goods
     categories, system boundaries, precursors
   - Default Values Act, Implementing Regulation (EU) 2025/2621 — production
     route codes (A)–(L), default values and mark-ups (10% / 20% / 30%; 1% fertilisers)
   - Free Allocation Adjustment Act, Implementing Regulation (EU) 2025/2620
   - Commission Guidance No. 1 (14 Aug 2026) and Guidance No. 5d (iron and steel)
   Numeric defaults and benchmarks below are ILLUSTRATIVE placeholders and are
   labelled as such in the UI. Replace with the Annex values before client use.
   ════════════════════════════════════════════════════════════════════════ */

/* ---------- Production route codes (Default Values Act 2025/2621) ---------- */
const ROUTES = {
  A:'Grey clinker / cement', B:'White clinker / cement',
  C:'Carbon steel — BF/BOF', D:'Carbon steel — DRI/EAF', E:'Carbon steel — scrap/EAF',
  F:'Low-alloy steel — BF/BOF', G:'Low-alloy steel — DRI/EAF', H:'Low-alloy steel — scrap/EAF',
  J:'High-alloy steel — EAF', K:'Primary aluminium', L:'Secondary aluminium'
};

/* ---------- Aggregated goods categories ----------
   indirect: are indirect emissions in scope for this category (i.e. NOT in Annex II)?
   precursors: relevant precursors (categories) per the Methodology Act / Guidance 5d
   routes: route codes that determine the default value and CBAM benchmark          */
const CATS = {
  /* iron & steel */
  sinter:     {sector:'steel', name:'Sintered ore', cn:'2601 12 00', indirect:true,  routes:[], precursors:[],
               boundary:'Pellet and sinter production, including emissions control.',
               note:'The one iron & steel category whose indirect emissions are in scope. Pellets fall here too (agglomerated iron ores).'},
  pig_iron:   {sector:'steel', name:'Pig iron', cn:'7201; part of 7205', indirect:false, routes:[], precursors:['hydrogen','sinter','femn','fecr','feni','pig_iron','dri'],
               boundary:'Blast furnace or smelting reduction, with related processes.',
               note:'Coke is not a CBAM good and therefore not a precursor, but the coke you burn counts as direct emissions inside this boundary.'},
  femn:       {sector:'steel', name:'Ferro-manganese (FeMn)', cn:'7202 11; 7202 19', indirect:false, routes:[], precursors:['sinter'], boundary:'EAF reductive smelting.'},
  fecr:       {sector:'steel', name:'Ferro-chromium (FeCr)',  cn:'7202 41; 7202 49', indirect:false, routes:[], precursors:['sinter'], boundary:'EAF reductive smelting.'},

/* ---------- derived setup flags ---------- */
function flags(){
  const s = S.setup;
  const c = s.country;
  const exemptCountry = c==='EU' || c==='EFTA';
  const india = c==='IN';
  const hasDom = india && (s.regime==='pat'||s.regime==='ccts'||s.regime==='both');
  const pat = india && (s.regime==='pat'||s.regime==='both');
  const ccts = india && (s.regime==='ccts'||s.regime==='both');
  const eu = !exemptCountry && s.eu===true && s.cns.length>0;
  const uk = c!=='GB' && s.uk===true && s.cns.length>0;
  return {india, exemptCountry, hasDom, pat, ccts, eu, uk};
}

/* ════════════════════════════════════════════════════════════════════════
   DOMESTIC ENGINE — CCTS GEI and PAT SEC
   ════════════════════════════════════════════════════════════════════════ */
function domCalc(){
  const P = PLATFORM, d = S.dom;
  const scope1 = P.streams.reduce((a,s)=>a+s.tco2,0);
  const cctsEF = 0.727;                                   /* latest CEA average grid emission factor — CCTS Procedure v1.0 §4(4)(vii); placeholder value */
  const scope2 = P.elec.gridMWh * cctsEF;
  const crude = d.eq.crude ?? P.prod.crude_steel;
  const eqProd = crude + d.eq.sinterSold * d.eq.sinterSoldFactor + d.eq.billetAdj;
  const gei = (scope1 + scope2) / eqProd;
  /* PAT: energy in toe */
  const fuelToe = P.streams.filter(s=>s.gcv>0).reduce((a,s)=>a + s.qty*1000*s.gcv/1e7, 0);
  const gridToe = P.elec.gridMWh*1000*d.patGridKcal/1e7;
  const toe = fuelToe + gridToe;
  const sec = toe / eqProd;
  const cctsGap = (gei - d.target.ccts) * eqProd;       /* +ve = shortfall, CCCs to buy */
  const patGap  = (sec - d.target.pat) * eqProd;        /* +ve = shortfall in toe → ESCerts to buy */
  return {scope1, scope2, cctsEF, eqProd, gei, fuelToe, gridToe, toe, sec, cctsGap, patGap, crude};
}

/* ════════════════════════════════════════════════════════════════════════
   CBAM ENGINE
   Builds production processes from the selected goods and the in-house
   upstream processes, then resolves specific embedded emissions in
   dependency order:
     SEE_p = (attributed direct_p + attributed indirect_p[if in scope]
              + Σ precursor qty × SEE_precursor) ÷ activity level_p
   Obligation per tonne (Guidance No. 1, §2.4.2):
     max[0 ; SEE − SEFA − SECPP / RP],  SEFA = benchmark × CBAM factor
   ════════════════════════════════════════════════════════════════════════ */
const STEEL_ORDER = ['sinter','femn','fecr','feni','pig_iron','dri','crude_steel','products'];

function processes(){
  const cats = selectedCats();
  const set = new Set(cats);
  /* add in-house upstream processes the user has confirmed */
  Object.entries(S.cbam.inhouse).forEach(([k,v])=>{ if(v && CATS[k] && CATS[k].sector===(CATS[cats[0]]||{}).sector) set.add(k); });
  const order = STEEL_ORDER.concat(Object.keys(CATS).filter(k=>!STEEL_ORDER.includes(k)));
  return order.filter(k=>set.has(k));
}

function seedCbam(){
  const P = PLATFORM, c = S.cbam;
  processes().forEach(k=>{
    if(c.activity[k]==null) c.activity[k] = P.prod[k] ?? 0;
    if(c.alloc[k]==null) c.alloc[k] = P.streams.filter(s=>s.proc===k).reduce((a,s)=>a+s.tco2,0);
    if(!c.prec[k]){
      const seeds = {
        pig_iron:[{cat:'sinter',src:'own',qty:4050000,basis:'actual'},{cat:'sinter',src:'buy',qty:P.purchased.pellets,basis:'default',label:'Purchased pellets'}],
        crude_steel:[{cat:'pig_iron',src:'own',qty:2950000,basis:'actual'},{cat:'dri',src:'buy',qty:P.purchased.dri,basis:'supplier',see:2.35,label:'Purchased DRI (coal-based)'},{cat:'femn',src:'buy',qty:P.purchased.ferroalloys,basis:'default',label:'Ferro-alloys'}],
        products:[{cat:'crude_steel',src:'own',qty:2900000,basis:'actual'}]
      };
      c.prec[k] = (seeds[k]||[]).map(x=>({...x}));
    }
  });
  selectedCats().forEach(k=>{
    if(CATS[k].routes.length && !c.route[k]) c.route[k]=CATS[k].routes[0];
  });
  S.setup.cns.forEach(code=>{
    if(c.exportQty[code]==null) c.exportQty[code] = code==='7208'?120000 : code==='7207'?30000 : 10000;
  });
}

function defaultSEE(cat){
  const base = REF.defaults[cat] ?? 1;
  const mu = CATS[cat] && CATS[cat].sector==='fert' ? 0.01 : (REF.markup[S.cbam.year] ?? 0.30);
  return base*(1+mu);
}

function seeAll(){
  const procs = processes(), c = S.cbam, out = {};
  const indirectFor = k => {
    if(!CATS[k].indirect) return 0;
    if(k==='sinter') return PLATFORM.elec.sinterMWh * REF.gridEF_IN_cbam;
    return 0;
  };
  procs.forEach(k=>{
    const act = c.activity[k] || 0;
    const direct = c.alloc[k] || 0;
    const ind = indirectFor(k);
    let precDir=0, precInd=0, nDef=0, nAll=0, nDefUp=0;
    const lines = (c.prec[k]||[]).map(p=>{
      let see, dPart, iPart;
      if(p.src==='own' && out[p.cat]){ see = out[p.cat].see; dPart = out[p.cat].dirPerT; iPart = out[p.cat].indPerT; nDefUp += out[p.cat].nDef; }
      else if(p.basis==='default'){ see = defaultSEE(p.cat); dPart=see; iPart=0; nDef++; }
      else { see = p.see ?? REF.defaults[p.cat]; dPart=see; iPart=0; }
      nAll++;
      precDir += p.qty * dPart; precInd += p.qty * iPart;
      return {...p, seeUsed:see, contrib:p.qty*see};
    });
    const dirPerT = act ? (direct + precDir)/act : null;
    const indPerT = act ? (ind + precInd)/act : null;
    out[k] = {act, direct, ind, precDir, precInd, lines, dirPerT, indPerT, see: dirPerT==null?null:dirPerT+indPerT,
              ownDirPerT: act? direct/act : null, nDef: nDef + nDefUp, nAll};
  });
  return out;
}

function obligation(cat, see){
  const route = S.cbam.route[cat] || '_';
  const bm = (REF.bench[cat]||{})[route] ?? (REF.bench[cat]||{})._ ?? 0;
  const cf = REF.cbamFactor[S.cbam.year] ?? 0;
  const sefa = bm * cf;
  /* Article 9 — carbon price effectively paid, per tCO2e, converted to € */
  const a = S.cbam.a9;
  const totalEm = domCalc().scope1 + domCalc().scope2;
  const paidINR = Math.max(0, a.cccBought * a.cccPrice - a.rebate);
  const effPerT = totalEm ? (paidINR / a.fx) / totalEm : 0;      /* €/tCO2e effectively paid, spread over all emissions */
  const secpp = effPerT * (see||0);
  const anyDefault = Object.values(S.cbam.prec).flat().some(p=>p.basis==='default');
  const secppEligible = !anyDefault && a.route!=='none';
  const perT = Math.max(0, (see||0) - sefa - (secppEligible ? secpp/REF.certPrice : 0));
  return {bm, cf, sefa, effPerT, secpp, secppEligible, perT, route};
}

/* bubble allowed only if no precursor produced in the installation is sold separately (Guidance 5d) */
function bubbleAllowed(){
  return !Object.entries(S.cbam.sold).some(([k,v])=>v && S.cbam.inhouse[k]);
}

  <h1>Boundary</h1>
  <p class="lede">You don’t design a boundary here — you reproduce the one your target was set on, and record every change since. A verifier’s first test is whether this year’s boundary matches the baseline. A mismatch makes the intensity incomparable to the target, however good the data is.</p>

  </div>

  <div class="card">

    <div class="dt-row h"><div>Unit</div><div>In the baseline?</div><div>This year</div><div>Guidance</div></div>

/* ════════════════════════════════════════════════════════════════════════
   CBAM — PRODUCTION PROCESSES
   ════════════════════════════════════════════════════════════════════════ */
function sProcess(){
  const c=S.cbam, P=PLATFORM, procs=processes();
  const sector=(CATS[selectedCats()[0]]||{}).sector;
  const upstream = Object.keys(CATS).filter(k=>CATS[k].sector===sector);
  const allowBubble = bubbleAllowed();
  if(!allowBubble && c.approach==='bubble') c.approach='separate';
  const cppT = P.streams.filter(s=>s.proc==='cpp').reduce((a,s)=>a+s.tco2,0);
  const attributed = procs.reduce((a,k)=>a+(c.alloc[k]||0),0);
  const scope1 = P.streams.reduce((a,s)=>a+s.tco2,0);
  const unassigned = scope1 - attributed - cppT;
  return `
  <div class="crumb">EU CBAM · operator</div>
  <h1>Production processes</h1>
  <p class="lede">CBAM attributes your installation’s emissions to production processes, one per aggregated goods category you make. A good’s embedded emissions are its own process’s emissions plus those of the precursors it consumes.</p>

  <div class="card">
    <h2>Which upstream goods do you make on site?</h2>
    <p class="sub">${PB.plat('Asset register and production MIS')} Pre-ticked from your production data. Anything made here becomes its own process; anything bought in becomes a purchased precursor.</p>
    <table class="t" style="max-width:640px"><thead><tr><th>Category</th><th class="c">Made on site</th><th class="c">Also sold separately</th></tr></thead><tbody>
    ${upstream.map(k=>`<tr><td>${CATS[k].name}${selectedCats().includes(k)?' <span class="tag t-coral">exported to EU</span>':''}</td>
      <td class="c"><input type="checkbox" ${c.inhouse[k]||selectedCats().includes(k)?'checked':''} ${selectedCats().includes(k)?'disabled':''} onchange="S.cbam.inhouse['${k}']=this.checked;render()"></td>
      <td class="c"><input type="checkbox" ${c.sold[k]?'checked':''} onchange="S.cbam.sold['${k}']=this.checked;render()"></td></tr>`).join('')}
    </tbody></table>
  </div>

  <div class="card">
    <h2>One process or several?</h2>
    <div class="opts" style="grid-template-columns:1fr 1fr">
      <button class="opt ${c.approach==='separate'?'sel':''}" onclick="S.cbam.approach='separate';render()"><div class="ot">Separate processes</div><div class="od">Each category gets its own attributed emissions and activity level. Precursors flow between them. Always allowed.</div></button>
      <button class="opt ${c.approach==='bubble'?'sel':''}" ${allowBubble?'':'disabled style="opacity:.5;cursor:not-allowed"'} onclick="S.cbam.approach='bubble';render()"><div class="ot">One joint process (“bubble”)</div><div class="od">All site emissions attributed to the final good. Simpler, but only allowed if no precursor made here is sold separately.</div></button>
    </div>
    ${!allowBubble?`<div class="note n-info"><span class="i">i</span><div><b>Bubble not available.</b> You sell ${Object.entries(c.sold).filter(([k,v])=>v&&c.inhouse[k]).map(([k])=>CATS[k].name.toLowerCase()).join(' and ')} separately. Guidance 5d allows a joint process only where none of the precursors produced in the installation are sold — otherwise the sold intermediate would carry no emissions of its own.</div></div>`:''}
  </div>

  <div class="card">
    <h2>Attribute direct emissions</h2>
    <p class="sub">${PB.plat('Source-stream process tags')} TerraCAP splits Scope 1 using the process tag on each source stream. Override a figure only with metering evidence — the split is what the verifier samples.</p>
    <div class="tw"><table class="t">
      <thead><tr><th>Process</th><th class="r">Activity level, t</th><th class="r">Attributed direct, tCO₂</th><th class="r">Direct per t (own)</th><th>Source</th></tr></thead>
      <tbody>${procs.map(k=>`<tr><td>${CATS[k].name}</td>
        <td class="r"><input type="number" value="${c.activity[k]||0}" onchange="S.cbam.activity['${k}']=+this.value;render()"></td>
        <td class="r"><input type="number" value="${Math.round(c.alloc[k]||0)}" onchange="S.cbam.alloc['${k}']=+this.value;render()"></td>
        <td class="r num">${c.activity[k]?fmt((c.alloc[k]||0)/c.activity[k],3):'—'}</td>
        <td>${PB.plat('Production MIS · source-stream tags')}</td></tr>`).join('')}
        <tr><td>Captive power plant</td><td class="r muted">—</td><td class="r num">${fmt(cppT)}</td><td class="r muted">—</td><td><span class="tag t-gray">Excluded — electricity generation</span></td></tr>
      </tbody>
      <tfoot><tr><td>Unassigned Scope 1</td><td></td><td class="r num" style="color:${Math.abs(unassigned)>1000?'var(--coral)':'var(--teal-d)'}">${fmt(unassigned)}</td><td colspan="2" class="small">${Math.abs(unassigned)>1000?'Must be zero — every tonne belongs to a process or to the power plant.':'Reconciles to site Scope 1.'}</td></tr></tfoot>
    </table></div>
    <div class="note n-info"><span class="i">i</span><div><b>Why the power plant drops out.</b> Burning coal and blast-furnace gas to make electricity is electricity generation. For goods listed in Annex II — all iron and steel except sintered ore — electricity emissions don’t count. The ${fmt(cppT/1e6,2)} Mt from the captive plant is in your CCTS Scope 1 but not in your CBAM direct emissions. For sintered ore, the electricity it consumes is counted as indirect emissions.</div></div>
  </div>
  <div class="btns"><button class="btn btn-p" onclick="go('c_prec')">Precursors</button></div>`;
}

/* ════════════════════════════════════════════════════════════════════════
   CBAM — PRECURSORS
   ════════════════════════════════════════════════════════════════════════ */
function precEdit(k,i,field,v){ const p=S.cbam.prec[k][i]; p[field]=(field==='qty'||field==='see')?+v:v; if(field==='src'&&v==='own') p.basis='actual'; render(); }
function precAdd(k){ const allowed=CATS[k].precursors; S.cbam.prec[k].push({cat:allowed[0],src:'buy',qty:0,basis:'default'}); render(); }
function precDel(k,i){ S.cbam.prec[k].splice(i,1); render(); }
function sPrec(){
  const c=S.cbam, procs=processes(), R=seeAll();
  const anyDefault = Object.values(c.prec).flat().some(p=>p.basis==='default');
  return `
  <div class="crumb">EU CBAM · operator</div>
  <h1>Precursors</h1>
  <p class="lede">A precursor is an input that is itself a CBAM good. Only the precursors listed for each category count. Coke, purchased lime and scrap are not CBAM goods, so they never appear here — see the end of this page for how they are handled.</p>
  ${procs.filter(k=>CATS[k].precursors.length).map(k=>{const C=CATS[k];return `
  <div class="card">
    <div class="row" style="justify-content:space-between"><h2>${C.name} process</h2><span class="small muted">Allowed precursors: ${C.precursors.map(p=>CATS[p].name).join(', ')}</span></div>
    <p class="sub">What this step does: ${C.boundary} Every input below is consumed in this process and converted into ${C.name.toLowerCase()}; its embedded emissions are carried into each tonne produced.</p>
    <div class="tw"><table class="t">
      <thead><tr><th style="width:24%">Precursor</th><th style="width:15%">Source</th><th class="r" style="width:13%">Consumed, t</th><th style="width:19%">Data basis</th><th class="r" style="width:12%">SEE used</th><th class="r" style="width:13%">tCO₂e carried</th><th></th></tr></thead>
      <tbody>${(c.prec[k]||[]).map((p,i)=>{const L=R[k].lines[i];return `<tr>
        <td><select onchange="precEdit('${k}',${i},'cat',this.value)">${C.precursors.map(x=>`<option value="${x}" ${p.cat===x?'selected':''}>${CATS[x].name}</option>`).join('')}</select>${p.label?`<div class="small muted">${p.label}</div>`:''}</td>
        <td><select onchange="precEdit('${k}',${i},'src',this.value)"><option value="own" ${p.src==='own'?'selected':''}>Made on site</option><option value="buy" ${p.src==='buy'?'selected':''}>Purchased</option></select></td>
        <td class="r"><input type="number" value="${p.qty}" onchange="precEdit('${k}',${i},'qty',this.value)"><div style="margin-top:3px">${p.src==='buy'?PB.plat('SAP MM goods receipts — purchases issued to this process, CY'+S.cbam.year):PB.plat('Production MIS — internal transfers to this process')}</div></td>
        <td>${p.src==='own'?`${PB.calc()} <span class="small muted">from own process</span>`:
          `<select onchange="precEdit('${k}',${i},'basis',this.value)"><option value="supplier" ${p.basis==='supplier'?'selected':''}>Supplier — verified</option><option value="default" ${p.basis==='default'?'selected':''}>Default value</option></select>`}</td>
        <td class="r">${p.src==='buy'&&p.basis==='supplier'?`<input type="number" step="0.01" value="${p.see??''}" onchange="precEdit('${k}',${i},'see',this.value)">`:`<span class="num">${fmt(L.seeUsed,3)}</span>`}
          ${p.basis==='default'&&p.src==='buy'?`<div>${PB.def()}</div>`:''}</td>
        <td class="r num">${fmt(L.contrib)}</td>
        <td><button class="btn btn-g" style="padding:2px 6px" onclick="precDel('${k}',${i})" aria-label="Remove">×</button></td></tr>`;}).join('')}
      </tbody></table></div>
    <div class="row mt"><button class="btn" onclick="precAdd('${k}')">Add precursor</button>
      ${(c.prec[k]||[]).some(p=>p.src==='buy'&&p.basis==='supplier')?`<span class="small muted">Supplier values need the supplier’s verification report covering the period the precursor was produced.</span>`:''}</div>
  </div>`;}).join('')}

  ${anyDefault?`<div class="note n-bad"><span class="i">!</span><div><b>Some precursors are on default values.</b> Defaults carry a ${Math.round((REF.markup[c.year]??.3)*100)}% mark-up in ${c.year}, rising after that. On TerraCAP’s current reading of the draft rules, any default in the chain also takes away your customer’s Article 9 carbon-price deduction. Ask each supplier for verified data and the verifier’s report covering the year the precursor was produced.</div></div>`:''}

  <div class="card">
    <h2>Inputs that are not precursors</h2>
    <table class="t">
      <tr><td style="width:22%"><b>Coke</b></td><td>Not a CBAM good. Coke you make on site sits inside the pig-iron boundary, and the coke and coal you burn are direct emissions there. Purchased coke carries no embedded emissions into CBAM.</td></tr>
      <tr><td><b>Lime, dolomite</b></td><td>Not CBAM goods. Calcination in your own lime kilns is a direct process emission of the process that uses the lime. Purchased lime carries nothing.</td></tr>
      <tr><td><b>Scrap</b></td><td>Post-consumer scrap has zero embedded emissions. Its carbon is handled in the mass balance. ${fmt(PLATFORM.purchased.scrap)} t this year ${PB.plat('SAP MM')}.</td></tr>
      <tr><td><b>Electricity</b></td><td>Not a precursor. Counted as indirect emissions only where the category is outside Annex II.</td></tr>
    </table>
    <p class="src mt">Commission Guidance No. 5d, iron and steel.</p>
  </div>
  <div class="btns"><button class="btn btn-p" onclick="go('c_see')">See embedded emissions</button></div>`;
}

/* ════════════════════════════════════════════════════════════════════════
   CBAM — EMBEDDED EMISSIONS
   ════════════════════════════════════════════════════════════════════════ */
function chainHTML(k,R,depth=0){
  const r=R[k]; if(!r||depth>4) return '';
  const own=(S.cbam.prec[k]||[]).filter(p=>p.src==='own'&&R[p.cat]).map(p=>p.cat);
  const bought=(S.cbam.prec[k]||[]).filter(p=>p.src==='buy');
  const up = own.length? chainHTML(own[0],R,depth+1)+'<div class="carr">→</div>' : '';
  const buys = bought.length? `<div style="display:flex;flex-direction:column;gap:4px;margin-right:6px">${bought.map(b=>`<div class="cnode ${b.basis==='default'?'def':'buy'}" style="min-width:118px;padding:6px 9px"><div class="nt" style="font-size:11.5px">${b.label||CATS[b.cat].name}</div><div class="nm">purchased · ${fmt(b.qty/1000)} kt · ${b.basis==='default'?'default value':'supplier value'}</div><div class="nm">→ consumed in ${CATS[k].name.toLowerCase()} process</div></div>`).join('')}</div>` : '';
  return `${up}${buys}<div class="cnode in ${depth===0?'good':''}"><div class="nt">${CATS[k].name}</div><div class="nv">${fmt(r.see,3)} t/t</div><div class="nm">own ${fmt(r.ownDirPerT,3)} + carried</div></div>`;
}
function sSEE(){
  const R=seeAll(), cats=selectedCats(), f=flags();
  const D=domCalc();
  const top=cats[0], rt=R[top];
  return `
  <div class="crumb">EU CBAM · operator</div>
  <h1>Embedded emissions</h1>
  <p class="lede">Specific embedded emissions (SEE) per tonne, resolved upstream to downstream. For goods you report on actual values, these are the figures your customer receives.</p>

  ${cats.map(k=>{const r=R[k]; if(!r) return ''; const codes=S.setup.cns.filter(c=>(CN.find(x=>x[0]===c)||[])[2]===k);
    return `<div class="card">
      <div class="row" style="justify-content:space-between"><h2>${CATS[k].name} <span class="mono small muted">${codes.join(', ')}</span></h2>${r.nDef?`<span class="tag t-coral">${r.nDef} default input${r.nDef>1?'s':''}</span>`:'<span class="tag t-teal">All actual</span>'}</div>
      <p class="small muted" style="margin-bottom:4px">Green boxes are process steps at your site; amber are purchased inputs (red if on default values). Each arrow is a conversion step: the box on the left is consumed in the process on the right. Purchased quantities come from your SAP MM goods receipts in the ledger.</p>
      <div class="chain">${chainHTML(k,R)}</div>
      <div class="eq">
        <div class="term"><div class="tl">Own direct ÷ activity</div><div class="tv">${fmt(r.ownDirPerT,3)}</div></div><div class="op">+</div>
        <div class="term"><div class="tl">Precursors, direct</div><div class="tv">${fmt(r.precDir/r.act,3)}</div></div><div class="op">+</div>
        <div class="term"><div class="tl">Indirect ${CATS[k].indirect?'(in scope)':'(carried from sinter)'}</div><div class="tv">${fmt(r.indPerT,3)}</div></div><div class="op">=</div>
        <div class="term out"><div class="tl">SEE tCO₂e / t</div><div class="tv">${fmt(r.see,3)}</div></div>
      </div>
    </div>`;}).join('')}

  <div class="card">
    <h2>All processes</h2>
    <div class="tw"><table class="t"><thead><tr><th>Process</th><th class="r">Activity, t</th><th class="r">Own direct</th><th class="r">Precursors</th><th class="r">Indirect</th><th class="r">SEE, t/t</th></tr></thead>
    <tbody>${processes().map(k=>{const r=R[k];return `<tr><td>${CATS[k].name}</td><td class="r num">${fmt(r.act)}</td><td class="r num">${fmt(r.ownDirPerT,3)}</td><td class="r num">${fmt(r.precDir/r.act,3)}</td><td class="r num">${fmt(r.indPerT,3)}</td><td class="r num"><b>${fmt(r.see,3)}</b></td></tr>`;}).join('')}</tbody></table></div>
  </div>

  ${f.india&&f.ccts&&rt?`<div class="card">
    <h2>From your CCTS number to this one</h2>
    <p class="sub">Your EU customer’s verifier — and your own — will ask why the CBAM figure differs from the CCTS figure. TerraCAP takes out the parts it can calculate from the ledger; the rest depends on how your plant runs, so your team explains it.</p>
    <table class="t" style="max-width:720px"><tbody>
      <tr><td>CCTS GEI — site, per tonne of equivalent product, FY basis</td><td class="r num">${fmt(D.gei,3)}</td></tr>
      <tr><td>less Scope 2 grid electricity — not in scope for Annex II goods</td><td class="r num" style="color:var(--coral)">−${fmt(D.scope2/D.eqProd,3)}</td></tr>
      <tr><td>less captive power plant emissions — electricity generation</td><td class="r num" style="color:var(--coral)">−${fmt(PLATFORM.streams.filter(s=>s.proc==='cpp').reduce((a,s)=>a+s.tco2,0)/D.eqProd,3)}</td></tr>
      <tr><td>= site direct emissions excluding electricity, per tonne crude steel</td><td class="r num">${fmt((D.scope1-PLATFORM.streams.filter(s=>s.proc==='cpp').reduce((a,s)=>a+s.tco2,0))/D.eqProd,3)}</td></tr>
      <tr><td><b>Difference still to explain</b></td><td class="r num"><b>${fmt(rt.see-(D.scope1-PLATFORM.streams.filter(s=>s.proc==='cpp').reduce((a,s)=>a+s.tco2,0))/D.eqProd,3)}</b></td></tr>
      <tr style="font-weight:700"><td>CBAM SEE — ${CATS[top].name}, CY basis</td><td class="r num" style="color:var(--coral)">${fmt(rt.see,3)}</td></tr>
    </tbody></table>
    <div class="f mt"><div class="fl">Your explanation of the difference ${PB.entry('Only your team can explain this; it goes to your verifier')}</div>
      <textarea class="fi" rows="4" oninput="S.cbam.bridgeNote=this.value" placeholder="e.g. CBAM figure is per tonne of HR coil, after rolling yield losses; includes purchased pellets and DRI at supplier values; ...">${esc(S.cbam.bridgeNote||'')}</textarea>
      <div class="fh">The usual reasons — tick the ones that apply in your note: the CBAM figure is per tonne of a downstream good rather than crude steel, so yield losses raise it; purchased precursors are carried in at supplier or default values; electricity embedded in sinter is carried in; the periods differ (calendar year against April–March).</div></div>
    <p class="src mt">The CCTS and CBAM periods differ (FY vs CY). On ${PLATFORM.monthsCY} months of actuals the difference is small. In the final report TerraCAP reconciles on matched months.</p>
  </div>`:''}
  <div class="btns"><button class="btn btn-p" onclick="go('c_fa')">Free allocation & carbon price</button></div>`;
}

/* ════════════════════════════════════════════════════════════════════════
   CBAM — CUSTOMER COST & CARBON PRICE PAID
   ════════════════════════════════════════════════════════════════════════ */
function sCost(){
  const R=seeAll(), c=S.cbam, a=c.a9, f=flags();
  const rows = S.setup.cns.map(code=>{
    const k=(CN.find(x=>x[0]===code)||[])[2]; const see=R[k]?R[k].see:null; const o=obligation(k,see);
    const qty=c.exportQty[code]||0;
    const dflt = defaultSEE(k); const od = obligation(k,dflt);
    return {code,k,see,o,qty,certs:o.perT*qty,eur:o.perT*qty*REF.certPrice, dflt, dPerT: Math.max(0,dflt-od.sefa), dEur: Math.max(0,dflt-od.sefa)*qty*REF.certPrice};
  });
  const tot=rows.reduce((s,r)=>s+r.eur,0), totD=rows.reduce((s,r)=>s+r.dEur,0);
  return `
  <div class="crumb">EU CBAM · operator</div>
  <h1>Customer cost & carbon price</h1>
  <p class="lede">You pay nothing under EU CBAM. Your customer does, and this is what your data saves them. For each good the declarant surrenders <span class="mono">max[0; SEE − SEFA − SECPP ÷ RP]</span> certificates per tonne.</p>

  <div class="grid3">
    <div class="stat hi"><div class="sl">Customer cost — your verified data</div><div class="sv">€${fmt(tot/1e6,2)}M</div><div class="su">CY${c.year} · at €${REF.certPrice}/t</div></div>
    <div class="stat"><div class="sl">Customer cost — on default values</div><div class="sv">€${fmt(totD/1e6,2)}M</div><div class="su">incl. ${Math.round((REF.markup[c.year]??.3)*100)}% mark-up</div></div>
    <div class="stat ${totD>tot?'ok':''}"><div class="sl">What your verified data is worth to them</div><div class="sv">€${fmt((totD-tot)/1e6,2)}M</div><div class="su">a year — the case for paying you, not defaulting</div></div>
  </div>

  <div class="card mt">
    <h2>By CN code</h2>
    <div class="tw"><table class="t">
      <thead><tr><th>CN</th><th class="r">SEE</th><th class="r">Benchmark</th><th class="r">× CBAM factor</th><th class="r">= SEFA</th><th class="r">SECPP ÷ RP</th><th class="r">Certificates / t</th><th class="r">Tonnes to EU</th><th class="r">€</th></tr></thead>
      <tbody>${rows.map(r=>`<tr><td class="mono">${r.code}</td><td class="r num">${fmt(r.see,3)}</td><td class="r num">${fmt(r.o.bm,3)} <span class="small muted">${r.o.route!=='_'?'('+r.o.route+')':''}</span></td><td class="r num">${(r.o.cf*100).toFixed(1)}%</td><td class="r num">${fmt(r.o.sefa,3)}</td>
        <td class="r num">${r.o.secppEligible?fmt(r.o.secpp/REF.certPrice,4):'<span class="tag t-coral">not eligible</span>'}</td><td class="r num"><b>${fmt(r.o.perT,3)}</b></td>
        <td class="r"><input type="number" value="${r.qty}" onchange="S.cbam.exportQty['${r.code}']=+this.value;render()" style="width:100px"></td><td class="r num">${Math.round(r.eur).toLocaleString('en-GB')}</td></tr>`).join('')}</tbody>
    </table></div>
    <p class="small muted mt">${PB.ref()} Benchmarks, defaults and the certificate price shown are illustrative placeholders. Load the values from Implementing Regulations (EU) 2025/2620 and 2025/2621 and the Commission’s published certificate price before sharing any figure with a customer. The default-value comparison uses the same benchmark; the Free Allocation Adjustment Act may apply a different one where default data is used.</p>
    <details class="help"><summary>Why the CBAM factor is 97.5%, not 2.5%</summary><div class="hb">
      <p>SEFA is the free allocation an EU producer would still receive for the same good: the CBAM benchmark times the CBAM factor, which is 97.5% in 2026 and falls to zero by 2034 as free allocation is phased out. Your customer pays on the part of your SEE above that line.</p>
      <p>An earlier version of this module multiplied total SEE by 2.5%. That understates the cost for any producer well above the benchmark — which is most BF-BOF and coal-DRI plants.</p>
    </div></details>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between"><h2>Carbon price paid in India (Article 9)</h2><span class="tag t-amber">Provisional</span></div>
    <p class="sub">If the plant pays a carbon price at home, your customer can deduct it. The carbon price report must be certified by an independent person. The Commission’s implementing act was published in draft in May 2026. Whether CCTS compliance counts as a price “effectively paid” is still open — especially where you met the target and bought nothing.</p>
    <div class="grid3">
      <div class="f"><div class="fl">CCCs bought for the period ${PB.entry('From ICM Registry statement')}</div><div class="fu"><input type="number" value="${a.cccBought}" onchange="S.cbam.a9.cccBought=+this.value;render()"><span>certs</span></div></div>
      <div class="f"><div class="fl">Average price paid ${PB.entry('From exchange contract notes')}</div><div class="fu"><input type="number" value="${a.cccPrice}" onchange="S.cbam.a9.cccPrice=+this.value;render()"><span>₹ / cert</span></div></div>
      <div class="f"><div class="fl">INR per EUR ${PB.ref()}</div><div class="fu"><input type="number" step="0.01" value="${a.fx}" onchange="S.cbam.a9.fx=+this.value;render()"><span>₹/€</span></div></div>
    </div>
    ${Object.values(c.prec).flat().some(p=>p.basis==='default')?`<div class="note n-bad"><span class="i">!</span><div><b>Deduction not available on current inputs.</b> Under the draft act, the deduction applies only where embedded emissions use verified actual values. Replace the default-value precursors first.</div></div>`
      :`<div class="note n-ok"><span class="i">✓</span><div>All inputs are actual values, so the deduction is not blocked on that ground. Effective price spread over site emissions: €${fmt(rows[0]?rows[0].o.effPerT:0,2)} / tCO₂e.</div></div>`}
  </div>
  <div class="btns"><button class="btn btn-p" onclick="go('c_report')">Report, verify, communicate</button></div>`;
}

/* ════════════════════════════════════════════════════════════════════════
   CBAM — REPORT, VERIFY, COMMUNICATE
   ════════════════════════════════════════════════════════════════════════ */
function dispatch(){ const R=seeAll(); S.cbam.dispatch.forEach(d=>d.state='Superseded'); S.cbam.dispatch.push({v:'v'+(S.cbam.dispatch.length+1), to:$('#dcust').value, date:new Date().toISOString().slice(0,10), see:R[selectedCats()[0]].see, state:'Current'}); render(); }
function sReport(){
  const c=S.cbam, R=seeAll();
  const anyDefault = Object.values(c.prec).flat().some(p=>p.basis==='default');

function goodSEE(g, R){
  const m=S.cbam.method[g.cn8]||'actual';
  if(m==='default') return {see:defaultSEE(g.cat), method:'default', nDef:1, indirect:0};
  const r=R[g.cat]; return {see:r?r.see:null, method:'actual', nDef:r?r.nDef:0, indirect:r?r.indPerT:0};

function cpCertified(){ const c=S.cbam.cp; return c.certified && c.certifier.trim() && c.ref.trim() && c.date; }
function addendumRequired(R){
  /* declarant-specific addendum: where embedded emissions of electricity are calculated on actual data (Guidance No. 1, p.12) */
  if(S.cbam.elecBasis!=='actual') return {req:false, why:'Electricity emissions use the Commission default factor, so no addendum is needed.'};
  const goods=selectedCN8().filter(g=>(S.cbam.method[g.cn8]||'actual')==='actual');
  const withInd=goods.filter(g=>R[g.cat] && R[g.cat].indPerT>0);
  return withInd.length ? {req:true, why:`Electricity emissions are calculated on actual data and are embedded in ${withInd.map(g=>g.cn8).join(', ')}. Each declarant needs its own addendum.`}
                        : {req:false, why:'Electricity is on actual data, but none of the goods supplied carries indirect emissions.'};
}

/* ---------- 4/6 · free allocation and carbon price (overrides v3) ---------- */
function obligation(cat, see, method){
  const route = S.cbam.route[cat] || '_';
  const bm = (REF.bench[cat]||{})[route] ?? (REF.bench[cat]||{})._ ?? 0;
  const cf = REF.cbamFactor[S.cbam.year] ?? 0;
  const sefa = bm * cf;
  const a = S.cbam.a9, D = domCalc();
  const totalEm = D.scope1 + D.scope2;
  const paidINR = Math.max(0, a.cccBought * a.cccPrice - a.rebate);
  const effPerT = totalEm ? (paidINR / a.fx) / totalEm : 0;
  const secpp = effPerT * (see||0);
  const anyDefault = Object.values(S.cbam.prec).flat().some(p=>p.basis==='default');
  const gates = {certified: !!cpCertified(), actual: method!=='default' && !anyDefault && !!S.cbam.ver.vr, paid: paidINR>0};
  const secppEligible = gates.certified && gates.actual && gates.paid;
  const rp = rpProvisional();
  const perT = Math.max(0, (see||0) - sefa - (secppEligible ? secpp/rp : 0));
  return {bm, cf, sefa, effPerT, secpp, secppEligible, gates, perT, route, rp};
}

          </tbody></table></div>`:`<p class="small muted mt">TerraCAP doesn’t yet carry the 8-digit list for ${h}. Enter each code; it is checked against the heading and flagged until verified in TARIC.</p>`}
          ${sel.filter(c=>!list.find(r=>r[0]===c)).map(c=>`<div class="row mt"><span class="tag t-amber mono">${c}</span><span class="small muted">entered manually — unverified</span>
            <div class="seg"><button class="${(S.cbam.method[c]||'actual')==='actual'?'on':''}" onclick="setMethod('${c}','actual')">Actual, verified</button><button class="${S.cbam.method[c]==='default'?'on':''}" onclick="setMethod('${c}','default')">Default</button></div>
            <button class="btn btn-g" onclick="toggleCN8('${h}','${c}')">Remove</button></div>`).join('')}
          ${CN8_COMPLETE[h]?`<p class="small muted mt">Complete list of 8-digit codes under ${h} (CN 2026). Tick every code you ship.</p>`:`<div class="row mt"><input id="${id}" class="fi mono" style="max-width:180px" placeholder="${h.replace(/\s/g,'').padEnd(8,'0').replace(/(\d{4})(\d{2})(\d{2})/,'$1 $2 $3')}"><button class="btn" onclick="addCN8('${h}')">Add code</button></div>`}`;}).join('')}
      </div></div>`;}).join('')}

  <div class="card">
    <h2>Actual or default — what changes</h2>
    <table class="t"><tbody>
      <tr><td style="width:150px"><b>Actual, verified</b></td><td>You monitor the good under your monitoring plan, the verifier signs it off for the year, and your customer uses your figure. Purchased precursors also need actual data from their producers, or a default for that precursor alone — set this per precursor on the Precursors screen.</td></tr>
      <tr><td><b>Default</b></td><td>Your customer uses the Commission default for the country and route, with the mark-up for the year. You still identify the installation and route. No verification is needed for that code, and no carbon-price deduction can be passed on.</td></tr>
    </tbody></table>
  </div>

  <div class="card">
    <h2>Codes that look in scope but are not, or are split</h2>
    <table class="t"><tbody>${EXCLUSIONS.map(e=>`<tr><td class="mono" style="width:260px">${e.code}</td><td>${e.note}</td></tr>`).join('')}</tbody></table>
  </div>

  <div class="card">
    <h2>Reporting period: calendar year ${S.cbam.year}</h2>
    <p class="sub">For an operator, the reporting period is the calendar year the goods were produced. Embedded emissions are the average over that year. TerraCAP builds CY${S.cbam.year} from the same monthly ledger that feeds your FY CCTS figures.</p>
    ${monthsStrip()}
    <label class="chk mt"><input type="checkbox" ${S.cbam.prodEvidence?'checked':''} onchange="S.cbam.prodEvidence=this.checked;render()">Link each dispatch to its production month (heat numbers, mill test certificates). This lets your customer show when the goods were actually produced if that matters for their reporting period.</label>
  </div>
  <div class="btns"><button class="btn btn-p" onclick="go('c_process')">Set up production processes</button></div>`;
}

/* ════════════════════════════════════════════════════════════════════════
   FREE ALLOCATION & CARBON PRICE (replaces "customer cost")
   ════════════════════════════════════════════════════════════════════════ */
function sFA(){
  const R=seeAll(), c=S.cbam, a=c.a9, P=priceRef();
  const rows=selectedCN8().map(g=>{ const s=goodSEE(g,R); const o=obligation(g.cat,s.see,s.method); const qty=c.exportQty[g.heading]||0; const share=(c.cn8[g.heading]||[]).length||1;
    const q=qty/share; return {...g,...s,o,q,certs:o.perT*q,eur:o.perT*q*P.v}; });
  const tc=rows.reduce((x,r)=>x+r.certs,0), te=rows.reduce((x,r)=>x+r.eur,0);
  const cp=c.cp;
  return `
  <div class="crumb">EU CBAM · operator</div>
  <h1>Free allocation & carbon price</h1>
  <p class="lede">Two data items your customer needs from you besides embedded emissions: the free-allocation adjustment for each good, and — only if certified — the carbon price paid where the goods were made. TerraCAP shows an indicative exposure so you can see what your data is worth to them. It is not the importer’s liability; only the declarant can determine that.</p>

  <div class="card">
    <h2>Free-allocation adjustment — goes into your operator report</h2>
    <p class="sub">Specific embedded free allocation (SEFA) = CBAM benchmark for the good and route × CBAM factor for the production year (${(REF.cbamFactor[c.year]*100).toFixed(1)}% in ${c.year}).</p>
    <div class="tw"><table class="t"><thead><tr><th>CN code</th><th>Method</th><th class="r">Benchmark</th><th>Route</th><th class="r">CBAM factor</th><th class="r">SEFA, tCO₂e/t</th><th>Benchmark source</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td class="mono">${r.cn8}</td><td>${r.method==='default'?'<span class="tag t-coral">Default</span>':'<span class="tag t-teal">Actual</span>'}</td><td class="r num">${fmt(r.o.bm,3)}</td><td class="mono">${r.o.route!=='_'?r.o.route:'—'}</td><td class="r num">${(r.o.cf*100).toFixed(1)}%</td><td class="r num"><b>${fmt(r.o.sefa,3)}</b></td><td>${PB.ref()} <span class="small muted">placeholder</span></td></tr>`).join('')}</tbody></table></div>
    <p class="small muted mt">2025/2620 may set a different benchmark for default-data goods than for actual-data goods. Both columns load from that Act once its Annex values are in the reference data.</p>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between"><h2>Carbon price paid in India (Article 9)</h2><span class="tag ${cpCertified()?'t-teal':'t-amber'}">${cpCertified()?'Certified':'Not certified — nothing passed on'}</span></div>
    <p class="sub">Nothing reaches your customer until three gates are met: an independent person has certified the carbon price report, the goods use actual values that have been verified for the year, and a price was actually paid. The governing implementing act is still a draft (${RULESET.items.find(x=>x.k==='a9').ver}). Whether CCTS compliance counts as a price “effectively paid” is unresolved, particularly where no CCCs were bought.</p>
    <div class="grid3">
      <div class="f"><div class="fl">CCCs bought for the period ${PB.entry('ICM Registry statement')}</div><div class="fu"><input type="number" value="${a.cccBought}" onchange="S.cbam.a9.cccBought=+this.value;render()"><span>certs</span></div></div>
      <div class="f"><div class="fl">Average price paid ${PB.entry('Exchange contract notes')}</div><div class="fu"><input type="number" value="${a.cccPrice}" onchange="S.cbam.a9.cccPrice=+this.value;render()"><span>₹ / cert</span></div></div>
      <div class="f"><div class="fl">Rebates and compensation ${PB.entry('Reduces the price counted')}</div><div class="fu"><input type="number" value="${a.rebate}" onchange="S.cbam.a9.rebate=+this.value;render()"><span>₹</span></div></div>
    </div>
    <h3 class="mt">Certification by an independent person</h3>
    <div class="grid2">
      <div class="f"><div class="fl">Certifier ${PB.entry()}</div><input class="fi" value="${esc(cp.certifier)}" oninput="S.cbam.cp.certifier=this.value" onchange="render()" placeholder="Name of the independent person / firm"></div>
      <div class="f"><div class="fl">Accreditation or qualification ${PB.entry()}</div><input class="fi" value="${esc(cp.accred)}" oninput="S.cbam.cp.accred=this.value" onchange="render()" placeholder="May be your CBAM verifier"></div>
      <div class="f"><div class="fl">Carbon price report reference ${PB.ev()}</div><input class="fi" value="${esc(cp.ref)}" oninput="S.cbam.cp.ref=this.value" onchange="render()"></div>
      <div class="f"><div class="fl">Date certified ${PB.ev()}</div><input class="fi" type="date" value="${cp.date}" onchange="S.cbam.cp.date=this.value;render()"></div>
    </div>
    <label class="chk"><input type="checkbox" ${cp.certified?'checked':''} onchange="S.cbam.cp.certified=this.checked;render()">The certified report is uploaded to the evidence binder.</label>
    <div class="tw mt"><table class="t"><thead><tr><th>CN code</th><th class="c">Certified</th><th class="c">Actual values, verified</th><th class="c">Price paid</th><th>Passed to customer</th></tr></thead>
      <tbody>${rows.map(r=>{const G=r.o.gates;const y=v=>v?'<span class="tag t-teal">Yes</span>':'<span class="tag t-coral">No</span>';return `<tr><td class="mono">${r.cn8}</td><td class="c">${y(G.certified)}</td><td class="c">${y(G.actual)}</td><td class="c">${y(G.paid)}</td><td>${r.o.secppEligible?`€${fmt(r.o.secpp,2)} / t of good`:'Nothing — gate not met'}</td></tr>`;}).join('')}</tbody></table></div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between"><h2>Indicative exposure for your customer</h2><span class="tag t-amber">Indicative — not the importer’s liability</span></div>
    <p class="sub">Certificates per tonne = max[0; SEE − SEFA − SECPP ÷ RP] (Commission Guidance No. 1, §2.4.2), then × tonnes exported. Tonnes are split evenly across the codes under each heading until dispatch data is linked.</p>
    <table class="t" style="max-width:760px;margin-bottom:10px"><tbody>
      <tr><td style="width:90px"><b>SEE</b></td><td>Specific embedded emissions — tCO₂e embedded in one tonne of the good, precursors included (Embedded emissions screen)</td></tr>
      <tr><td><b>SEFA</b></td><td>Specific embedded free allocation — CBAM benchmark × CBAM factor (97.5% in 2026); the part an EU producer would still get free, so the importer doesn’t pay for it</td></tr>
      <tr><td><b>SECPP</b></td><td>Specific embedded carbon price paid — carbon price already paid in India, in € per tonne of good; zero unless certified</td></tr>
      <tr><td><b>RP</b></td><td>Reference price of a CBAM certificate, €/tCO₂e — turns the € of SECPP into a number of certificates</td></tr>
      <tr><td><b>max[0; …]</b></td><td>The result can’t go below zero</td></tr>
    </tbody></table>
    <div class="grid2" style="max-width:640px">
      <div class="f"><div class="fl">Certificate price reference ${PB.ref()}</div><select class="fi" onchange="S.cbam.pricePeriod=this.value;render()">${PRICES.map(x=>`<option value="${x.p}" ${x.v==null?'disabled':''} ${x.p===P.p?'selected':''}>${x.p} — ${x.v!=null?'€'+x.v.toFixed(2):'not loaded'}</option>`).join('')}</select><div class="fh">${P.src}. Prices are quarterly averages in 2026 and weekly from 2027. The declarant buys at the price for its own purchase period.</div></div>
      <div class="f"><div class="fl">Annual reference price for the carbon-price conversion ${PB.ref()}</div><input class="fi" readonly value="€${rpProvisional().toFixed(2)} provisional"><div class="fh">Average of the loaded quarterly prices until the Commission publishes the annual figure.</div></div>
    </div>
    <div class="tw"><table class="t"><thead><tr><th>CN code</th><th class="r">SEE</th><th class="r">SEFA</th><th class="r">Certificates / t</th><th class="r">Tonnes</th><th class="r">Certificates</th><th class="r">€ indicative</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td class="mono">${r.cn8}</td><td class="r num">${fmt(r.see,3)}</td><td class="r num">${fmt(r.o.sefa,3)}</td><td class="r num">${fmt(r.o.perT,3)}</td><td class="r num">${fmt(r.q)}</td><td class="r num">${fmt(r.certs)}</td><td class="r num">${Math.round(r.eur).toLocaleString('en-GB')}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td colspan="5">Total at ${P.p} price</td><td class="r num">${fmt(tc)}</td><td class="r num">${Math.round(te).toLocaleString('en-GB')}</td></tr></tfoot></table></div>
    <div class="row mt small">${S.setup.cns.map(h=>`<label>Tonnes to EU under ${h} <input type="number" value="${c.exportQty[h]||0}" onchange="S.cbam.exportQty['${h}']=+this.value;render()" style="width:110px;border:1px solid var(--line);border-radius:5px;padding:3px 6px"></label>`).join('')}</div>
    <p class="src mt">${stamp()}</p>
  </div>
  <div class="btns"><button class="btn btn-p" onclick="go('c_verify')">Monitoring plan & verification</button></div>`;
}

function sCVerify(){
  const c=S.cbam, v=c.ver, R=seeAll(), add=addendumRequired(R);
  const anyDefaultPrec = Object.values(c.prec).flat().some(p=>p.basis==='default');
  const actualGoods = selectedCN8().filter(g=>(c.method[g.cn8]||'actual')==='actual');
  const stages=[
    ['mp','Monitoring plan drafted, in English','From your production processes, source streams and attribution. TerraCAP drafts it; you approve it.','mp_cbam'],
    ['contracted','Verifier contracted','Accredited by an EU national accreditation body for your sector. Contract early — plan assessment and the site visit can happen during the year.','verifier'],
    ['mpAssessed','Verifier assesses the monitoring plan','Non-conformities are fixed before year end, not after.','mpfind'],
    ['site','Site visit','At least one, scheduled by the verifier.','site'],
    ['report','Operator’s emissions report compiled for the year','After 31 December: by production process and 8-digit CN code, with the summary emissions report and the free-allocation data.','opreport'],
    ['vr','Verification report issued','The positive verification statement is what lets declarants use your actual values. In Registry release 3.2 (July 2026) upload of verification reports by verifiers is reserved for future functionality; until it goes live the verifier issues a PDF, which you share alongside your Registry record.',''],
    ['closed','Misstatements and non-conformities closed','Corrections made; recommendations logged for next year’s plan.','mpfind']
  ];
  const items=[
    {t:'Operator’s emissions report (Commission template)', s:'Per production process and 8-digit CN code: activity levels, attributed emissions, precursors, SEE.', ok:v.report, m:'Built at year end from this module.'},
    {t:'Summary emissions report', s:'Generated with the operator’s report.', ok:v.report, m:'Generated with the operator’s report.'},
    {t:'Free-allocation adjustment data', s:'SEFA per good from the Free allocation screen.', ok:v.report, m:'Comes from the Free allocation screen — needs the 2025/2620 benchmarks loaded.'},
    {t:'Declarant-specific electricity addendum', s:add.why, ok:!add.req, m:add.why},
    {t:'Supplier verification reports for purchased precursors on actual data', s:'All on file.', ok:!c.prec || !Object.values(c.prec).flat().some(p=>p.src==='buy'&&p.basis==='supplier'&&!p.vr), m:'One per supplier, covering the year the precursor was produced.'},
    {t:'Laboratory analyses and meter calibration', s:'', ok:false, m:'Shared with the CCTS binder — one upload serves both.'},
    {t:'Certified carbon price report', s:'Certified and uploaded.', ok:!!cpCertified(), m:'Only if you pass a carbon-price deduction on.'},
    {t:'Production-month evidence for dispatches', s:'Linked.', ok:c.prodEvidence, m:'Optional — supports a customer who needs production-date evidence.'},
    {t:'Records kept six years', s:'TerraCAP retains the ledger, evidence and every issued version.', ok:true, m:''}
  ];
  return `
  <div class="crumb">EU CBAM · operator</div>
  <h1>Monitoring plan & verification</h1>
  <p class="lede">Verification is annual and product-level. One verification of your operator’s report for calendar year ${c.year} covers every good and every shipment produced at the installation in that year. Shipments are never verified one by one.</p>
  ${!actualGoods.length?`<div class="note n-info"><span class="i">i</span><div>All your codes are set to default values, so no verification is needed this year. Your customers will use defaults.</div></div>`:''}
  <div class="card">
    <h2>Verification workflow — CY${c.year}</h2>
    ${stages.map(([k,t,d,tp],i)=>`<div class="bi ${v[k]?'ok':'miss'}"><div class="bx">${v[k]?'✓':i+1}</div><div><div class="bt">${t}</div><div class="bs">${d}</div>${tp?`<div class="mt" style="margin-top:6px">${tplButtons(tp)}</div>`:''}</div><div class="ba"><label class="chk"><input type="checkbox" ${v[k]?'checked':''} onchange="S.cbam.ver['${k}']=this.checked;render()">Done</label></div></div>`).join('')}
    <div class="grid2 mt">
      <div class="f"><div class="fl">Verifier ${PB.entry('Not your ACVA or EmAEA unless also EU-accredited for CBAM')}</div><input class="fi" value="${esc(c.verifier)}" oninput="S.cbam.verifier=this.value" placeholder="Verifier, accreditation body, certificate no."></div>
      <div class="f"><div class="fl">CBAM Registry</div><label class="chk"><input type="checkbox" ${c.registry?'checked':''} onchange="S.cbam.registry=this.checked;render()">Operator and installation registered (recommended — lets you disclose to declarants without sending the full report)</label></div>
    </div>
  </div>
  <div class="card">
    <h2>Electricity used in production</h2>
    <div class="seg"><button class="${c.elecBasis==='default'?'on':''}" onclick="S.cbam.elecBasis='default';render()">Commission default factor</button><button class="${c.elecBasis==='actual'?'on':''}" onclick="S.cbam.elecBasis='actual';render()">Actual (own generation or PPA)</button></div>
    <div class="note ${add.req?'n-warn':'n-info'}"><span class="i">${add.req?'!':'i'}</span><div><b>Addendum ${add.req?'required':'not required'}.</b> ${add.why}</div></div>
  </div>
  <div class="card"><div class="row" style="justify-content:space-between"><h2>Report and evidence pack</h2><span class="tag t-gray">${items.filter(i=>i.ok).length} of ${items.length}</span></div>${binder(items)}</div>
  <div class="btns"><button class="btn btn-p" onclick="go('c_handoff')">Customer package</button></div>`;
}

/* ════════════════════════════════════════════════════════════════════════
   10 · CUSTOMER PACKAGE — the handoff contract
   ════════════════════════════════════════════════════════════════════════ */
function handoffRows(){
  const R=seeAll(), c=S.cbam;
  return selectedCN8().map(g=>{const s=goodSEE(g,R); const o=obligation(g.cat,s.see,s.method); const r=R[g.cat];
    return {g,s,o, prec: s.method==='actual' && r ? r.lines.map(l=>`${l.label||CATS[l.cat].name} (${l.src==='own'?'own process':l.basis==='default'?'default':'supplier actual'})`).join('; ') : '—'};});
}
function dispatchV4(){
  const to=document.getElementById('dcust').value, rows=handoffRows();
  S.cbam.dispatch.filter(d=>d.to===to).forEach(d=>d.state='Superseded');
  S.cbam.dispatch.push({v:'v'+(S.cbam.dispatch.filter(d=>d.to===to).length+1), to, date:new Date().toISOString().slice(0,10), codes:rows.length, ruleset:RULESET.id, verified:S.cbam.ver.vr, state:'Current'});
  render();
}
function sHandoff(){
  const c=S.cbam, rows=handoffRows(), verified=c.ver.vr;
  const field=(k,v,src)=>`<tr><td style="width:260px">${k}</td><td>${v}</td><td style="width:140px">${src||''}</td></tr>`;
  return `
  <div class="crumb">EU CBAM · operator</div>
  <h1>Customer package</h1>
  <p class="lede">What each EU customer receives from you — no more, no less. The package gives them what they need to prepare their declaration. It does not determine their liability. Authorisation, customs, the de minimis test, inward processing, the declaration and certificates all sit with the importer and are outside this module.</p>
  ${!verified?`<div class="note n-warn"><span class="i">!</span><div><b>Not yet verified.</b> You can share draft figures for planning; they go out marked “unverified — not for use in a CBAM declaration”.</div></div>`:''}
  <div class="card">
    <h2>Installation and period</h2>
    <table class="t"><tbody>
      ${field('Operator', PLATFORM.entity, PB.plat('Company master'))}
      ${field('Installation', PLATFORM.installation+' · Odisha, India', PB.plat('Asset register'))}
      ${field('CBAM Registry operator / installation ID', c.registry?'Registered — ID shown in the Registry':'Not registered — package sent as PDF + Commission template', c.registry?PB.plat():PB.entry())}
      ${field('Reporting period', 'Calendar year '+c.year+' (production year)', PB.calc())}
      ${field('Verification report', verified?`Issued in the CBAM Registry · ${esc(c.verifier||'verifier')}`:'Pending', verified?PB.ev():PB.entry())}
      ${field('Rule and reference-data version', stamp(), PB.ref())}
    </tbody></table>
  </div>
  <div class="card">
    <h2>Per good</h2>
    <div class="tw"><table class="t"><thead><tr><th>CN code</th><th>Route</th><th>Method</th><th class="r">SEE direct</th><th class="r">SEE indirect</th><th>Precursors and their basis</th><th class="r">SEFA</th><th>Carbon price</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td class="mono">${r.g.cn8}</td><td class="mono">${c.route[r.g.cat]||'—'}</td><td>${r.s.method==='default'?'Default — customer applies Commission value':'Actual'}</td>
      <td class="r num">${r.s.method==='default'?'—':fmt(r.s.see-r.s.indirect,3)}</td><td class="r num">${r.s.method==='default'?'—':fmt(r.s.indirect,3)}</td><td class="small">${r.prec}</td><td class="r num">${fmt(r.o.sefa,3)}</td>
      <td>${r.o.secppEligible?`€${fmt(r.o.secpp,2)}/t · cert. ${esc(c.cp.ref)}`:'None provided'}</td></tr>`).join('')}</tbody></table></div>
    <p class="small muted mt">Indirect SEE shown is the electricity carried in from sintered ore. For Annex II goods, the declarant applies the scope rule for its declaration.</p>
  </div>
  <div class="card">
    <h2>Not in this package</h2>
    <p class="sub mb0">Importer liability, certificate quantities and prices, the 50-tonne de minimis test, customs procedure (including inward processing) and the date of release for free circulation. These are the declarant’s. The indicative figures on the Free allocation screen stay inside TerraCAP.</p>
  </div>
  <div class="card">
    <h2>Send and track</h2>
    <div class="row"><select class="fi" id="dcust" style="max-width:320px"><option>Nordhafen Stahlhandel GmbH (demo)</option><option>Rotterdam Metals Trading BV (demo)</option><option>Adriatica Acciai SpA (demo)</option></select>

    <div class="tw"><table class="t mt"><thead><tr><th>Version</th><th>Declarant</th><th>Issued</th><th class="r">Codes</th><th>Rule set</th><th>Status</th><th>State</th></tr></thead>
    <tbody>${c.dispatch.length?c.dispatch.map(d=>`<tr><td class="mono">${d.v}</td><td>${d.to}</td><td class="mono">${d.date}</td><td class="r num">${d.codes||'—'}</td><td class="mono small">${d.ruleset||'—'}</td><td>${d.verified?'<span class="tag t-teal">Verified</span>':'<span class="tag t-amber">Unverified draft</span>'}</td><td><span class="tag ${d.state==='Current'?'t-teal':'t-gray'}">${d.state}</span></td></tr>`).join(''):'<tr><td colspan="7" class="empty">Nothing issued yet.</td></tr>'}</tbody></table></div>
    <p class="small muted mt">If a figure changes after issue, the earlier version for that declarant is marked superseded and the declarant is notified.</p>
  </div>`;
}

/* ════════════════════════════════════════════════════════════════════════
   RULES & VERSIONS

function sRules(){
  return `
  <div class="crumb">EU CBAM · operator</div>

/* ---------- embedded electricity per tonne (for the Registry's "electricity consumed" field) ---------- */
function elecAll(){
  const R=seeAll(), out={};
  processes().forEach(k=>{
    const act=S.cbam.activity[k]||0, own=(PLATFORM.elec.byProc[k]||0);
    let carried=0, unknown=false;
    (S.cbam.prec[k]||[]).forEach(p=>{
      if(p.src==='own' && out[p.cat]){ carried += p.qty*out[p.cat].perT; if(out[p.cat].unknown) unknown=true; }
      else if(p.src==='buy'){ const v=S.reg.elecSupplierMWh[k+':'+p.cat]; if(v==null) unknown=true; else carried += p.qty*v; }
    });
    out[k]={own:act?own/act:0, perT:act?(own+carried)/act:0, unknown};
  });
  return out;
}

/* ---------- Registry emissions record (one per installation × production year) ---------- */
function registryRecord(){
  const R=seeAll(), E=elecAll(), D=domCalc();
  return selectedCN8().map((g,i)=>{
    const s=goodSEE(g,R), o=obligation(g.cat,s.see,s.method), e=E[g.cat]||{perT:0,unknown:true};
    const route=S.cbam.route[g.cat];
    const direct = s.method==='default' ? null : s.see - s.indirect;
    const paidINR = Math.max(0, S.cbam.a9.cccBought*S.cbam.a9.cccPrice - S.cbam.a9.rebate);
    const effINRperT = (D.scope1+D.scope2) ? paidINR/(D.scope1+D.scope2) : 0;
    return {
      item:i+1, hs:g.cn8.replace(/\s/g,'').slice(0,6), cn:g.cn8.replace(/\s/g,''), taric: g.cn8.startsWith('2507 00 80') ? 'required — calcined / not calcined' : '—',
      desc:(CN8[g.heading]||[]).find(r=>r[0]===g.cn8)?.[1] || headingOf(g.heading)[1],
      routeId: route||'—', routeName: route?ROUTES[route]:'—', method:s.method,
      direct, elecMWh:e.perT, elecUnknown:e.unknown, efKnown:S.cbam.elecBasis==='actual',
      warn: direct!=null && direct>20, qual:QUAL[g.cat]||[],
      cp: o.secppEligible ? {form:S.reg.cpForm, legal:S.reg.cpLegal, dueINR: effINRperT*(s.see||0), currency:'INR', country:'IN', covered:s.see, rebateCovered:0} : null
    };
  });
}
